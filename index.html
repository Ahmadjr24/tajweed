function drawWheel(){
  const items = document.querySelectorAll("#drumIn .wi"); if(!items.length) return;
  const Rr = WH.IH / (2*Math.tan(WH.A*Math.PI/360));
  $("drumIn").style.transform = `translateZ(${-Rr}px)`;
  items.forEach((el,i)=>{
    const ang = (i - WH.pos) * WH.A;
    if(Math.abs(ang) > 88){ el.style.visibility = "hidden"; return; }
    el.style.visibility = "visible";
    el.style.transform = `translateY(-50%) rotateX(${-ang}deg) translateZ(${Rr}px)`;
    el.style.opacity = Math.pow(Math.cos(ang*Math.PI/180), 1.6).toFixed(3);
  });
  const ci = Math.max(0, Math.min(CH.length-1, Math.round(WH.pos)));
  if(ci !== WH.last){ items.forEach((el,i)=>el.classList.toggle("on", i===ci)); WH.last = ci; drawPreview(ci); }
}
function drawPreview(i){
  const c = CH[i], part = PARTS.find(p=>p[0]===c.part)[1], el = $("whPrev"); if(!el) return;
  el.className = "wh-prev c-"+c.c;
  el.innerHTML = `<span class="crumb">${part}</span><h2>${c.t}</h2>
    <div class="meta">${c.rules.length?`<span class="tag">${LF.ofRules(c.rules.length)}</span>`:""}${S.read[c.id]?`<span class="tag rd">${tx("مقروء ✓")}</span>`:""}</div>
    ${c.rules.length?`<div class="mini">${c.rules.slice(0,5).map(r=>`<span>${r.name}</span>`).join("")}${c.rules.length>5?`<span class="mut">${LF.more(c.rules.length-5)}</span>`:""}</div>`:""}
    <button class="btn pri" data-goch="${c.id}">${tx("افتح الدرس")}</button>`;
  const g = G(); if(g) g.fromTo(el.children,{opacity:0,y:8},{opacity:1,y:0,duration:.25,stagger:.03,ease:"power2.out",overwrite:true});
}
function spinTo(target, dur, done){
  target = Math.max(0, Math.min(CH.length-1, target));
  if(WH.tw) WH.tw.kill();
  const g = G();
  if(!g){ WH.pos = target; drawWheel(); if(done) done(); return; }
  WH.tw = g.to(WH, {pos:target, duration:dur, ease:"power3.out", onUpdate:drawWheel, onComplete:done});
}
function openFromWheel(i){
  const el = document.querySelector(`#drumIn .wi[data-wi="${i}"]`), g = G();
  spinTo(i, .45, ()=>{ if(g && el) g.fromTo(el,{scale:1},{scale:1.08,duration:.14,yoyo:true,repeat:1,onComplete:()=>{ location.hash = "c-"+CH[i].id; }}); else location.hash = "c-"+CH[i].id; });
}
function bindWheel(){
  const w = $("wheel"); if(!w) return;
  let on=false, sy=0, sp=0, moved=false, samples=[], wheelT=null;
  w.addEventListener("pointerdown", e=>{
    if(e.button>0 || e.target.closest(".wh-prev button")) return;
    on=true; moved=false; sy=e.clientY; sp=WH.pos; samples=[[performance.now(), WH.pos]];
    if(WH.tw) WH.tw.kill();
  });
  w.addEventListener("pointermove", e=>{
    if(!on) return; const dy = e.clientY - sy;
    if(!moved && Math.abs(dy)>6){ moved=true; try{ w.setPointerCapture(e.pointerId); }catch(_){} }
    if(!moved) return;
    let p = sp - dy/WH.IH; const max = CH.length-1;
    if(p<0) p = p*.35; if(p>max) p = max + (p-max)*.35;
    WH.pos = p; drawWheel();
    samples.push([performance.now(), p]); if(samples.length>6) samples.shift();
  });
  const end = e=>{
    if(!on) return; on=false;
    if(!moved){ const it = e.target.closest(".wi"); if(it) openFromWheel(+it.dataset.wi); return; }
    const a = samples[0], b = samples[samples.length-1], dt = Math.max(16, b[0]-a[0]);
    const v = (b[1]-a[1]) / dt * 1000; /* items per second */
    const target = Math.round(WH.pos + v*0.32);
    spinTo(target, Math.min(1.8, Math.max(.35, Math.abs(v)*0.09 + .3)));
  };
  w.addEventListener("pointerup", end); w.addEventListener("pointercancel", end);
  w.addEventListener("wheel", e=>{
    e.preventDefault(); if(WH.tw) WH.tw.kill();
    WH.pos = Math.max(-.4, Math.min(CH.length-.6, WH.pos + e.deltaY/WH.IH*.55)); drawWheel();
    clearTimeout(wheelT); wheelT = setTimeout(()=>spinTo(Math.round(WH.pos), .35), 120);
  }, {passive:false});
}
document.addEventListener("keydown", e=>{
  if($("v-wheel").classList.contains("on")){
    if(e.key==="ArrowDown"){ e.preventDefault(); spinTo(Math.round(WH.pos)+1,.3); }
    if(e.key==="ArrowUp"){ e.preventDefault(); spinTo(Math.round(WH.pos)-1,.3); }
    if(e.key==="Enter" && !e.target.closest("button")){ openFromWheel(Math.round(WH.pos)); }
  }
  if($("v-cards").classList.contains("on") && !e.target.closest("input")){
    const fw = LANG==="ar" ? "ArrowLeft" : "ArrowRight", bw = LANG==="ar" ? "ArrowRight" : "ArrowLeft";
    if(e.key===fw){ e.preventDefault(); goCard(1); }
    if(e.key===bw){ e.preventDefault(); goCard(-1); }
  }
});

/* ---------- search ---------- */
let IDX = [], fuse = null;
const unacc = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[ʿʾ’']/g,"");
function buildIndex(){
  IDX = [];
  CH.forEach(c=>{ IDX.push({t:c.t, s:tx("درس"), ch:c.id, n:norm(unacc(c.t))}); c.b.forEach(b=>{ if(b.k==="rule") IDX.push({t:b.name, s:c.t, ch:c.id, r:b.id, n:norm(unacc([b.name,b.arName||"",b.alt||"",b.l||"",b.def,b.tip||"",b.cond.join(" ")].join(" ")))}); if(b.k==="h") IDX.push({t:b.t, s:c.t, ch:c.id, n:norm(unacc(b.t))}); }); });
  fuse = null; try { if(window.Fuse) fuse = new Fuse(IDX, {keys:["n"], threshold:0.3, ignoreLocation:true, minMatchCharLength:2}); } catch(e) {}
}
buildIndex();
function renderSearch(){
  $("v-search").innerHTML = `<h1 class="ph">${tx("البحث")}</h1>
    <input class="srch" id="srch" type="search" placeholder="${tx("ابحث عن حكم أو حرف، مثل: إخفاء")}" autocomplete="off" aria-label="${tx("البحث في الأحكام")}">
    <div class="res" id="res"></div>`;
  doSearch("");
}
function doSearch(v){
  const qn = norm(unacc(v)).trim(); let out;
  if(!qn) out = [];
  else if(fuse) out = fuse.search(qn, {limit:30}).map(x=>x.item);
  else out = IDX.filter(x=>x.n.includes(qn)).slice(0,30);
  $("res").innerHTML = !qn ? `<p class="mut" style="margin:4px 4px 0">${LF.searchHint(CH.length, R.length)}</p>`
    : out.length ? out.map(x=>`<button class="hit c-${CMAP[x.ch].c}" ${x.r?`data-goto="${x.r}"`:`data-goch="${x.ch}"`}><b>${x.t}</b><small>${x.s}</small></button>`).join("")
    : `<p class="mut">${tx("لا توجد نتائج. جرّب كلمة أقصر.")}</p>`;
}

/* ---------- router & events ---------- */
const VIEWS = ["home","ch","wheel","cards","search"];
function route(){
  const h = location.hash.slice(1); let v = h, ch = null;
  if(h.startsWith("c-") && CMAP[h.slice(2)]){ v = "ch"; ch = h.slice(2); }
  if(!VIEWS.includes(v) || (v==="ch" && !ch)) v = "home";
  if(v==="wheel"){ S.lview = "wheel"; save(); }
  if(v==="home" && S.lview==="wheel") v = "wheel";
  stopAudio(); clearInterval(showBeats.t); clearTimeout(tourT);
  VIEWS.forEach(x=>$("v-"+x).classList.toggle("on", x===v));
  const tab = (v==="ch" || v==="wheel") ? "home" : v;
  document.querySelectorAll("nav.tabs a").forEach(a=>{ if(a.dataset.v===tab) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(v==="home"){ renderHome(); heroIntro(); animateRosette(); }
  if(v==="ch"){ renderChapter(ch); initMouths(); }
  if(v==="cards") renderCards();
  if(v==="wheel") renderWheel();
  document.body.style.overflow = v==="wheel" ? "hidden" : "";
  if(v==="search" && !$("srch")) renderSearch();
  if(v==="ch" && pendingRule){ const el = $("r-"+pendingRule); pendingRule = null; if(el){ el.scrollIntoView({block:"start"}); return; } }
  window.scrollTo(0,0);
}
function gotoRule(id){ const r = BYID[id]; if(!r) return; pendingRule = id; if(location.hash==="#c-"+r.ch) route(); else location.hash = "c-"+r.ch; }
document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.clip) return startQueue(t, [clipURL(t.dataset.clip)], "clip");
  if(t.dataset.ayah) return startQueue(t, AY[t.dataset.ayah].map(([c,v])=>`https://everyayah.com/data/Alafasy_128kbps/${P3(c)}${P3(v)}.mp3`), "ayah");
  if(t.dataset.playall) return playAll(t, t.dataset.playall);
  if(t.dataset.scroll){ const el = $("r-"+t.dataset.scroll); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"}); return; }
  if(t.dataset.goto) return gotoRule(t.dataset.goto);
  if(t.dataset.goch){ location.hash = "c-"+t.dataset.goch; return; }
  if(t.dataset.letter){ clearTimeout(tourT); const w = t.closest("[data-lx]"); w.querySelectorAll("button[data-letter]").forEach(b=>b.setAttribute("aria-pressed", b===t)); $(w.dataset.lx).innerHTML = lettersInfo(t.dataset.letter); mouthTo($(w.dataset.mouth), t.dataset.letter); return; }
  if(t.dataset.tour) return tour(t.dataset.tour);
  if(t.hasAttribute("data-hplay")) return heroPlay(t);
  if(t.hasAttribute("data-hnext")) return heroNext();
  if(t.hasAttribute("data-hexp")) return heroExplain(t);
  if(t.dataset.fletter){ const w = t.closest("[data-fd]"); w.querySelectorAll("button[data-fletter]").forEach(b=>b.setAttribute("aria-pressed", b===t)); $(w.dataset.fd).innerHTML = finderOut(w.dataset.kind, t.dataset.fletter); return; }
  if(t.dataset.beat) return showBeats(+t.dataset.beat);
  if(t.dataset.done){ const did = t.dataset.done; if(!S.read[did]){ S.fresh = (S.fresh||[]).filter(x=>x!==did); S.fresh.push(did); } S.read[did] = 1; save(); const n = CH[CMAP[t.dataset.done].i+1]; location.hash = n ? "c-"+n.id : "home"; return; }
  if(t.dataset.lang){ setLang(t.dataset.lang); return; }
  if(t.dataset.lview){ S.lview = t.dataset.lview; save(); if(location.hash==="#home" || location.hash==="") route(); else location.hash = "home"; return; }
  if(t.hasAttribute("data-cnext")) return goCard(1);
  if(t.hasAttribute("data-cprev")) return goCard(-1);
  if(t.hasAttribute("data-cshuf")){ shuffled = !shuffled; renderCards(); return; }
  if(t.dataset.scopev){ S.scope = t.dataset.scopev; save(); renderCards(); const b = document.querySelector(`[data-scopev="${S.scope}"]`); if(b) b.scrollIntoView({block:"nearest",inline:"center"}); return; }
  if(t.dataset.goscope){ S.scope = t.dataset.goscope; save(); location.hash = "cards"; return; }
});
document.addEventListener("click", e=>{ const tl = e.target.closest("[data-tile]"); if(tl) rosetteTap(tl.dataset.tile); });
document.addEventListener("keydown", e=>{ const tl = e.target.closest && e.target.closest("[data-tile]"); if(tl && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); rosetteTap(tl.dataset.tile); } });
document.addEventListener("input", e=>{ if(e.target.id==="srch") doSearch(e.target.value); });
window.addEventListener("hashchange", route);
function setLang(v){
  if(v===LANG) return;
  LANG = v; try { localStorage.setItem(LKEY, v); } catch(e) {}
  applyLang(); buildIndex(); $("v-search").innerHTML = ""; WH.last = -1; stopAudio();
  route();
}
route();

</script>
