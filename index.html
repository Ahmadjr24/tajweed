const TRD = {"مدخل إلى علم التجويد":["Introduction to tajweed","Introduktion til tajwīd"],"قبل التلاوة":["Before reciting","Før recitationen"],"الحروف: مخارجها وصفاتها":["The letters: articulation points and qualities","Bogstaverne: artikulationssteder og egenskaber"],"التفخيم والترقيق":["Heavy and light letters","Tunge og lette bogstaver"],"المدود":["Prolongation (madd)","Forlængelse (madd)"],"النون والميم واللام والإدغام":["Nūn, mīm, lām and merging","Nūn, mīm, lām og sammensmeltning"],"الهمز والتقاء الساكنين والنبر":["Hamzah, two sukūns and emphasis","Hamzah, to sukūn og betoning"],"الوقف والابتداء":["Stopping and starting","At stoppe og at begynde"],"خاتمة":["Closing","Afslutning"],"المقدمة ونشأة علم التجويد":["Introduction and the origin of tajweed","Indledning og tajwīds oprindelse"],"القرآن الكريم كلام الله، نزل به جبريل عليه السلام على قلب نبينا محمد ﷺ في ليلة القدر من شهر رمضان. جعل الله تلاوته عبادة، وجعل بكل حرف منه حسنة والحسنة بعشر أمثالها، وتكفّل بحفظه ويسّر تعلّمه وحفظه وتدبّره.":["The Noble Qurʾān is the speech of Allah. Jibrīl (peace be upon him) brought it down to the heart of our Prophet Muḥammad ﷺ on the Night of Decree in Ramaḍān. Allah made its recitation an act of worship, gave a good deed for every letter, and every good deed is multiplied ten times. He promised to preserve it and made it easy to learn, memorise and reflect upon.","Den Ædle Koran er Allahs tale. Jibrīl (fred være med ham) bragte den ned til vor Profet Muḥammads ﷺ hjerte i Skæbnenatten i ramadan. Allah gjorde recitationen til en tilbedelse, gav en god gerning for hvert bogstav, og hver god gerning ganges med ti. Han lovede at bevare den og gjorde den let at lære, huske og reflektere over."],"«إن لله أهلين في الأرض. قيل: من هم يا رسول الله؟ قال: أهل القرآن أهل الله وخاصته». رواه ابن ماجه.":["“Allah has His own people among mankind.” They asked: “Who are they, O Messenger of Allah?” He said: “The people of the Qurʾān are the people of Allah and His chosen ones.” Reported by Ibn Mājah.","“Allah har sine egne blandt menneskene.” De spurgte: “Hvem er de, o Allahs Sendebud?” Han sagde: “Koranens folk er Allahs folk og Hans udvalgte.” Overleveret af Ibn Mājah."],"نشأة علم التجويد":["How tajweed began","Hvordan tajwīd opstod"],"العرب الأوائل":["The first Arabs","De første arabere"],"نزل القرآن بلسان عربي مبين، وكان الصحابة عربًا فصحاء ينطقون حروفه بالطبع والسليقة، فلم يحتاجوا إلى قواعد.":["The Qurʾān was revealed in clear Arabic. The Companions were eloquent Arabs who pronounced its letters by nature and instinct, so they needed no rules.","Koranen blev åbenbaret på klart arabisk. Ledsagerne var veltalende arabere, der udtalte bogstaverne naturligt, så de behøvede ingen regler."],"اتساع الإسلام":["Islam spreads","Islam breder sig"],"دخل غير العرب في الإسلام، وبعض الحروف العربية ليست في لغاتهم، فصار بعضهم يبدل الحرف بأقرب حرف يألفه.":["Non-Arabs entered Islam. Some Arabic letters do not exist in their languages, so some replaced a letter with the closest one they knew.","Ikke-arabere kom til islam. Nogle arabiske bogstaver findes ikke i deres sprog, så nogle erstattede et bogstav med det nærmeste, de kendte."],"ضبط المصحف":["Marking the muṣḥaf","Markering af muṣḥaf"],"طلب عليّ بن أبي طالب رضي الله عنه من أبي الأسود الدؤلي وضع علامات الفتحة والضمة والكسرة، ثم وضع الخليل بن أحمد الفراهيدي النقاط على الحروف.":["ʿAlī ibn Abī Ṭālib (may Allah be pleased with him) asked Abū al-Aswad al-Duʾalī to add the marks for fatḥah, ḍammah and kasrah. Later al-Khalīl ibn Aḥmad al-Farāhīdī added the dots on the letters.","ʿAlī ibn Abī Ṭālib (må Allah være tilfreds med ham) bad Abū al-Aswad al-Duʾalī om at tilføje tegnene for fatḥah, ḍammah og kasrah. Senere tilføjede al-Khalīl ibn Aḥmad al-Farāhīdī prikkerne på bogstaverne."],"التدوين":["Writing it down","Nedskrivning"],"ظهرت المؤلفات في علم التجويد في حدود القرن الرابع الهجري، وكان قبل ذلك يُدرَّس مشافهة.":["Books on tajweed appeared around the 4th century AH. Before that it was taught orally.","Bøger om tajwīd opstod omkring det 4. århundrede e.H. Før det blev det undervist mundtligt."],"من حق القرآن علينا أن نجيد تلاوته وترتيله ونعمل به. ولا يكون ذلك إلا بدراسة أحكام التجويد وتطبيقها بالاستماع والقراءة على شيخ متقن.":["We owe the Qurʾān a beautiful, measured recitation and acting upon it. That only comes by studying the rules of tajweed and applying them, by listening to and reading with a skilled teacher.","Vi skylder Koranen en smuk og afmålt recitation og at handle efter den. Det sker kun ved at studere tajwīds regler og anvende dem ved at lytte til og læse for en dygtig lærer."],"القرآن الكريم":["The Noble Qurʾān","Den Ædle Koran"],"تعريف القرآن الكريم":["Definition of the Qurʾān","Definition af Koranen"],"هو كلام الله المعجز، المنزَّل على قلب نبينا محمد ﷺ، المتعبَّد بتلاوته، المكتوب بين دفتي المصحف، المنقول إلينا بالتواتر، المتحدَّى بأقصر سورة منه.":["The inimitable speech of Allah, revealed to the heart of our Prophet Muḥammad ﷺ, whose recitation is worship, written between the two covers of the muṣḥaf, transmitted to us by mass transmission (tawātur), and which challenges anyone to produce even its shortest sūrah.","Allahs uforlignelige tale, åbenbaret til vor Profet Muḥammads ﷺ hjerte, hvis recitation er tilbedelse, nedskrevet mellem muṣḥafens to omslag, overleveret til os ved massetradering (tawātur), og som udfordrer enhver til at frembringe blot dens korteste sūrah."],"بعض أسماء وأوصاف القرآن":["Some names and descriptions of the Qurʾān","Nogle navne og beskrivelser af Koranen"],"القرآن":["Al-Qurʾān (the Recitation)","Al-Qurʾān (Recitationen)"],"الفرقان":["Al-Furqān (the Criterion)","Al-Furqān (Skelnen)"],"هدى":["Hudā (Guidance)","Hudā (Vejledning)"],"نور":["Nūr (Light)","Nūr (Lys)"],"الكتاب":["Al-Kitāb (the Book)","Al-Kitāb (Bogen)"],"الذكر":["Al-Dhikr (the Reminder)","Al-Dhikr (Påmindelsen)"],"تنزيل":["Tanzīl (Revelation)","Tanzīl (Åbenbaring)"],"مثاني":["Mathānī (Oft-repeated)","Mathānī (Det gentagne)"],"موعظة":["Mawʿiẓah (Admonition)","Mawʿiẓah (Formaning)"],"مجيد":["Majīd (Glorious)","Majīd (Herlig)"],"عزيز":["ʿAzīz (Mighty)","ʿAzīz (Mægtig)"],"حكيم":["Ḥakīm (Wise)","Ḥakīm (Vis)"],"كريم":["Karīm (Noble)","Karīm (Ædel)"],"رحمة":["Raḥmah (Mercy)","Raḥmah (Barmhjertighed)"],"مبارك":["Mubārak (Blessed)","Mubārak (Velsignet)"],"تذكرة":["Tadhkirah (Reminder)","Tadhkirah (Påmindelse)"],"الفصل":["Al-Faṣl (the Decisive Word)","Al-Faṣl (Det afgørende ord)"],"بصائر":["Baṣāʾir (Insights)","Baṣāʾir (Indsigter)"],"كيف بلّغ النبي ﷺ الأمةَ القرآن؟":["How did the Prophet ﷺ convey the Qurʾān to the ummah?","Hvordan overbragte Profeten ﷺ Koranen til ummah?"],"بلّغهم مكتوبًا (مدوَّنًا)":["In writing","Skriftligt"],"كتابة كل مقطع فور نزوله بين يدي النبي ﷺ":["Each passage was written down as soon as it was revealed, in the presence of the Prophet ﷺ","Hvert afsnit blev skrevet ned, så snart det blev åbenbaret, i Profetens ﷺ nærvær"],"تفريغ تلك الكتابة في صحف في زمن أبي بكر الصديق رضي الله عنه":["Those writings were gathered into pages in the time of Abū Bakr al-Ṣiddīq","Skrifterne blev samlet på ark på Abū Bakr al-Ṣiddīqs tid"],"نسخ عدة مصاحف منها في زمن عثمان بن عفان رضي الله عنه":["Several muṣḥafs were copied from them in the time of ʿUthmān ibn ʿAffān","Flere muṣḥaf blev kopieret derfra på ʿUthmān ibn ʿAffāns tid"],"كتابة المسلمين نسخًا لا تُحصى من تلك المصاحف":["Muslims made countless copies of those muṣḥafs","Muslimer lavede utallige kopier af disse muṣḥaf"],"ظهور مؤلفات تضبط خصائص الكتابة القرآنية (علم رسم المصاحف)":["Books were written to fix the features of Qurʾānic spelling (the science of rasm)","Der blev skrevet bøger, der fastlagde Koranens retskrivning (rasm-videnskaben)"],"بلّغهم منطوقًا (النقل الصوتي)":["By voice (oral transmission)","Mundtligt (lydlig overlevering)"],"نزل جبريل عليه السلام بالقرآن على قلب النبي ﷺ بألفاظه ومعانيه":["Jibrīl brought the Qurʾān to the heart of the Prophet ﷺ, with its words and meanings","Jibrīl bragte Koranen til Profetens ﷺ hjerte med dens ord og betydninger"],"تلقّى الصحابة القرآن من فم رسول الله ﷺ وأعادوه أمامه حتى أقرّهم":["The Companions learned it from the mouth of the Messenger ﷺ and recited it back until he approved","Ledsagerne lærte den fra Sendebudets ﷺ mund og reciterede den tilbage, indtil han godkendte"],"نقله الصحابة إلى من بعدهم بالطريقة نفسها، وهكذا حتى وصل إلينا":["The Companions passed it on the same way, generation after generation, until it reached us","Ledsagerne gav den videre på samme måde, generation efter generation, indtil den nåede os"],"فضائل القرآن الكريم":["Virtues of the Qurʾān","Koranens fortrin"],"آيات في فضل القرآن":["Verses on the virtue of the Qurʾān","Vers om Koranens fortrin"],"أحاديث صحيحة في فضل القرآن":["Authentic hadiths on the virtue of the Qurʾān","Autentiske hadith om Koranens fortrin"],"خيركم من تعلّم القرآن وعلّمه.":["“The best of you are those who learn the Qurʾān and teach it.”","“De bedste af jer er dem, der lærer Koranen og underviser i den.”"],"عثمان بن عفان رضي الله عنه. رواه البخاري":["ʿUthmān ibn ʿAffān. Reported by al-Bukhārī","ʿUthmān ibn ʿAffān. Overleveret af al-Bukhārī"],"من قرأ حرفًا من كتاب الله فله به حسنة، والحسنة بعشر أمثالها. لا أقول الم حرف، ولكن ألف حرف ولام حرف وميم حرف.":["“Whoever reads a letter of the Book of Allah gets a good deed, and a good deed is multiplied by ten. I do not say Alif-Lām-Mīm is one letter; rather alif is a letter, lām is a letter and mīm is a letter.”","“Den, der læser et bogstav af Allahs Bog, får en god gerning, og en god gerning ganges med ti. Jeg siger ikke, at Alif-Lām-Mīm er ét bogstav; alif er et bogstav, lām er et bogstav og mīm er et bogstav.”"],"ابن مسعود رضي الله عنه. رواه الترمذي":["Ibn Masʿūd. Reported by al-Tirmidhī","Ibn Masʿūd. Overleveret af al-Tirmidhī"],"الماهر بالقرآن مع السفرة الكرام البررة، والذي يقرأ القرآن ويتتعتع فيه وهو عليه شاق له أجران.":["“The one skilled in the Qurʾān is with the noble, righteous scribes. And the one who recites it and stumbles, finding it hard, gets a double reward.”","“Den, der er dygtig i Koranen, er sammen med de ædle, retskafne skrivere. Og den, der reciterer den og snubler, fordi det er svært, får dobbelt belønning.”"],"عائشة رضي الله عنها. متفق عليه":["ʿĀʾishah. Agreed upon (al-Bukhārī and Muslim)","ʿĀʾishah. Overleveret af al-Bukhārī og Muslim"],"اقرؤوا القرآن فإنه يأتي يوم القيامة شفيعًا لأصحابه.":["“Read the Qurʾān, for it will come on the Day of Resurrection as an intercessor for its companions.”","“Læs Koranen, for den vil komme på Opstandelsens Dag som forbeder for sine følgesvende.”"],"أبو أمامة رضي الله عنه. رواه مسلم":["Abū Umāmah. Reported by Muslim","Abū Umāmah. Overleveret af Muslim"],"يقال لصاحب القرآن: اقرأ وارتقِ ورتّل كما كنت ترتّل في الدنيا، فإن منزلتك عند آخر آية تقرؤها.":["“It will be said to the companion of the Qurʾān: Read, rise, and recite as you used to recite in the world, for your rank is at the last verse you recite.”","“Der vil blive sagt til Koranens følgesvend: Læs, stig op og reciter, som du reciterede i verden, for din rang er ved det sidste vers, du reciterer.”"],"عبد الله بن عمرو رضي الله عنهما. رواه الترمذي":["ʿAbdullāh ibn ʿAmr. Reported by al-Tirmidhī","ʿAbdullāh ibn ʿAmr. Overleveret af al-Tirmidhī"],"إن الله يرفع بهذا الكتاب أقوامًا ويضع به آخرين.":["“Allah raises some people by this Book and lowers others by it.”","“Allah løfter nogle mennesker ved denne Bog og sænker andre ved den.”"],"عمر بن الخطاب رضي الله عنه. رواه مسلم":["ʿUmar ibn al-Khaṭṭāb. Reported by Muslim","ʿUmar ibn al-Khaṭṭāb. Overleveret af Muslim"],"ما اجتمع قوم في بيت من بيوت الله، يتلون كتاب الله ويتدارسونه بينهم، إلا نزلت عليهم السكينة، وغشيتهم الرحمة، وحفّتهم الملائكة، وذكرهم الله فيمن عنده.":["“No people gather in one of the houses of Allah, reciting the Book of Allah and studying it together, except that tranquillity descends upon them, mercy covers them, the angels surround them, and Allah mentions them to those with Him.”","“Ingen samles i et af Allahs huse, reciterer Allahs Bog og studerer den sammen, uden at roen sænker sig over dem, barmhjertigheden dækker dem, englene omgiver dem, og Allah nævner dem for dem, der er hos Ham.”"],"أبو هريرة رضي الله عنه. رواه مسلم":["Abū Hurayrah. Reported by Muslim","Abū Hurayrah. Overleveret af Muslim"],"آداب وسنن تلاوة القرآن":["Etiquette of reciting the Qurʾān","Etikette ved recitation af Koranen"],"الطهارة من الحدثين، وطهارة المكان والبدن والثياب، والتسوّك قبل القراءة.":["Purity from minor and major impurity, a clean place, body and clothes, and using the siwāk before reciting.","Renhed fra lille og stor urenhed, rent sted, krop og tøj, og brug af siwāk før recitationen."],"الإخلاص وقصد وجه الله تعالى بالقراءة والتعلّم والتعليم.":["Sincerity: reciting, learning and teaching only for the sake of Allah.","Oprigtighed: at recitere, lære og undervise alene for Allahs skyld."],"استقبال القبلة إن أمكن، واختيار مكان بعيد عن المشاغل.":["Facing the qiblah if possible, and choosing a place away from distractions.","At vende sig mod qiblah, hvis muligt, og vælge et sted uden forstyrrelser."],"مراعاة أحكام الاستعاذة والبسملة وأحكام التجويد.":["Observing the rules of istiʿādhah, basmalah and tajweed.","At følge reglerne for istiʿādhah, basmalah og tajwīd."],"استشعار الخشية، وتدبّر الآيات، وتحسين الصوت.":["Feeling humble awe, reflecting on the verses, and beautifying the voice.","At føle ydmyg ærefrygt, reflektere over versene og forskønne stemmen."],"مراعاة سجدات التلاوة، فيسجد كلما مرّ بآية سجدة.":["Observing the prostrations of recitation, prostrating at every verse of sajdah.","At overholde recitationens nedkastelser og kaste sig ned ved hvert sajdah-vers."],"العمل بالقرآن والتخلّق بأخلاقه.":["Acting on the Qurʾān and taking on its character.","At handle efter Koranen og tage dens karakter til sig."],"أن يكون له ورد يومي من القرآن، ويحرص على سماعه وحفظ ما يستطيع.":["Having a daily portion of the Qurʾān, listening to it, and memorising what one can.","At have en daglig del af Koranen, lytte til den og huske det, man kan."],"أن يقوم بالقرآن في صلاة الليل بما تيسّر.":["Standing with the Qurʾān in the night prayer, as much as is easy.","At stå med Koranen i natbønnen, så meget som er let."],"أن يحفظ نفسه من أكل الحرام، ولسانه من لغو الحديث.":["Guarding oneself from unlawful earnings and the tongue from idle talk.","At beskytte sig mod ulovlig indtægt og tungen mod tom snak."],"الحرص على تعليم القرآن وتبليغ آياته: «بلّغوا عني ولو آية».":["Being keen to teach the Qurʾān and convey its verses: “Convey from me, even one verse.”","At være ivrig efter at undervise i Koranen og formidle dens vers: “Formidl fra mig, om så blot ét vers.”"],"الدعاء لمن علّمه، وتوقير العلماء والمشايخ الذين نقلوا إلينا القرآن.":["Praying for those who taught you, and honouring the scholars and teachers who passed the Qurʾān on to us.","At bede for dem, der lærte dig, og ære de lærde og lærere, der har givet Koranen videre til os."],"القراءة والرواية والطريق":["Qirāʾah, riwāyah and ṭarīq","Qirāʾah, riwāyah og ṭarīq"],"القراءة":["Qirāʾah (reading)","Qirāʾah (læsemåde)"],"ما يُنسب إلى أحد أئمة القراء العشرة من كيفية القراءة على ما تلقّاه، مثل قراءة الإمام عاصم.":["What is attributed to one of the ten imams of recitation, as he received it, such as the reading of Imam ʿĀṣim.","Det, der tilskrives en af de ti recitationsimamer, sådan som han modtog det, f.eks. imam ʿĀṣims læsemåde."],"الرواية":["Riwāyah (narration)","Riwāyah (overlevering)"],"ما يُنسب إلى الآخذ عن إمام من القراء العشرة ولو بواسطة، مثل رواية حفص عن الإمام عاصم.":["What is attributed to someone who took it from one of the ten imams, even through an intermediary, such as Ḥafṣ’s narration from Imam ʿĀṣim.","Det, der tilskrives en, der tog det fra en af de ti imamer, selv gennem en mellemmand, f.eks. Ḥafṣ’ overlevering fra imam ʿĀṣim."],"الطريق":["Ṭarīq (path)","Ṭarīq (vej)"],"ما يُنسب إلى من أخذ عن الراوي وإن سفل، مثل طريق الشاطبية لرواية حفص عن عاصم.":["What is attributed to those who took it from the narrator, however far down, such as the Shāṭibiyyah path of Ḥafṣ from ʿĀṣim.","Det, der tilskrives dem, der tog det fra overleveren, uanset hvor langt nede, f.eks. Shāṭibiyyah-vejen for Ḥafṣ fra ʿĀṣim."],"القراء العشرة ورواتهم":["The ten reciters and their narrators","De ti recitatorer og deres overleverere"],"القارئ":["Reciter","Recitator"],"الراوي الأول":["First narrator","Første overleverer"],"الراوي الثاني":["Second narrator","Anden overleverer"],"١. نافع المدني":["1. Nāfiʿ of Madīnah","1. Nāfiʿ fra Madīnah"],"قالون":["Qālūn","Qālūn"],"ورش":["Warsh","Warsh"],"الشاطبية":["Shāṭibiyyah","Shāṭibiyyah"],"٢. ابن كثير المكي":["2. Ibn Kathīr of Makkah","2. Ibn Kathīr fra Makkah"],"البزي":["Al-Bazzī","Al-Bazzī"],"قنبل":["Qunbul","Qunbul"],"٣. أبو عمرو البصري":["3. Abū ʿAmr of Baṣrah","3. Abū ʿAmr fra Baṣrah"],"الدوري":["Al-Dūrī","Al-Dūrī"],"السوسي":["Al-Sūsī","Al-Sūsī"],"٤. ابن عامر الشامي":["4. Ibn ʿĀmir of Shām","4. Ibn ʿĀmir fra Shām"],"هشام":["Hishām","Hishām"],"ابن ذكوان":["Ibn Dhakwān","Ibn Dhakwān"],"٥. عاصم الكوفي":["5. ʿĀṣim of Kūfah","5. ʿĀṣim fra Kūfah"],"شعبة":["Shuʿbah","Shuʿbah"],"حفص":["Ḥafṣ","Ḥafṣ"],"٦. حمزة الكوفي":["6. Ḥamzah of Kūfah","6. Ḥamzah fra Kūfah"],"خلف":["Khalaf","Khalaf"],"خلاد":["Khallād","Khallād"],"٧. الكسائي الكوفي":["7. Al-Kisāʾī of Kūfah","7. Al-Kisāʾī fra Kūfah"],"أبو الحارث":["Abū al-Ḥārith","Abū al-Ḥārith"],"٨. أبو جعفر المدني":["8. Abū Jaʿfar of Madīnah","8. Abū Jaʿfar fra Madīnah"],"ابن وردان":["Ibn Wardān","Ibn Wardān"],"ابن جماز":["Ibn Jammāz","Ibn Jammāz"],"الدرة":["Al-Durrah","Al-Durrah"],"٩. يعقوب البصري":["9. Yaʿqūb of Baṣrah","9. Yaʿqūb fra Baṣrah"],"رويس":["Ruways","Ruways"],"روح":["Rawḥ","Rawḥ"],"١٠. خلف العاشر":["10. Khalaf al-ʿĀshir","10. Khalaf al-ʿĀshir"],"إسحاق":["Isḥāq","Isḥāq"],"إدريس":["Idrīs","Idrīs"],"أكثر الروايات انتشارًا في العالم الإسلامي رواية حفص عن عاصم. وسندها: حفص عن عاصم عن أبي عبد الرحمن السلمي عن عثمان بن عفان وعلي بن أبي طالب وزيد بن ثابت وعبد الله بن مسعود وأبيّ بن كعب رضي الله عنهم، عن رسول الله ﷺ.":["The most widespread narration in the Muslim world is Ḥafṣ from ʿĀṣim. Its chain: Ḥafṣ from ʿĀṣim, from Abū ʿAbd al-Raḥmān al-Sulamī, from ʿUthmān ibn ʿAffān, ʿAlī ibn Abī Ṭālib, Zayd ibn Thābit, ʿAbdullāh ibn Masʿūd and Ubayy ibn Kaʿb, from the Messenger of Allah ﷺ.","Den mest udbredte overlevering i den muslimske verden er Ḥafṣ fra ʿĀṣim. Kæden: Ḥafṣ fra ʿĀṣim, fra Abū ʿAbd al-Raḥmān al-Sulamī, fra ʿUthmān ibn ʿAffān, ʿAlī ibn Abī Ṭālib, Zayd ibn Thābit, ʿAbdullāh ibn Masʿūd og Ubayy ibn Kaʿb, fra Allahs Sendebud ﷺ."],"التجويد ومراتب التلاوة":["Tajweed and the speeds of recitation","Tajwīd og recitationens tempi"],"تعريفه":["Definition","Definition"],"العلم الذي يُعرف به النطق الصحيح للقرآن، بمعرفة مخارج الحروف وصفاتها وأحكامها. وهو إعطاء الحروف حقها ومستحقها مخرجًا وصفة ووقفًا وابتداءً.":["The science of pronouncing the Qurʾān correctly, by knowing the articulation points, qualities and rules of the letters. It means giving each letter its due, in articulation, quality, stopping and starting.","Videnskaben om at udtale Koranen korrekt ved at kende bogstavernes artikulationssteder, egenskaber og regler. Det betyder at give hvert bogstav dets ret i artikulation, egenskab, stop og start."],"موضوعه":["Subject","Emne"],"كلمات القرآن الكريم.":["The words of the Noble Qurʾān.","Den Ædle Korans ord."],"حكمه":["Ruling","Status"],"نظريًا: فرض كفاية. عمليًا: فرض عين.":["In theory: a communal obligation. In practice: an individual obligation.","I teori: en fælles pligt. I praksis: en personlig pligt."],"فضله":["Merit","Fortrin"],"من أشرف العلوم لتعلّقه بكتاب الله.":["One of the noblest sciences, because it is tied to the Book of Allah.","En af de ædleste videnskaber, fordi den er knyttet til Allahs Bog."],"غايته":["Aim","Mål"],"صون اللسان عن الخطأ، وإتقان اللفظ في تلاوة القرآن.":["Protecting the tongue from mistakes and perfecting pronunciation in reciting the Qurʾān.","At beskytte tungen mod fejl og fuldende udtalen i recitationen af Koranen."],"مسائله":["Topics","Indhold"],"الأحكام التجويدية التي تنشأ من تجاور الحروف.":["The rules that arise when letters meet.","De regler, der opstår, når bogstaver mødes."],"فائدته":["Benefit","Gavn"],"إرضاء الله تعالى، ونيل الأجر العظيم، والفوز بالسعادة في الدارين.":["Pleasing Allah, earning a great reward, and success in this life and the next.","At behage Allah, opnå stor belønning og lykke i dette liv og det næste."],"طريقة أخذ علم التجويد":["How tajweed is learned","Hvordan man lærer tajwīd"],"طريقة المتقدمين":["The early method","Den tidlige metode"],"أن يسمع الطالب من الشيخ ثم يردّد.":["The student listens to the teacher, then repeats.","Eleven lytter til læreren og gentager."],"طريقة المعاصرين":["The modern method","Den moderne metode"],"أن يقرأ الطالب على الشيخ وهو يسمع له ويصحّح.":["The student recites to the teacher, who listens and corrects.","Eleven reciterer for læreren, som lytter og retter."],"من أراد إتقان التلاوة فليدرس أحكام التجويد النظرية قبل القراءة على الشيخ.":["Whoever wants to master recitation should study the theory of tajweed before reading with a teacher.","Den, der vil mestre recitationen, bør studere tajwīds teori, før man læser for en lærer."],"مراتب سرعة التلاوة":["Speeds of recitation","Recitationens tempi"],"التحقيق":["Taḥqīq (slow)","Taḥqīq (langsom)"],"التلاوة بالبطء والاطمئنان والتمهّل، من غير تمطيط ولا إفراط ولا تكلّف.":["Reciting slowly, calmly and deliberately, without over-stretching, excess or strain.","At recitere langsomt, roligt og bevidst uden at strække for meget, overdrive eller anstrenge sig."],"يناسب مرحلة التعليم.":["Suits the learning stage.","Passer til indlæringsfasen."],"التدوير":["Tadwīr (medium)","Tadwīr (mellem)"],"قراءة متوسطة السرعة، بين التحقيق والحدر.":["Reciting at a medium speed, between taḥqīq and ḥadr.","At recitere i mellemtempo, mellem taḥqīq og ḥadr."],"هو المختار عند أكثر أهل الأداء.":["The preferred speed of most reciters.","Det tempo, de fleste recitatorer foretrækker."],"الحدر":["Ḥadr (fast)","Ḥadr (hurtig)"],"السرعة في التلاوة مع المحافظة على أحكام التجويد.":["Reciting quickly while keeping the rules of tajweed.","At recitere hurtigt og samtidig holde tajwīds regler."],"يُستعمل عادة في الحفظ والمراجعة.":["Usually used for memorising and revising.","Bruges oftest til at huske og repetere."],"اللحن وأركان القراءة":["Mistakes and the pillars of recitation","Fejl og recitationens søjler"],"اللحن في القرآن: الخطأ في قراءة القرآن الكريم والميل عن الصواب. وهو نوعان.":["Laḥn in the Qurʾān: making mistakes in reciting the Noble Qurʾān and straying from what is correct. There are two kinds.","Laḥn i Koranen: at begå fejl i recitationen af Den Ædle Koran og afvige fra det korrekte. Der er to slags."],"اللحن الجلي":["Clear mistake (laḥn jalī)","Tydelig fejl (laḥn jalī)"],"الخطأ الذي يطرأ على الألفاظ فيُخلّ بالمعنى، كتغيير حركة بحركة أو حرف بحرف. يشترك في معرفته العالِمون بالتجويد وغيرهم.":["A mistake in the words that damages the meaning, such as changing one vowel or letter for another. Both experts and non-experts can notice it.","En fejl i ordene, der skader betydningen, f.eks. at bytte én vokal eller ét bogstav med et andet. Både kyndige og ukyndige kan opdage den."],"حكمه: حرام.":["Ruling: forbidden (ḥarām).","Status: forbudt (ḥarām)."],"اللحن الخفي":["Hidden mistake (laḥn khafī)","Skjult fejl (laḥn khafī)"],"الخطأ الذي يطرأ على عُرف القراءة ولا يُخلّ بالمعنى، كترك الغنة أو قصر المد. لا ينتبه له إلا العالِمون بأحكام التجويد.":["A mistake against the norms of recitation that does not damage the meaning, such as dropping ghunnah or shortening a madd. Only those who know tajweed notice it.","En fejl mod recitationens normer, der ikke skader betydningen, f.eks. at udelade ghunnah eller forkorte en madd. Kun de, der kender tajwīd, opdager den."],"حكمه: مكروه.":["Ruling: disliked (makrūh).","Status: misbilliget (makrūh)."],"تقسيم ابن الجزري لقارئ القرآن":["Ibn al-Jazarī’s three kinds of reciter","Ibn al-Jazarīs tre slags recitatorer"],"محسن مأجور":["Doing well, rewarded","Gør det godt, belønnes"],"من يأتي بالقراءة على وجهها المطلوب من صحة المخارج والصفات والأحكام والوقف والابتداء.":["One who recites as required: correct articulation, qualities, rules, stopping and starting.","Den, der reciterer som påkrævet: korrekt artikulation, egenskaber, regler, stop og start."],"مسيء معذور":["Falling short, excused","Kommer til kort, undskyldt"],"من لا يطاوعه لسانه على الألفاظ القرآنية، أو لا يجد الوسيلة لتعلّمها، أعجميًا كان أم عربيًا.":["One whose tongue cannot manage the Qurʾānic words, or who has no way to learn them, Arab or non-Arab.","Den, hvis tunge ikke magter Koranens ord, eller som ikke har mulighed for at lære dem, arabisk eller ej."],"مسيء آثم":["Falling short, sinful","Kommer til kort, synder"],"من يملك القدرة على تصحيح قراءته لكنه يتمادى تكبّرًا واستبدادًا أو اتكالًا على قراءته الفاسدة.":["One who is able to correct his recitation but persists out of pride, stubbornness or reliance on his faulty reading.","Den, der kan rette sin recitation, men holder fast af stolthed, stædighed eller tillid til sin fejlagtige læsning."],"أركان القراءة الصحيحة":["The pillars of a valid reading","Søjlerne for en gyldig læsemåde"],"أولًا":["First","Første"],"موافقة اللغة العربية ولو بوجه من الوجوه، فالقرآن نزل بلسان عربي مبين.":["It agrees with Arabic grammar in at least one way, since the Qurʾān came in clear Arabic.","Den stemmer med arabisk grammatik på mindst én måde, da Koranen kom på klart arabisk."],"ثانيًا":["Second","Anden"],"موافقة الرسم العثماني ولو احتمالًا، لأنه الخط الذي كُتب في زمن الصحابة.":["It agrees with the ʿUthmānī script, even as a possibility, as that is the script written in the time of the Companions.","Den stemmer med den ʿuthmāniske skrift, om så blot som mulighed, da det er skriften fra Ledsagernes tid."],"ثالثًا":["Third","Tredje"],"صحة السند وتواتره، لأن القرآن نُقل إلينا مشافهة عرضًا وسماعًا.":["It has an authentic, mass-transmitted chain, since the Qurʾān was passed to us orally, by reciting and hearing.","Den har en autentisk, massetraderet kæde, da Koranen er givet videre mundtligt ved at recitere og høre."],"الاستعاذة":["Istiʿādhah (seeking refuge)","Istiʿādhah (at søge tilflugt)"],"أعوذ بالله من الشيطان الرجيم":["Aʿūdhu billāhi min al-shayṭān al-rajīm","Aʿūdhu billāhi min al-shayṭān al-rajīm"],"الالتجاء إلى الله والاعتصام والتحصّن به من الشيطان الرجيم عند إرادة قراءة القرآن.":["Turning to Allah and seeking His protection from the accursed Shayṭān when one wants to recite the Qurʾān.","At vende sig til Allah og søge Hans beskyttelse mod den forbandede Shayṭān, når man vil recitere Koranen."],"حكمها: مستحبة عند جمهور القراء والفقهاء، وقيل واجبة":["Ruling: recommended according to most reciters and jurists; some say obligatory","Status: anbefalet ifølge de fleste recitatorer og jurister; nogle siger obligatorisk"],"الصيغة المختارة: «أعوذ بالله من الشيطان الرجيم»، وهي الواردة في القرآن":["The preferred wording: “Aʿūdhu billāhi min al-shayṭān al-rajīm”, as it appears in the Qurʾān","Den foretrukne ordlyd: “Aʿūdhu billāhi min al-shayṭān al-rajīm”, som den står i Koranen"],"مواطن قراءتها سرًّا":["Said silently","Siges stille"],"في الصلاة، السرية والجهرية":["In prayer, silent and aloud","I bønnen, både den stille og den højlydte"],"إذا كان يقرأ خاليًا منفردًا":["When reciting alone","Når man reciterer alene"],"في الحلقات القرآنية إذا لم يكن هو المبتدئ":["In Qurʾān circles, when you are not the one starting","I Koran-kredse, når man ikke er den, der begynder"],"مواطن قراءتها جهرًا":["Said aloud","Siges højt"],"إذا كان يقرأ جهرًا وهناك من يستمع له":["When reciting aloud and someone is listening","Når man reciterer højt, og nogen lytter"],"في الحلقات القرآنية إذا كان هو المبتدئ":["In Qurʾān circles, when you are the one starting","I Koran-kredse, når man er den, der begynder"],"أحوال الاستعاذة والبسملة مع أول السورة":["Istiʿādhah and basmalah at the start of a sūrah","Istiʿādhah og basmalah i begyndelsen af en sūrah"],"أوجه الابتداء بأول السورة":["Ways to begin a sūrah","Måder at begynde en sūrah på"],"تجتمع الاستعاذة والبسملة وأول السورة، وفيها أربعة أوجه كلها جائزة.":["The istiʿādhah, the basmalah and the start of the sūrah come together, with four ways, all permitted.","Istiʿādhah, basmalah og sūrahens begyndelse mødes, med fire måder, der alle er tilladt."],"أربعة أوجه، كلها جائزة.":["Four ways, all permitted.","Fire måder, alle tilladt."],"البسملة":["Basmalah","Basmalah"],"أول السورة":["Start of the sūrah","Sūrahens begyndelse"],"قطع الكل":["Pause after each","Pause efter hver"],"قطع الاستعاذة ووصل البسملة بالآية":["Pause after the istiʿādhah, join the basmalah to the verse","Pause efter istiʿādhah, forbind basmalah med verset"],"وصل الاستعاذة بالبسملة وقطعها عن الآية":["Join the istiʿādhah to the basmalah, pause before the verse","Forbind istiʿādhah med basmalah, pause før verset"],"وصل الكل":["Join all three","Forbind alle tre"],"إذا قطع القارئ قراءته لعارض له صلة بالقراءة، كالتفسير أو سجود التلاوة، أو اضطرارًا كالعطاس والسعال والنسيان، فلا يعيد الاستعاذة. وإذا كان القطع لعارض أجنبي فإنه يعيدها.":["If the reciter stops for something related to the recitation, like explanation or a prostration of recitation, or because he must, like sneezing, coughing or forgetting, he does not repeat the istiʿādhah. If he stops for something unrelated, he repeats it.","Hvis recitatoren stopper for noget, der har med recitationen at gøre, som forklaring eller en recitationsnedkastelse, eller fordi han må, som nys, hoste eller glemsel, gentager han ikke istiʿādhah. Stopper han for noget uvedkommende, gentager han den."],"اتفق العلماء على أن البسملة جزء من آية في سورة النمل: «إِنَّهُ مِن سُلَيْمَانَ وَإِنَّهُ بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ». واختلفوا هل هي آية من الفاتحة: فالكوفيون يعدّونها أول آية منها. ورواية حفص عن عاصم الكوفي تتبع العدّ الكوفي، فالبسملة فيها آية من الفاتحة.":["Scholars agree that the basmalah is part of a verse in Sūrat al-Naml: “It is from Sulaymān, and it is: In the name of Allah, the Most Merciful, the Most Compassionate.” They differ on whether it is a verse of al-Fātiḥah: the Kūfans count it as its first verse. Ḥafṣ from ʿĀṣim of Kūfah follows the Kūfan count, so the basmalah is a verse of al-Fātiḥah.","De lærde er enige om, at basmalah er en del af et vers i Sūrat al-Naml: “Det er fra Sulaymān, og det er: I Allahs navn, den Nådige, den Barmhjertige.” De er uenige om, hvorvidt den er et vers i al-Fātiḥah: kūfanerne regner den som første vers. Ḥafṣ fra ʿĀṣim fra Kūfah følger kūfanernes optælling, så basmalah er et vers i al-Fātiḥah."],"حكم البسملة":["Ruling of the basmalah","Basmalahs status"],"بسم الله الرحمن الرحيم":["Bismillāh al-Raḥmān al-Raḥīm","Bismillāh al-Raḥmān al-Raḥīm"],"يجب الإتيان بها عند الابتداء بأول كل سورة إلا سورة التوبة. وأما البدء من وسط السورة فالقارئ مخيّر.":["It must be said when starting any sūrah from its beginning, except Sūrat al-Tawbah. When starting in the middle of a sūrah, the reciter may choose.","Den skal siges, når man begynder en sūrah fra starten, undtagen Sūrat al-Tawbah. Begynder man midt i en sūrah, kan recitatoren vælge."],"التوبة وحدها بلا بسملة في أولها.":["Only al-Tawbah has no basmalah at its start.","Kun al-Tawbah har ingen basmalah i begyndelsen."],"بين الأنفال والتوبة":["Between al-Anfāl and al-Tawbah","Mellem al-Anfāl og al-Tawbah"],"لا يبتدئ القارئ سورة التوبة بالبسملة. وإذا وصل آخر الأنفال بأول التوبة فله ثلاثة أوجه جائزة.":["Sūrat al-Tawbah is not started with the basmalah. When joining the end of al-Anfāl to the start of al-Tawbah, there are three permitted ways.","Sūrat al-Tawbah begyndes ikke med basmalah. Når man forbinder slutningen af al-Anfāl med begyndelsen af al-Tawbah, er der tre tilladte måder."],"الوقف: بالتنفس":["Waqf: stop and take a breath","Waqf: stop og tag en indånding"],"السكت: بدون تنفس":["Sakt: a short pause without a breath","Sakt: en kort pause uden indånding"],"الوصل: فيكون الحكم بينهما الإقلاب، لالتقاء التنوين بالباء":["Waṣl: join them, which creates iqlāb, as the tanwīn meets bāʾ","Waṣl: forbind dem, hvilket giver iqlāb, da tanwīn møder bāʾ"],"حكم البسملة عند الجمع بين السورتين":["The basmalah between two sūrahs","Basmalah mellem to sūrahs"],"الأوجه بين السورتين":["Ways between two sūrahs","Måder mellem to sūrahs"],"إذا وصل القارئ آخر سورة بأول التي تليها مع البسملة، جازت ثلاثة أوجه وامتنع وجه واحد.":["When joining the end of one sūrah to the start of the next with the basmalah, three ways are permitted and one is not.","Når man forbinder slutningen af én sūrah med begyndelsen af den næste med basmalah, er tre måder tilladt og én ikke."],"الممنوع: وصل البسملة بآخر السورة ثم الوقف عليها، لئلا يُتوهم أنها من السورة الأولى.":["Not allowed: joining the basmalah to the end of the sūrah and then stopping, as if it belonged to the first sūrah.","Ikke tilladt: at forbinde basmalah med slutningen af sūrahen og så stoppe, som om den hørte til den første sūrah."],"آخر السورة":["End of the sūrah","Sūrahens slutning"],"أول السورة التالية":["Start of the next sūrah","Næste sūrahs begyndelse"],"وصل البسملة بالسورة الثانية وقطعها عن الأولى":["Join the basmalah to the second sūrah, pause after the first","Forbind basmalah med den anden sūrah, pause efter den første"],"وصل البسملة بالسورة الأولى وقطعها عن الثانية":["Join the basmalah to the first sūrah, pause before the second","Forbind basmalah med den første sūrah, pause før den anden"],"غير جائز":["not allowed","ikke tilladt"],"الحروف العربية":["The Arabic letters","De arabiske bogstaver"],"القرآن الكريم ١١٤ سورة، وعدد آياته على العدّ الكوفي ٦٢٣٦ آية. والحرف أصغر وحدة بنائية فيه، ولذلك اهتم العلماء بدراسة الحروف من حيث المخارج والصفات، والأحكام التي تتولد من تركيبها.":["The Noble Qurʾān has 114 sūrahs, and 6,236 verses in the Kūfan count. The letter is its smallest building block, so scholars studied the letters: their articulation points, their qualities, and the rules that come from combining them.","Den Ædle Koran har 114 sūrahs og 6.236 vers efter kūfanernes optælling. Bogstavet er dens mindste byggesten, så de lærde studerede bogstaverne: deres artikulationssteder, egenskaber og de regler, der opstår, når de kombineres."],"الحروف الأبجدية (مكتوبًا)":["Alphabet letters (written)","Alfabetets bogstaver (skrevne)"],"الحروف الهجائية (منطوقًا)":["Spelled letters (spoken)","Udtalte bogstaver"],"بفصل الهمزة عن الألف.":["Counting the hamzah separately from the alif.","Når hamzah regnes adskilt fra alif."],"الحرف":["The letter","Bogstavet"],"صوت يعتمد على مقطع (مخرج) محقق أو مقدّر. ويكون ساكنًا أو متحركًا، والمتحرك مفتوح أو مضموم أو مكسور.":["A sound that rests on a real or estimated point of articulation. It is either still (sākin) or voweled; a voweled letter has fatḥah, ḍammah or kasrah.","En lyd, der hviler på et virkeligt eller anslået artikulationssted. Det er enten stille (sākin) eller vokaliseret; et vokaliseret bogstav har fatḥah, ḍammah eller kasrah."],"المتحرك":["Voweled","Vokaliseret"],"يخرج بالتباعد بين طرفي عضو النطق، ويكون محرّكًا بالفتح أو الضم أو الكسر.":["Produced as the two parts of the speech organ move apart, with fatḥah, ḍammah or kasrah.","Dannes, når de to dele af taleorganet bevæger sig fra hinanden, med fatḥah, ḍammah eller kasrah."],"الساكن":["Still (sākin)","Stille (sākin)"],"يخرج بالتصادم بين طرفي عضو النطق. وتُستثنى الحروف المقلقلة فإنها تخرج بالتباعد.":["Produced as the two parts of the speech organ press together. The qalqalah letters are an exception: they come out as the parts move apart.","Dannes, når de to dele af taleorganet presses sammen. Qalqalah-bogstaverne er en undtagelse: de kommer ud, når delene bevæger sig fra hinanden."],"المشدد":["Doubled (mushaddad)","Fordoblet (mushaddad)"],"مكوّن من حرفين: الأول ساكن والثاني متحرك، فيُلفظ حرفًا مشددًا بحركة الثاني.":["Made of two letters, the first still and the second voweled, said as one doubled letter with the second one’s vowel.","Består af to bogstaver, det første stille og det andet vokaliseret, udtalt som ét fordoblet bogstav med det andets vokal."],"حروف المد":["Madd letters","Madd-bogstaver"],"ا و ي: تخرج باهتزاز الوترين الصوتيين في الحنجرة، مع انفتاح الفم عموديًا للألف، وتكوير الشفتين إلى الأمام للواو، وانخفاض الفك السفلي للياء.":["ا و ي: produced by the vibration of the vocal cords, with the mouth opening vertically for alif, the lips rounding forward for wāw, and the lower jaw dropping for yāʾ.","ا و ي: dannes ved stemmebåndenes svingninger, med munden åben lodret ved alif, læberne rundet frem ved wāw og underkæben sænket ved yāʾ."],"المخارج":["Articulation points (makhārij)","Artikulationssteder (makhārij)"],"المخرج":["Makhraj","Makhraj"],"محل خروج الحرف عند النطق به وتمييزه عن غيره، محققًا كان أم مقدّرًا.":["The place a letter comes out from when pronounced, which separates it from other letters, whether real or estimated.","Stedet, et bogstav kommer ud fra, når det udtales, og som adskiller det fra andre, hvad enten det er virkeligt eller anslået."],"المحقق":["Real","Virkeligt"],"الذي يعتمد على جزء معيّن من أجزاء الحلق أو اللسان أو الشفتين.":["One that rests on a specific part of the throat, tongue or lips.","Et, der hviler på en bestemt del af svælget, tungen eller læberne."],"المقدّر":["Estimated","Anslået"],"الذي لا يعتمد على جزء معيّن، مثل مخرج الجوف، وهو الفراغ في الحلق والفم، ومنه الحروف المدية.":["One that does not rest on a specific part, like the jawf: the open space in the throat and mouth where the madd letters come from.","Et, der ikke hviler på en bestemt del, som jawf: det åbne rum i svælg og mund, hvorfra madd-bogstaverne kommer."],"كيف تعرف مخرج الحرف؟ سكّنه وأدخل عليه همزة وصل بأي حركة ثم انطق به، مثل: أَبْ، أَقْ. فحيث ينقطع الصوت يكون مخرجه.":["How do you find a letter’s makhraj? Make it still, put a hamzah with any vowel before it and say it, like ab or aq. Where the sound stops is its makhraj.","Hvordan finder man et bogstavs makhraj? Gør det stille, sæt en hamzah med en vokal foran og sig det, f.eks. ab eller aq. Hvor lyden stopper, er dets makhraj."],"اختلف العلماء في عدد المخارج: سبعة عشر عند ابن الجزري والجمهور، وستة عشر عند سيبويه والشاطبي، وأربعة عشر عند الفراء. والمعتمد هنا مذهب ابن الجزري: خمسة مخارج رئيسية تتفرع إلى سبعة عشر مخرجًا.":["Scholars differ on the number of makhārij: seventeen according to Ibn al-Jazarī and most scholars, sixteen according to Sībawayh and al-Shāṭibī, and fourteen according to al-Farrāʾ. We follow Ibn al-Jazarī here: five main areas branching into seventeen makhārij.","De lærde er uenige om antallet af makhārij: sytten ifølge Ibn al-Jazarī og de fleste, seksten ifølge Sībawayh og al-Shāṭibī, og fjorten ifølge al-Farrāʾ. Her følger vi Ibn al-Jazarī: fem hovedområder, der deler sig i sytten makhārij."],"اضغط على حرف لترى مخرجه وصفاته":["Tap a letter to see its makhraj and qualities","Tryk på et bogstav for at se dets makhraj og egenskaber"],"المخارج الخمسة الرئيسية":["The five main areas","De fem hovedområder"],"الجوف":["Al-Jawf (the mouth cavity)","Al-Jawf (mundhulen)"],"مخرج واحد، مقدّر":["One makhraj, estimated","Ét makhraj, anslået"],"الفراغ الموجود في الحلق والفم، وتخرج منه حروف المد الثلاثة. وتسمى الحروف الجوفية.":["The empty space in the throat and mouth, where the three madd letters come from. They are called the jawf letters.","Det tomme rum i svælg og mund, hvorfra de tre madd-bogstaver kommer. De kaldes jawf-bogstaverne."],"ينتهي مخرجها بانتهاء الصوت.":["Their makhraj ends when the sound ends.","Deres makhraj slutter, når lyden slutter."],"الحلق":["Al-Ḥalq (the throat)","Al-Ḥalq (svælget)"],"ثلاثة مخارج لستة أحرف":["Three makhārij for six letters","Tre makhārij for seks bogstaver"],"فيه ثلاثة مخارج، وحروفه تسمى الحلقية.":["It has three makhārij, and its letters are called the throat letters.","Det har tre makhārij, og dets bogstaver kaldes svælgbogstaverne."],"هي نفسها حروف الإظهار.":["They are the same as the letters of iẓhār.","Det er de samme som iẓhār-bogstaverne."],"أقصى الحلق: الهمزة والهاء":["Deepest part of the throat: hamzah and hāʾ","Dybeste del af svælget: hamzah og hāʾ"],"وسط الحلق: العين والحاء":["Middle of the throat: ʿayn and ḥāʾ","Midten af svælget: ʿayn og ḥāʾ"],"أدنى الحلق: الغين والخاء":["Nearest part of the throat: ghayn and khāʾ","Nærmeste del af svælget: ghayn og khāʾ"],"اللسان":["Al-Lisān (the tongue)","Al-Lisān (tungen)"],"عشرة مخارج لثمانية عشر حرفًا":["Ten makhārij for eighteen letters","Ti makhārij for atten bogstaver"],"أكثر المخارج حروفًا.":["The area with the most letters.","Området med flest bogstaver."],"أقصى اللسان مع ما يحاذيه من الحنك الأعلى (اللحمي): القاف":["Back of the tongue with the soft palate above it: qāf","Bagtungen mod den bløde gane over den: qāf"],"أقصى اللسان مع الحنك الأعلى (بين اللحمي والعظمي): الكاف":["Back of the tongue with the palate, between soft and hard palate: kāf","Bagtungen mod ganen, mellem blød og hård gane: kāf"],"وسط اللسان مع ما يقابله من الحنك الأعلى: الجيم والشين والياء غير المدية":["Middle of the tongue with the palate above it: jīm, shīn and the non-madd yāʾ","Midten af tungen mod ganen over den: jīm, shīn og yāʾ uden madd"],"إحدى حافتي اللسان مع ما يجاورها من الأضراس العليا: الضاد":["One side edge of the tongue with the upper molars: ḍād","Den ene sidekant af tungen mod de øverste kindtænder: ḍād"],"أدنى حافتي اللسان الأمامية مع ما يحاذيها من الحنك الأعلى: اللام":["The front sides of the tongue with the palate above: lām","Tungens forreste sider mod ganen over: lām"],"طرف اللسان مع ما يحاذيه من اللثة: النون":["Tip of the tongue with the gum above it: nūn","Tungespidsen mod tandkødet over den: nūn"],"طرف اللسان مع ظهره مع لثة الثنايا العليا: الراء":["Tip and back of the tip of the tongue with the gum of the upper front teeth: rāʾ","Tungespidsen og bagsiden af spidsen mod tandkødet ved de øverste fortænder: rāʾ"],"طرف اللسان مع أصول الثنايا العليا: الطاء والدال والتاء":["Tip of the tongue with the roots of the upper front teeth: ṭāʾ, dāl and tāʾ","Tungespidsen mod roden af de øverste fortænder: ṭāʾ, dāl og tāʾ"],"طرف اللسان مع ما فوق الثنايا السفلى: الصاد والزاي والسين":["Tip of the tongue just above the lower front teeth: ṣād, zāy and sīn","Tungespidsen lige over de nederste fortænder: ṣād, zāy og sīn"],"طرف اللسان مع أطراف الثنايا العليا: الظاء والذال والثاء":["Tip of the tongue with the edges of the upper front teeth: ẓāʾ, dhāl and thāʾ","Tungespidsen mod kanten af de øverste fortænder: ẓāʾ, dhāl og thāʾ"],"الشفتان":["Al-Shafatān (the lips)","Al-Shafatān (læberne)"],"مخرجان لأربعة أحرف":["Two makhārij for four letters","To makhārij for fire bogstaver"],"فيهما مخرجان، وحروفهما تسمى الشفوية.":["They have two makhārij, and their letters are called the lip letters.","De har to makhārij, og deres bogstaver kaldes læbebogstaverne."],"بطن الشفة السفلى مع أطراف الثنايا العليا: الفاء":["Inner lower lip with the edges of the upper front teeth: fāʾ","Indersiden af underlæben mod kanten af de øverste fortænder: fāʾ"],"بانطباق الشفتين: الباء والميم. وبانفتاحهما: الواو غير المدية":["Closing the lips: bāʾ and mīm. Rounding them open: the non-madd wāw","Læberne lukket: bāʾ og mīm. Læberne rundet åbne: wāw uden madd"],"الخيشوم":["Al-Khayshūm (the nasal passage)","Al-Khayshūm (næsehulen)"],"مخرج واحد":["One makhraj","Ét makhraj"],"أقصى الأنف، وتخرج منه الغنة المصاحبة للنون والميم.":["The back of the nose, where the ghunnah (nasal sound) of nūn and mīm comes from.","Bagerst i næsen, hvorfra nūns og mīms ghunnah (nasallyd) kommer."],"أمسك أنفك أثناء الغنة: سينقطع الصوت.":["Pinch your nose during a ghunnah: the sound stops.","Klem om næsen under en ghunnah: lyden stopper."],"ألقاب الحروف":["Names of the letter groups","Navne på bogstavgrupperne"],"اللقب":["Name","Navn"],"الحروف":["Letters","Bogstaver"],"الجوفية":["Jawfiyyah (cavity)","Jawfiyyah (hulrum)"],"الحلقية":["Ḥalqiyyah (throat)","Ḥalqiyyah (svælg)"],"اللهوية":["Lahawiyyah (uvular)","Lahawiyyah (drøbel)"],"الشجرية":["Shajriyyah (mid-mouth)","Shajriyyah (midt i munden)"],"الذلقية":["Dhalqiyyah (tongue-tip)","Dhalqiyyah (tungespids)"],"النطعية":["Niṭʿiyyah (palatal ridge)","Niṭʿiyyah (ganeryg)"],"الأسلية":["Asaliyyah (tip, whistling)","Asaliyyah (spids, hvislende)"],"اللثوية":["Lithawiyyah (gum)","Lithawiyyah (tandkød)"],"الشفوية":["Shafawiyyah (lips)","Shafawiyyah (læber)"],"الصفات":["Qualities of the letters (ṣifāt)","Bogstavernes egenskaber (ṣifāt)"],"الصفة":["Ṣifah (quality)","Ṣifah (egenskab)"],"كيفية يوصف بها الحرف عند حصوله في المخرج.":["The manner in which a letter is produced at its makhraj.","Måden, et bogstav dannes på ved sit makhraj."],"فائدة دراسة الصفات":["Why study the qualities?","Hvorfor studere egenskaberne?"],"التمييز بين الحروف المشتركة في المخرج. فلولا الاستعلاء في الصاد لكانت سينًا، ولولا الجهر في الزاي لكانت سينًا.":["To tell apart letters that share a makhraj. Without istiʿlāʾ, ṣād would be sīn; without jahr, zāy would be sīn.","For at skelne bogstaver med samme makhraj. Uden istiʿlāʾ ville ṣād være sīn; uden jahr ville zāy være sīn."],"تحسين النطق بالحرف. فإعطاء كل حرف صفاته يجعل النطق به أفصح.":["To pronounce each letter well. Giving every letter its qualities makes it clearer and more eloquent.","For at udtale hvert bogstav godt. At give hvert bogstav dets egenskaber gør det tydeligere og smukkere."],"معرفة الحروف القوية والضعيفة، ويترتب عليها معرفة ما يجوز إدغامه وما لا يجوز، وما يُدغم كاملًا أو ناقصًا.":["To know strong and weak letters, and from that which letters may merge, which may not, and whether the merging is full or partial.","For at kende stærke og svage bogstaver og derfra, hvilke der må smelte sammen, hvilke ikke, og om sammensmeltningen er fuld eller delvis."],"أقسام الصفات":["Kinds of qualities","Slags egenskaber"],"صفات لازمة":["Permanent qualities","Faste egenskaber"],"تلازم الحرف في كل أحواله، وقد لا تظهر تمامًا أحيانًا: فالقلقلة والهمس مثلًا لا يظهران إلا إذا كان الحرف ساكنًا. وهي قسمان: صفات لها ضد (١٠)، وصفات لا ضد لها (٧).":["They stay with the letter in every state, though they are not always fully heard: qalqalah and hams, for example, only show when the letter is still. There are two groups: qualities with an opposite (10) and qualities without one (7).","De følger bogstavet i alle tilstande, men høres ikke altid fuldt: qalqalah og hams viser sig f.eks. kun, når bogstavet er stille. Der er to grupper: egenskaber med en modsætning (10) og uden (7)."],"صفات عارضة":["Temporary qualities","Midlertidige egenskaber"],"تعرض للحرف أحيانًا وتزول أحيانًا، مثل: الإدغام والإظهار والقلب والإخفاء والمد والقصر والتفخيم والترقيق.":["They come and go with the situation, such as merging, clarity, conversion, hiding, lengthening, shortening, heaviness and lightness.","De kommer og går alt efter situationen, f.eks. sammensmeltning, tydelighed, omdannelse, skjulning, forlængelse, forkortelse, tunghed og lethed."],"الصفات المتضادة (١٠)":["Qualities with opposites (10)","Egenskaber med modsætninger (10)"],"الهمس والجهر":["Hams and jahr (whisper and voice)","Hams og jahr (hvisken og stemme)"],"الهمس: جريان النفَس عند النطق بالحرف لضعف الاعتماد على المخرج. والجهر ضده: انحباس النفَس لقوة الاعتماد على المخرج، وحروفه بقية الحروف.":["Hams: the breath flows when saying the letter, because it presses weakly on its makhraj. Jahr is the opposite: the breath is held because it presses strongly; it covers all the other letters.","Hams: åndedrættet strømmer, når bogstavet siges, fordi det trykker svagt på sit makhraj. Jahr er det modsatte: åndedrættet holdes tilbage, fordi det trykker kraftigt; det gælder alle de øvrige bogstaver."],"حروف الهمس: «فَحَثَّهُ شَخْصٌ سَكَتَ».":["The hams letters: «فَحَثَّهُ شَخْصٌ سَكَتَ».","Hams-bogstaverne: «فَحَثَّهُ شَخْصٌ سَكَتَ»."],"الشدة والتوسط والرخاوة":["Shiddah, tawassuṭ and rakhāwah (strong, in-between, soft)","Shiddah, tawassuṭ og rakhāwah (hård, mellem, blød)"],"الشدة: انحباس الصوت عند النطق بالحرف لكمال الاعتماد على المخرج، وحروفها ثمانية. والرخاوة: جريان الصوت لضعف الاعتماد على المخرج. والتوسط بينهما.":["Shiddah: the sound is held when saying the letter, because it presses fully on its makhraj; it has eight letters. Rakhāwah: the sound flows, because it presses weakly. Tawassuṭ is in between.","Shiddah: lyden holdes tilbage, fordi bogstavet trykker helt på sit makhraj; den har otte bogstaver. Rakhāwah: lyden strømmer, fordi det trykker svagt. Tawassuṭ er midt imellem."],"الشدة: «أَجِدْ قَطٍ بَكَتْ»":["Shiddah: «أَجِدْ قَطٍ بَكَتْ»","Shiddah: «أَجِدْ قَطٍ بَكَتْ»"],"التوسط: «لِنْ عُمَرْ»":["Tawassuṭ: «لِنْ عُمَرْ»","Tawassuṭ: «لِنْ عُمَرْ»"],"الرخاوة: بقية الحروف":["Rakhāwah: all the other letters","Rakhāwah: alle de øvrige bogstaver"],"الاستعلاء والاستفال":["Istiʿlāʾ and istifāl (raised and lowered)","Istiʿlāʾ og istifāl (hævet og sænket)"],"الاستعلاء: ارتفاع أقصى اللسان إلى الحنك الأعلى عند النطق بالحرف فيرتفع الصوت معه، وحروفه سبعة. والاستفال: انخفاض أقصى اللسان إلى قعر الفم، وحروفه بقية الحروف.":["Istiʿlāʾ: the back of the tongue rises to the palate when saying the letter, so the sound rises with it; it has seven letters. Istifāl: the back of the tongue lowers to the floor of the mouth; it covers the other letters.","Istiʿlāʾ: bagtungen hæves mod ganen, når bogstavet siges, så lyden hæves med; den har syv bogstaver. Istifāl: bagtungen sænkes mod mundbunden; den gælder de øvrige bogstaver."],"«خُصَّ ضَغْطٍ قِظْ».":["Mnemonic: «خُصَّ ضَغْطٍ قِظْ».","Huskeord: «خُصَّ ضَغْطٍ قِظْ»."],"الإطباق والانفتاح":["Iṭbāq and infitāḥ (closed and open)","Iṭbāq og infitāḥ (lukket og åben)"],"الإطباق: استعلاء اللسان إلى الحنك الأعلى بحيث ينحصر الصوت بينهما. والانفتاح: انفراج ما بين اللسان والحنك الأعلى فلا ينحصر الصوت، وحروفه بقية الحروف.":["Iṭbāq: the tongue rises and presses against the palate, so the sound is trapped between them. Infitāḥ: the tongue stays apart from the palate, so the sound is not trapped; it covers the other letters.","Iṭbāq: tungen hæves og presses mod ganen, så lyden fanges imellem dem. Infitāḥ: tungen holder afstand til ganen, så lyden ikke fanges; den gælder de øvrige bogstaver."],"أربعة حروف، وهي أقوى الحروف تفخيمًا.":["Four letters, the heaviest of all.","Fire bogstaver, de tungeste af alle."],"الإذلاق والإصمات":["Idhlāq and iṣmāt (fluent and heavy)","Idhlāq og iṣmāt (flydende og tung)"],"الإذلاق: سرعة النطق بالحرف لاعتماده على ذلق اللسان أو ذلق الشفة. والإصمات: ثقل الحرف وعدم سرعة النطق به، وحروفه بقية الحروف.":["Idhlāq: the letter is said quickly, because it rests on the tip of the tongue or the edge of the lip. Iṣmāt: the letter is heavier and slower; it covers the other letters.","Idhlāq: bogstavet siges hurtigt, fordi det hviler på tungespidsen eller læbekanten. Iṣmāt: bogstavet er tungere og langsommere; det gælder de øvrige bogstaver."],"«فِرَّ مِنْ لُبٍّ». وهاتان الصفتان ليس لهما تطبيق عملي في التجويد.":["Mnemonic: «فِرَّ مِنْ لُبٍّ». These two qualities have no practical effect in tajweed.","Huskeord: «فِرَّ مِنْ لُبٍّ». Disse to egenskaber har ingen praktisk betydning i tajwīd."],"الصفات غير المتضادة (٧)":["Qualities without opposites (7)","Egenskaber uden modsætninger (7)"],"الصفير":["Ṣafīr (whistling)","Ṣafīr (hvislen)"],"انحصار الصوت بين الثنايا وطرف اللسان في مجرى ضيق، ويشبه صوت الطائر.":["The sound squeezes through a narrow gap between the front teeth and the tip of the tongue, like a bird’s whistle.","Lyden presses gennem en smal åbning mellem fortænderne og tungespidsen, som en fugls fløjt."],"القلقلة":["Qalqalah (echo)","Qalqalah (ekko)"],"اضطراب الحرف في مخرجه عند النطق به ساكنًا، فيتولد صوت عند تباعد طرفي عضو النطق.":["The letter vibrates at its makhraj when said still, so a sound bursts out as the two parts of the speech organ separate.","Bogstavet vibrerer ved sit makhraj, når det er stille, så en lyd bryder frem, når taleorganets to dele skilles."],"«قُطْبُ جَدٍّ».":["Mnemonic: «قُطْبُ جَدٍّ».","Huskeord: «قُطْبُ جَدٍّ»."],"القلقلة في وسط الكلام":["Qalqalah within speech","Qalqalah midt i talen"],"تطبيق: الحرف الساكن سكونًا أصليًا":["Applied: a letter that is still by nature","Anvendt: et bogstav, der er stille af natur"],"تُقلقل حروف «قطب جد» إذا سكنت في وسط الكلمة أو آخرها وصلًا، من غير أن تُتبع بحركة.":["The letters «قطب جد» echo when they are still in the middle or end of a word while joining, without adding a vowel after them.","Bogstaverne «قطب جد» giver ekko, når de er stille midt i eller sidst i et ord i sammenhængende læsning, uden at tilføje en vokal efter dem."],"القلقلة عند الوقف":["Qalqalah when stopping","Qalqalah ved stop"],"تطبيق: وهي أوضح من التي في الوصل":["Applied: clearer than when joining","Anvendt: tydeligere end i sammenhængende læsning"],"إذا وقفت على حرف من حروف القلقلة ظهرت القلقلة واضحة. وهي في المشدد أقوى.":["When you stop on a qalqalah letter, the echo is clear. It is strongest on a doubled letter.","Når du stopper på et qalqalah-bogstav, er ekkoet tydeligt. Det er stærkest på et fordoblet bogstav."],"اللين":["Līn (softness)","Līn (blødhed)"],"خروج الحرف من مخرجه بسهولة وعدم كلفة. ويُطلق على الواو والياء إذا سكنتا وانفتح ما قبلهما.":["The letter comes out easily, without effort. It applies to wāw and yāʾ when they are still after a fatḥah.","Bogstavet kommer let ud uden anstrengelse. Det gælder wāw og yāʾ, når de er stille efter en fatḥah."],"مثل «خَوْف» و«بَيْت».":["As in «خَوْف» and «بَيْت».","Som i «خَوْف» og «بَيْت»."],"الانحراف":["Inḥirāf (deviation)","Inḥirāf (afvigelse)"],"ميل صوت الحرف وعدم كمال جريانه بسبب اعتراض اللسان طريقه.":["The letter’s sound bends and does not flow fully, because the tongue gets in its way.","Bogstavets lyd bøjer af og strømmer ikke helt, fordi tungen står i vejen."],"التكرير":["Takrīr (repetition)","Takrīr (gentagelse)"],"ارتعاد واهتزاز رأس اللسان عند النطق بالراء.":["The tip of the tongue trembles when saying rāʾ.","Tungespidsen dirrer, når rāʾ siges."],"تُعرف هذه الصفة لتُجتنب المبالغة فيها، خصوصًا في الراء المشددة.":["You learn this quality in order to avoid overdoing it, especially on a doubled rāʾ.","Man lærer denne egenskab for at undgå at overdrive den, især på en fordoblet rāʾ."],"التفشي":["Tafashshī (spreading)","Tafashshī (udbredelse)"],"انتشار الهواء في الفم عند النطق بالشين.":["The air spreads through the mouth when saying shīn.","Luften breder sig i munden, når shīn siges."],"الاستطالة":["Istiṭālah (extension)","Istiṭālah (forlængelse)"],"امتداد الصوت من آخر حافة اللسان إلى أولها عند النطق بالضاد.":["The sound stretches from the back of the tongue’s edge to its front when saying ḍād.","Lyden strækker sig fra bagenden af tungens kant til forenden, når ḍād siges."],"وزاد بعض العلماء صفتين:":["Some scholars added two more qualities:","Nogle lærde tilføjede to egenskaber mere:"],"الخفاء":["Khafāʾ (faintness)","Khafāʾ (svaghed)"],"خفاء صوت الحرف عند النطق به، وحروفه الهاء وحروف المد.":["The letter’s sound is faint. Its letters are hāʾ and the madd letters.","Bogstavets lyd er svag. Dens bogstaver er hāʾ og madd-bogstaverne."],"تجمعها كلمة «هَاوِي».":["Gathered in the word «هَاوِي».","Samlet i ordet «هَاوِي»."],"الغنة":["Ghunnah (nasal sound)","Ghunnah (nasallyd)"],"صوت يخرج من الخيشوم عند النطق بالنون والميم. ولها مراتب تختلف من حالة إلى أخرى.":["A sound from the nasal passage when saying nūn and mīm. It has levels that change from case to case.","En lyd fra næsehulen, når nūn og mīm siges. Den har niveauer, der skifter fra tilfælde til tilfælde."],"مراتب الغنة":["Levels of ghunnah","Ghunnahs niveauer"],"المرتبة":["Level","Niveau"],"الحالة":["Case","Tilfælde"],"مثال":["Example","Eksempel"],"الأولى":["First","Første"],"المشدد والمدغم الكامل في النون والميم":["Doubled, or fully merged, nūn and mīm","Fordoblet eller helt sammensmeltet nūn og mīm"],"الثانية":["Second","Anden"],"المدغم الناقص في الياء والواو":["Partly merged into yāʾ and wāw","Delvist sammensmeltet med yāʾ og wāw"],"الثالثة":["Third","Tredje"],"المخفى والمقلوب":["Hidden (ikhfāʾ) and converted (iqlāb)","Skjult (ikhfāʾ) og omdannet (iqlāb)"],"الرابعة":["Fourth","Fjerde"],"الساكن المظهر":["Still and clearly pronounced","Stille og tydeligt udtalt"],"الخامسة":["Fifth","Femte"],"النون والميم المشددتان":["Doubled nūn and mīm","Fordoblet nūn og mīm"],"أعلى مراتب الغنة":["The highest level of ghunnah","Ghunnahs højeste niveau"],"كل نون أو ميم مشددة تُغنّ بمقدار حركتين، وصلًا ووقفًا.":["Every doubled nūn or mīm gets a ghunnah of two counts, when joining and when stopping.","Enhver fordoblet nūn eller mīm får en ghunnah på to slag, både i sammenhængende læsning og ved stop."],"مقدار الغنة":["Ghunnah length","Ghunnahs længde"],"٢":["2","2"],"التفخيم":["Tafkhīm (heavy)","Tafkhīm (tung)"],"تسمين الحرف. ويحصل نتيجة صفة الاستعلاء، أي ارتفاع أقصى اللسان إلى الأعلى.":["Making the letter full and heavy. It comes from istiʿlāʾ: the back of the tongue rising.","At gøre bogstavet fyldigt og tungt. Det kommer af istiʿlāʾ: bagtungen hæves."],"الترقيق":["Tarqīq (light)","Tarqīq (let)"],"تنحيف الحرف. ويأتي نتيجة صفة الاستفال، أي بقاء اللسان في قعر الفم عند النطق بالحرف.":["Making the letter thin and light. It comes from istifāl: the tongue staying low in the mouth.","At gøre bogstavet tyndt og let. Det kommer af istifāl: tungen bliver lavt i munden."],"أقسام الحروف من حيث التفخيم والترقيق":["Three groups of letters by heaviness","Tre grupper af bogstaver efter tunghed"],"مفخمة دائمًا":["Always heavy","Altid tunge"],"تفخم أحيانًا وترقق أحيانًا":["Sometimes heavy, sometimes light","Nogle gange tunge, nogle gange lette"],"مرققة دائمًا":["Always light","Altid lette"],"بقية الحروف.":["All the other letters.","Alle de øvrige bogstaver."],"الحروف المفخمة دائمًا":["Letters that are always heavy","Bogstaver, der altid er tunge"],"حروف الاستعلاء":["The istiʿlāʾ letters","Istiʿlāʾ-bogstaverne"],"سبعة حروف تُفخّم في كل أحوالها، وأقواها حروف الإطباق الأربعة.":["Seven letters that are heavy in every state; the strongest are the four iṭbāq letters.","Syv bogstaver, der er tunge i alle tilstande; de stærkeste er de fire iṭbāq-bogstaver."],"الألف":["Alif","Alif"],"الألف تتبع ما قبلها":["Alif follows the letter before it","Alif følger bogstavet før den"],"الألف لا توصف بتفخيم ولا ترقيق في ذاتها، وإنما تتبع الحرف الذي قبلها.":["Alif is neither heavy nor light by itself; it follows the letter before it.","Alif er hverken tung eller let i sig selv; den følger bogstavet før den."],"تُفخّم بعد حروف التفخيم: خَالِدُونَ، قَالَ، بِغَافِلٍ":["Heavy after a heavy letter: خَالِدُونَ، قَالَ، بِغَافِلٍ","Tung efter et tungt bogstav: خَالِدُونَ، قَالَ، بِغَافِلٍ"],"تُرقّق بعد حروف الاستفال: النَّهَارَ، الْبَاطِلَ، النَّارِ":["Light after a light letter: النَّهَارَ، الْبَاطِلَ، النَّارِ","Let efter et let bogstav: النَّهَارَ، الْبَاطِلَ، النَّارِ"],"اللام في لفظ الجلالة":["The lām in the name Allah","Lām i navnet Allah"],"تفخيم لام لفظ الجلالة":["Heavy lām in the name Allah","Tung lām i navnet Allah"],"أربع حالات":["Four cases","Fire tilfælde"],"تُفخّم لام لفظ الجلالة بعد الفتح والضم.":["The lām of the name Allah is heavy after fatḥah and ḍammah.","Lām i navnet Allah er tung efter fatḥah og ḍammah."],"ابتداءً «اللَّهُ»، أو إذا تقدّمها فتح: قَالَ اللَّهُ":["When starting with «اللَّهُ», or after a fatḥah: قَالَ اللَّهُ","Når man begynder med «اللَّهُ», eller efter en fatḥah: قَالَ اللَّهُ"],"إذا تقدّمها ساكن بعد فتح: وَإِلَى اللَّهِ":["After a still letter that follows a fatḥah: وَإِلَى اللَّهِ","Efter et stille bogstav, der følger en fatḥah: وَإِلَى اللَّهِ"],"إذا تقدّمها ضم: عَبْدُ اللَّهِ":["After a ḍammah: عَبْدُ اللَّهِ","Efter en ḍammah: عَبْدُ اللَّهِ"],"إذا تقدّمها ساكن بعد ضم: قَالُوا اللَّهُمَّ":["After a still letter that follows a ḍammah: قَالُوا اللَّهُمَّ","Efter et stille bogstav, der følger en ḍammah: قَالُوا اللَّهُمَّ"],"ترقيق لام لفظ الجلالة":["Light lām in the name Allah","Let lām i navnet Allah"],"ثلاث حالات":["Three cases","Tre tilfælde"],"تُرقّق لام لفظ الجلالة بعد الكسر.":["The lām of the name Allah is light after kasrah.","Lām i navnet Allah er let efter kasrah."],"إذا تقدّمها كسر: بِاللَّهِ":["After a kasrah: بِاللَّهِ","Efter en kasrah: بِاللَّهِ"],"إذا تقدّمها ساكن بعد كسر: وَيُنَجِّي اللَّهُ":["After a still letter that follows a kasrah: وَيُنَجِّي اللَّهُ","Efter et stille bogstav, der følger en kasrah: وَيُنَجِّي اللَّهُ"],"إذا تقدّمها تنوين: قَوْمًا اللَّهُ، لأن التنوين يُكسر وصلًا":["After tanwīn: قَوْمًا اللَّهُ, because the tanwīn takes a kasrah when joining","Efter tanwīn: قَوْمًا اللَّهُ, fordi tanwīn får en kasrah i sammenhængende læsning"],"أحكام الراء":["Rules of rāʾ","Reglerne for rāʾ"],"لحرف الراء ثلاثة أحوال: التفخيم، والترقيق، وجواز الوجهين.":["Rāʾ has three states: heavy, light, and either is allowed.","Rāʾ har tre tilstande: tung, let, og begge er tilladt."],"تفخيم الراء":["Heavy rāʾ","Tung rāʾ"],"ثماني حالات":["Eight cases","Otte tilfælde"],"تُفخّم الراء إذا كانت مفتوحة أو مضمومة، أو ساكنة بعد فتح أو ضم.":["Rāʾ is heavy when it has fatḥah or ḍammah, or is still after a fatḥah or ḍammah.","Rāʾ er tung, når den har fatḥah eller ḍammah, eller er stille efter fatḥah eller ḍammah."],"الراء مفتوحة":["Rāʾ with fatḥah","Rāʾ med fatḥah"],"ساكنة قبلها مفتوح":["Still, after a fatḥah","Stille, efter en fatḥah"],"ساكنة قبلها ساكن قبله مفتوح (وقفًا)":["Still, after a still letter that follows a fatḥah (when stopping)","Stille, efter et stille bogstav, der følger en fatḥah (ved stop)"],"الراء مضمومة":["Rāʾ with ḍammah","Rāʾ med ḍammah"],"ساكنة قبلها مضموم":["Still, after a ḍammah","Stille, efter en ḍammah"],"ساكنة قبلها ساكن قبله مضموم (وقفًا)":["Still, after a still letter that follows a ḍammah (when stopping)","Stille, efter et stille bogstav, der følger en ḍammah (ved stop)"],"ساكنة بعد كسر عارض، أي بعد همزة وصل":["Still, after a temporary kasrah, i.e. after a hamzat al-waṣl","Stille, efter en midlertidig kasrah, dvs. efter en hamzat al-waṣl"],"ساكنة قبلها مكسور وبعدها حرف استعلاء مفتوح":["Still, after a kasrah, followed by a heavy letter with fatḥah","Stille, efter en kasrah, efterfulgt af et tungt bogstav med fatḥah"],"ترقيق الراء":["Light rāʾ","Let rāʾ"],"تُرقّق الراء إذا كانت مكسورة، أو ساكنة بعد كسر أصلي أو بعد ياء.":["Rāʾ is light when it has kasrah, or is still after an original kasrah or after a yāʾ.","Rāʾ er let, når den har kasrah, eller er stille efter en oprindelig kasrah eller efter en yāʾ."],"الراء مكسورة":["Rāʾ with kasrah","Rāʾ med kasrah"],"ساكنة قبلها مكسور":["Still, after a kasrah","Stille, efter en kasrah"],"ساكنة قبلها ساكن قبله مكسور (وقفًا)":["Still, after a still letter that follows a kasrah (when stopping)","Stille, efter et stille bogstav, der følger en kasrah (ved stop)"],"ساكنة قبلها ياء مدية أو لينة (وقفًا)":["Still, after a madd or līn yāʾ (when stopping)","Stille, efter en madd- eller līn-yāʾ (ved stop)"],"الراء بوجهين":["Rāʾ with two options","Rāʾ med to muligheder"],"حالتان":["Two cases","To tilfælde"],"كلمات يجوز في رائها التفخيم والترقيق.":["Words whose rāʾ may be read heavy or light.","Ord, hvis rāʾ må læses tung eller let."],"«فِرْقٍ»: ساكنة قبلها مكسور وبعدها حرف استعلاء مكسور، وصلًا ووقفًا. التفخيم أولى في الوقف، والترقيق أولى في الوصل":["«فِرْقٍ»: still after a kasrah and followed by a heavy letter with kasrah, when joining and stopping. Heavy is better when stopping, light is better when joining","«فِرْقٍ»: stille efter en kasrah og efterfulgt af et tungt bogstav med kasrah, både ved sammenhæng og stop. Tung er bedst ved stop, let er bedst ved sammenhæng"],"«مِصْرَ» و«الْقِطْرِ» وقفًا: ساكنة قبلها حرف استعلاء ساكن قبله مكسور. التفخيم أولى في «مِصْرَ» لأنها مفخمة وصلًا، والترقيق أولى في «الْقِطْرِ» لأنها مرققة وصلًا":["«مِصْرَ» and «الْقِطْرِ» when stopping: still, after a still heavy letter that follows a kasrah. Heavy is better in «مِصْرَ» because it is heavy when joining; light is better in «الْقِطْرِ» because it is light when joining","«مِصْرَ» og «الْقِطْرِ» ved stop: stille, efter et stille tungt bogstav, der følger en kasrah. Tung er bedst i «مِصْرَ», fordi den er tung ved sammenhæng; let er bedst i «الْقِطْرِ», fordi den er let ved sammenhæng"],"مراتب التفخيم":["Levels of heaviness","Tunghedens niveauer"],"المذهب الأول: خمس مراتب":["First view: five levels","Første opfattelse: fem niveauer"],"حال الحرف المفخم":["State of the heavy letter","Det tunge bogstavs tilstand"],"أمثلة":["Examples","Eksempler"],"مفتوح بعده ألف":["Fatḥah followed by alif","Fatḥah efterfulgt af alif"],"مفتوح وليس بعده ألف":["Fatḥah without alif","Fatḥah uden alif"],"مضموم":["Ḍammah","Ḍammah"],"ساكن":["Still","Stille"],"مكسور":["Kasrah","Kasrah"],"حروف الاستعلاء ليست في التفخيم على درجة واحدة. أعلاها المفتوح الذي بعده ألف، ثم المفتوح، ثم المضموم، ثم الساكن، ثم المكسور.":["The istiʿlāʾ letters are not all equally heavy. Heaviest is fatḥah followed by alif, then fatḥah, then ḍammah, then still, then kasrah.","Istiʿlāʾ-bogstaverne er ikke lige tunge. Tungest er fatḥah efterfulgt af alif, så fatḥah, så ḍammah, så stille, så kasrah."],"قَا ← قَ ← قُ ← قْ ← قِ":["قَا ← قَ ← قُ ← قْ ← قِ","قَا ← قَ ← قُ ← قْ ← قِ"],"المذهب الثاني: ثلاث مراتب":["Second view: three levels","Anden opfattelse: tre niveauer"],"الفتح.":["Fatḥah.","Fatḥah."],"الضم.":["Ḍammah.","Ḍammah."],"الكسر.":["Kasrah.","Kasrah."],"يكون في مرتبة حركة ما قبله، مثل: يَقْطَعُونَ، سُقْنَاهُ، شِقْوَتُنَا.":["A still letter takes the level of the vowel before it, as in يَقْطَعُونَ، سُقْنَاهُ، شِقْوَتُنَا.","Et stille bogstav får niveauet fra vokalen før det, som i يَقْطَعُونَ، سُقْنَاهُ، شِقْوَتُنَا."],"درجة تفخيم الحرف المتحرك ثابتة وصلًا، سواء كان في أول الكلمة أو وسطها أو آخرها. وعند الوقف تتغير مرتبة الحرف الموقوف عليه من مرتبة المتحرك إلى مرتبة الساكن.":["The heaviness of a voweled letter stays the same when joining, whether at the start, middle or end of a word. When stopping, the last letter moves from the level of a voweled letter to that of a still one.","Et vokaliseret bogstavs tunghed er den samme ved sammenhæng, uanset om det står først, midt i eller sidst i ordet. Ved stop flytter det sidste bogstav fra et vokaliseret bogstavs niveau til et stille bogstavs."],"المد":["Madd (prolongation)","Madd (forlængelse)"],"إطالة الصوت بحرف من حروف المد واللين.":["Lengthening the sound on a madd or līn letter.","At forlænge lyden på et madd- eller līn-bogstav."],"حروف المد: الألف الساكنة ولا يكون قبلها إلا مفتوح، والواو الساكنة المضموم ما قبلها، والياء الساكنة المكسور ما قبلها":["The madd letters: still alif, always after a fatḥah; still wāw after a ḍammah; still yāʾ after a kasrah","Madd-bogstaverne: stille alif, altid efter en fatḥah; stille wāw efter en ḍammah; stille yāʾ efter en kasrah"],"حرفا اللين: الواو والياء الساكنتان المفتوح ما قبلهما":["The two līn letters: wāw and yāʾ, still after a fatḥah","De to līn-bogstaver: wāw og yāʾ, stille efter en fatḥah"],"الحركة":["Ḥarakah (count)","Ḥarakah (slag)"],"الفترة الزمنية للنطق بالحرف المتحرك، مفتوحًا أو مضمومًا أو مكسورًا. وزمن النطق بالحروف المتحركة متساوٍ.":["The time it takes to say a voweled letter, with fatḥah, ḍammah or kasrah. All voweled letters take the same time.","Den tid, det tager at sige et vokaliseret bogstav med fatḥah, ḍammah eller kasrah. Alle vokaliserede bogstaver tager samme tid."],"زمنها ضعف زمن الفتحة. وكذلك الواو ضعف الضمة، والياء ضعف الكسرة.":["It lasts twice as long as a fatḥah. Likewise wāw is twice a ḍammah, and yāʾ twice a kasrah.","Den varer dobbelt så længe som en fatḥah. Ligeledes er wāw det dobbelte af en ḍammah og yāʾ det dobbelte af en kasrah."],"القصر":["Qaṣr (short)","Qaṣr (kort)"],"المد بحركتين.":["Lengthening by 2 counts.","Forlængelse med 2 slag."],"التوسط":["Tawassuṭ (medium)","Tawassuṭ (mellem)"],"المد بأربع حركات.":["Lengthening by 4 counts.","Forlængelse med 4 slag."],"الإشباع":["Ishbāʿ (full)","Ishbāʿ (fuld)"],"المد بست حركات.":["Lengthening by 6 counts.","Forlængelse med 6 slag."],"عُدّ الحركات":["Count the beats","Tæl slagene"],"أنواع المدود":["Types of madd","Slags madd"],"الطبيعي":["Natural (ṭabīʿī)","Naturlig (ṭabīʿī)"],"لا تقوم ذات الحرف إلا به، ولا يتوقف على سبب، ويُمد حركتين فقط. ويسمى المد الأصلي. ويُلحق به:":["The letter cannot exist without it, it needs no cause, and it lasts exactly 2 counts. It is also called the original madd. These are attached to it:","Bogstavet kan ikke findes uden den, den behøver ingen årsag, og den varer præcis 2 slag. Den kaldes også den oprindelige madd. Disse hører til den:"],"العوض (وقفًا)":["ʿIwaḍ (when stopping)","ʿIwaḍ (ved stop)"],"الصلة الصغرى (وصلًا)":["Ṣilah ṣughrā (when joining)","Ṣilah ṣughrā (ved sammenhæng)"],"مد حرفي طبيعي «حي طهر»":["Natural letter madd «حي طهر»","Naturlig bogstav-madd «حي طهر»"],"البدل":["Badal","Badal"],"التمكين":["Tamkīn","Tamkīn"],"الألفات السبعة (وقفًا)":["The seven alifs (when stopping)","De syv alif (ved stop)"],"الفرعي":["Secondary (farʿī)","Sekundær (farʿī)"],"إطالة حرف المد عن مقداره الطبيعي بسبب الهمز أو السكون:":["Lengthening a madd letter beyond its natural length because of a hamzah or a sukūn:","At forlænge et madd-bogstav ud over dets naturlige længde på grund af en hamzah eller en sukūn:"],"الواجب المتصل":["Obligatory connected (muttaṣil)","Obligatorisk forbundet (muttaṣil)"],"الجائز المنفصل (وصلًا)":["Permitted separated (munfaṣil, when joining)","Tilladt adskilt (munfaṣil, ved sammenhæng)"],"الصلة الكبرى (وصلًا)":["Ṣilah kubrā (when joining)","Ṣilah kubrā (ved sammenhæng)"],"اللازم الكلمي":["Lāzim in a word (kalimī)","Lāzim i et ord (kalimī)"],"اللازم الحرفي «نقص عسلكم»":["Lāzim in a letter name (ḥarfī) «نقص عسلكم»","Lāzim i et bogstavnavn (ḥarfī) «نقص عسلكم»"],"العارض للسكون (وقفًا)":["Due to a stop (ʿāriḍ, when stopping)","På grund af stop (ʿāriḍ, ved stop)"],"اللين (وقفًا)":["Līn (when stopping)","Līn (ved stop)"],"المد الطبيعي وأنواعه":["The natural madd and its types","Den naturlige madd og dens typer"],"المد الطبيعي":["Natural madd (al-madd al-ṭabīʿī)","Naturlig madd (al-madd al-ṭabīʿī)"],"ويسمى المد الأصلي":["Also called the original madd","Kaldes også den oprindelige madd"],"المد الذي لا تقوم ذات الحرف إلا به، ولا يتوقف على سبب. سُمّي طبيعيًا لأن صاحب الطبيعة السليمة لا يزيده ولا ينقصه عن حركتين.":["The madd without which the letter cannot exist, and which needs no cause. It is called natural because a person with a sound nature neither lengthens nor shortens it from two counts.","Den madd, som bogstavet ikke kan undvære, og som ikke behøver nogen årsag. Den kaldes naturlig, fordi et menneske med sund natur hverken forlænger eller forkorter den fra to slag."],"قَالَ، قِيلَ، يَقُولُ.":["قَالَ، قِيلَ، يَقُولُ.","قَالَ، قِيلَ، يَقُولُ."],"مد العوض":["Madd al-ʿiwaḍ (substitute)","Madd al-ʿiwaḍ (erstatning)"],"وقفًا فقط":["Only when stopping","Kun ved stop"],"التعويض عن تنوين النصب (الفتحتين) حال الوقف بألف مدية تُمد حركتين: عَلِيمًا ← عَلِيمَا، مَاءً ← مَاءَا.":["When stopping on a tanwīn with fatḥatayn, it is replaced by an alif lengthened 2 counts: عَلِيمًا ← عَلِيمَا، مَاءً ← مَاءَا.","Når man stopper på tanwīn med fatḥatayn, erstattes den af en alif forlænget 2 slag: عَلِيمًا ← عَلِيمَا، مَاءً ← مَاءَا."],"تُستثنى التاء المربوطة المنونة بالنصب، لأنها تُقلب هاءً عند الوقف: شَجَرَةً ← شَجَرَهْ.":["Except the tāʾ marbūṭah with fatḥatayn, which becomes hāʾ when stopping: شَجَرَةً ← شَجَرَهْ.","Undtagen tāʾ marbūṭah med fatḥatayn, som bliver til hāʾ ved stop: شَجَرَةً ← شَجَرَهْ."],"مد الصلة الصغرى":["Small connection (ṣilah ṣughrā)","Lille forbindelse (ṣilah ṣughrā)"],"وصلًا فقط":["Only when joining","Kun ved sammenhæng"],"صلة هاء الضمير المفرد المذكر الغائب بالواو إذا كانت مضمومة، وبالياء إذا كانت مكسورة، بشرط أن تقع الهاء بين حرفين متحركين.":["The pronoun hāʾ (“him/his”) is extended with a wāw when it has ḍammah, and a yāʾ when it has kasrah, as long as it sits between two voweled letters.","Pronomenet hāʾ (“ham/hans”) forlænges med wāw, når den har ḍammah, og yāʾ, når den har kasrah, så længe den står mellem to vokaliserede bogstaver."],"يُستثنى «وَيَخْلُدْ فِيهِ مُهَانًا» (الفرقان: ٦٩): فيها صلة مع أنها خارج القاعدة":["Exception: «وَيَخْلُدْ فِيهِ مُهَانًا» (al-Furqān 69): it is extended even though it breaks the rule","Undtagelse: «وَيَخْلُدْ فِيهِ مُهَانًا» (al-Furqān 69): den forlænges, selvom den bryder reglen"],"ويُستثنى «يَرْضَهُ لَكُمْ» (الزمر: ٧): لا صلة فيها مع توفر الشروط":["Exception: «يَرْضَهُ لَكُمْ» (al-Zumar 7): not extended even though the conditions are met","Undtagelse: «يَرْضَهُ لَكُمْ» (al-Zumar 7): forlænges ikke, selvom betingelserne er opfyldt"],"المد الحرفي الطبيعي":["Natural letter madd","Naturlig bogstav-madd"],"في الحروف المقطعة أوائل السور":["In the separate letters at the start of sūrahs","I de adskilte bogstaver i begyndelsen af sūrahs"],"مد الحروف المقطعة التي هجاؤها حرفان، بمقدار حركتين: حَا، يَا، طَا، هَا، رَا.":["The separate letters whose names have two letters are lengthened 2 counts: حَا، يَا، طَا، هَا، رَا.","De adskilte bogstaver, hvis navne har to bogstaver, forlænges 2 slag: حَا، يَا، طَا، هَا، رَا."],"تجمعها «حَيٌّ طَهُرَ».":["Gathered in «حَيٌّ طَهُرَ».","Samlet i «حَيٌّ طَهُرَ»."],"مد البدل":["Madd al-badal (exchange)","Madd al-badal (ombytning)"],"إبدال الهمزة الثانية الساكنة حرفَ مد من جنس حركة الهمزة الأولى، إذا اجتمعت همزتان في كلمة واحدة، الأولى متحركة والثانية ساكنة. فهو كل همز ممدود.":["When two hamzahs meet in one word, the first voweled and the second still, the second becomes a madd letter matching the first one’s vowel. In short: any hamzah followed by a madd.","Når to hamzah mødes i ét ord, den første vokaliseret og den anden stille, bliver den anden et madd-bogstav, der passer til den førstes vokal. Kort sagt: enhver hamzah efterfulgt af madd."],"أَأْدَمَ ← آدَمَ، إِئْمَان ← إِيمَان، أُؤْتُوا ← أُوتُوا.":["أَأْدَمَ ← آدَمَ، إِئْمَان ← إِيمَان، أُؤْتُوا ← أُوتُوا.","أَأْدَمَ ← آدَمَ، إِئْمَان ← إِيمَان، أُؤْتُوا ← أُوتُوا."],"مد التمكين":["Madd al-tamkīn (firmness)","Madd al-tamkīn (fasthed)"],"التقاء الواو المدية مع الواو المتحركة، أو الياء المدية مع الياء المتحركة. فيُمكَّن المد حركتين حتى لا يُدغم الحرفان أو يسقط أحدهما.":["A madd wāw meets a voweled wāw, or a madd yāʾ meets a voweled yāʾ. The madd is held firmly for 2 counts so the two letters are not merged or one dropped.","En madd-wāw møder en vokaliseret wāw, eller en madd-yāʾ møder en vokaliseret yāʾ. Madd holdes fast i 2 slag, så de to bogstaver ikke smelter sammen, eller det ene falder bort."],"حُيِّيتُم، النَّبِيِّينَ، يَلْوُونَ، صَبَرُوا وَعَمِلُوا، فِي يَوْمٍ.":["حُيِّيتُم، النَّبِيِّينَ، يَلْوُونَ، صَبَرُوا وَعَمِلُوا، فِي يَوْمٍ.","حُيِّيتُم، النَّبِيِّينَ، يَلْوُونَ، صَبَرُوا وَعَمِلُوا، فِي يَوْمٍ."],"الألفات السبعة":["The seven alifs","De syv alif"],"تثبت وقفًا وتُحذف وصلًا":["Said when stopping, dropped when joining","Udtales ved stop, udelades ved sammenhæng"],"سبع ألفات في سبع كلمات على رواية حفص، تُحذف وصلًا، وتثبت وتُمد حركتين وقفًا. وعلامتها في المصحف دائرة مستطيلة فوق الألف.":["Seven alifs in seven words, in Ḥafṣ’s narration, which are dropped when joining and pronounced for 2 counts when stopping. In the muṣḥaf they are marked with an oval circle above the alif.","Syv alif i syv ord i Ḥafṣ’ overlevering, som udelades ved sammenhæng og udtales i 2 slag ved stop. I muṣḥaf er de markeret med en aflang cirkel over alif."],"الكلمة":["Word","Ord"],"الموضع":["Place","Sted"],"أينما وُجدت في القرآن":["Wherever it appears in the Qurʾān","Overalt, hvor det står i Koranen"],"الكهف: ٣٨":["Al-Kahf 38","Al-Kahf 38"],"الأحزاب: ١٠":["Al-Aḥzāb 10","Al-Aḥzāb 10"],"الأحزاب: ٦٦":["Al-Aḥzāb 66","Al-Aḥzāb 66"],"الأحزاب: ٦٧":["Al-Aḥzāb 67","Al-Aḥzāb 67"],"الإنسان: ٤":["Al-Insān 4","Al-Insān 4"],"الإنسان: ١٥":["Al-Insān 15","Al-Insān 15"],"الوقف على «سَلَاسِلَا» فيه وجهان: بحذف الألف «سَلَاسِلْ»، وبإثباتها «سَلَاسِلَا». والعلامة فوق ألفها مدوّرة.":["Stopping on «سَلَاسِلَا» has two ways: dropping the alif «سَلَاسِلْ», or keeping it «سَلَاسِلَا». The mark above its alif is round.","Stop på «سَلَاسِلَا» har to måder: udelad alif «سَلَاسِلْ», eller behold den «سَلَاسِلَا». Tegnet over dens alif er rundt."],"الألف في «قَوَارِيرَا» الثانية (الإنسان: ١٦) ليست من الألفات السبعة. لا تُلفظ وصلًا ولا وقفًا، وعلامتها مدوّرة.":["The alif in the second «قَوَارِيرَا» (al-Insān 16) is not one of the seven alifs. It is not pronounced when joining or stopping, and its mark is round.","Alif i det andet «قَوَارِيرَا» (al-Insān 16) er ikke en af de syv alif. Den udtales hverken ved sammenhæng eller stop, og dens tegn er rundt."],"المد الفرعي":["The secondary madd","Den sekundære madd"],"المد الذي سببه الهمزة: ٤ أو ٥ حركات":["Madd caused by a hamzah: 4 or 5 counts","Madd forårsaget af hamzah: 4 eller 5 slag"],"المد الواجب المتصل":["Obligatory connected madd (wājib muttaṣil)","Obligatorisk forbundet madd (wājib muttaṣil)"],"أن يأتي حرف المد وبعده اخَّةُ.":["دَابَّةٍ، الصَّاخَّةُ.","دَابَّةٍ، الصَّاخَّةُ."],"٦":["6","6"],"المد اللازم الكلمي المخفف":["Light lāzim madd in a word (kalimī mukhaffaf)","Let lāzim-madd i et ord (kalimī mukhaffaf)"],"أن يأتي حرف المد وبعده حرف ساكن أصلي غير مشدد في كلمة. وجاء في كلمة واحدة فقط هي «آلْآنَ» في موضعين من سورة يونس.":["A madd letter followed by a permanently still, undoubled letter in a word. It occurs in only one word, «آلْآنَ», in two places in Sūrat Yūnus.","Et madd-bogstav efterfulgt af et permanent stille, ikke-fordoblet bogstav i et ord. Det findes kun i ét ord, «آلْآنَ», to steder i Sūrat Yūnus."],"المد اللازم الحرفي المثقل":["Heavy lāzim madd in a letter name (ḥarfī muthaqqal)","Tung lāzim-madd i et bogstavnavn (ḥarfī muthaqqal)"],"أن يأتي حرف المد وبعده حرف مشدد في هجاء الحروف المقطعة، مثل اللام في «الم»: لَامْ مِّيمْ.":["A madd letter followed by a doubled letter in the spelled-out name of a separate letter, like the lām in «الم»: lām mīm.","Et madd-bogstav efterfulgt af et fordoblet bogstav i det udtalte navn på et adskilt bogstav, som lām i «الم»: lām mīm."],"المد اللازم الحرفي المخفف":["Light lāzim madd in a letter name (ḥarfī mukhaffaf)","Let lāzim-madd i et bogstavnavn (ḥarfī mukhaffaf)"],"أن يأتي حرف المد وبعده حرف ساكن غير مدغم في هجاء الحروف المقطعة، مثل «عسق».":["A madd letter followed by a still, unmerged letter in the spelled-out name of a separate letter, as in «عسق».","Et madd-bogstav efterfulgt af et stille, ikke-sammensmeltet bogstav i det udtalte navn på et adskilt bogstav, som i «عسق»."],"حروف اللازم الحرفي تجمعها «نَقَصَ عَسَلُكُمْ». والعين يجوز فيها ٤ أو ٦.":["The letters of this madd are gathered in «نَقَصَ عَسَلُكُمْ». ʿAyn may be 4 or 6.","Denne madds bogstaver er samlet i «نَقَصَ عَسَلُكُمْ». ʿAyn må være 4 eller 6."],"٢. سكون غير أصلي، ويُمد ٢ أو ٤ أو ٦ حركات:":["2. A temporary sukūn, lengthened 2, 4 or 6 counts:","2. En midlertidig sukūn, forlænget 2, 4 eller 6 slag:"],"المد العارض للسكون":["Madd due to a stop (ʿāriḍ lil-sukūn)","Madd v
