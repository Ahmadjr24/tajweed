<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>أحكام التجويد برواية حفص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one calm reading column on a soft green-gray ground. Colour carries structure (tinted panels, pills), not borders. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#18201D; --mut:#5D6A65; --hair:#E2E8E5;
  --brand:#0E6B52; --brand-soft:#DCEFE7; --brand-ink:#FFFFFF; --red:#C8232B; --red-soft:#FCE6E6; --ok:#1E7B4C; --bad:#B4261F;
  --blue:#E4EEFB; --blue-k:#2F5E9E; --green:#E5F1DA; --green-k:#4A7A2B; --peach:#FCE7D8; --peach-k:#A4572A; --yellow:#FAF0C8; --yellow-k:#836709;
  --pink:#FBE2EB; --pink-k:#A13F69; --teal:#DAF2EE; --teal-k:#237568; --lilac:#EEE2F6; --lilac-k:#74498F; --gray:#EBEFED; --gray-k:#56605C;
  --sh:0 1px 2px rgba(20,32,27,.05),0 10px 30px rgba(20,32,27,.07);
  --ros-u0:#E1E7E4; --ros-u1:#F5F7F6; --ros-line:#C3CEC9; --hairc:#3A2A22;
  --skin:#F3B7A4; --skin2:#E58E7A; --cav:#FFF6EE; --tongue:#F08FA0; --tooth:#FFFFFF;
  --quran:"Amiri Quran","Amiri","Traditional Arabic","Geeza Pro",serif;
  --disp:"Noto Kufi Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --ui:"IBM Plex Sans Arabic","Segoe UI","Geeza Pro",Tahoma,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1311; --surface:#161C1A; --ink:#E6ECE9; --mut:#9AA7A2; --hair:#26302C;
    --brand:#5CC9A2; --brand-soft:#173A30; --brand-ink:#06140F; --red:#FF7D78; --red-soft:#3A1D1D; --ok:#5CC9A2; --bad:#FF8A80;
    --blue:#1B2738; --blue-k:#93B8EE; --green:#1D2A17; --green-k:#A2CF7F; --peach:#33231A; --peach-k:#EBA77C; --yellow:#2E2913; --yellow-k:#E3C667;
    --pink:#33202A; --pink-k:#E99CBB; --teal:#15302C; --teal-k:#78D3C4; --lilac:#2A2134; --lilac-k:#C5A5DD; --gray:#212826; --gray-k:#AAB5B1;
    --sh:0 0 0 1px #26302C; --ros-u0:#242D2A; --ros-u1:#1B2220; --ros-line:#3E4A45; --hairc:#4E3A30;
    --skin:#8C5A4D; --skin2:#6E4034; --cav:#20262B; --tongue:#B8566A; --tooth:#DADFE3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#161C1A; --ink:#E6ECE9; --mut:#9AA7A2; --hair:#26302C;
  --brand:#5CC9A2; --brand-soft:#173A30; --brand-ink:#06140F; --red:#FF7D78; --red-soft:#3A1D1D; --ok:#5CC9A2; --bad:#FF8A80;
  --blue:#1B2738; --blue-k:#93B8EE; --green:#1D2A17; --green-k:#A2CF7F; --peach:#33231A; --peach-k:#EBA77C; --yellow:#2E2913; --yellow-k:#E3C667;
  --pink:#33202A; --pink-k:#E99CBB; --teal:#15302C; --teal-k:#78D3C4; --lilac:#2A2134; --lilac-k:#C5A5DD; --gray:#212826; --gray-k:#AAB5B1;
  --sh:0 0 0 1px #26302C; --ros-u0:#242D2A; --ros-u1:#1B2220; --ros-line:#3E4A45; --hairc:#4E3A30;
  --skin:#8C5A4D; --skin2:#6E4034; --cav:#20262B; --tongue:#B8566A; --tooth:#DADFE3; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16.5px;line-height:1.8;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.c-blue{--f:var(--blue);--k:var(--blue-k)}.c-green{--f:var(--green);--k:var(--green-k)}.c-peach{--f:var(--peach);--k:var(--peach-k)}.c-yellow{--f:var(--yellow);--k:var(--yellow-k)}
.c-pink{--f:var(--pink);--k:var(--pink-k)}.c-teal{--f:var(--teal);--k:var(--teal-k)}.c-lilac{--f:var(--lilac);--k:var(--lilac-k)}.c-gray{--f:var(--gray);--k:var(--gray-k)}

main{max-width:720px;margin:0 auto;padding-block:8px calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:none}.view.on{display:block}
.q{font-family:var(--quran);font-weight:400;line-height:2.1}
mark.m{background:none;color:var(--red);font-weight:inherit}
.mut{color:var(--mut)}
h1,h2,h3{font-family:var(--disp);text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:14px}

/* ---------- home ---------- */
.hero{padding:26px 4px 6px;display:grid;gap:4px}
.hero .word{font-family:var(--quran);font-size:clamp(64px,19vw,104px);line-height:1.25;color:var(--brand)}
.hero .word .d{color:var(--red)}
.hero h1{margin:0;font-size:1.7rem;font-weight:700;line-height:1.4}
.hero p{margin:0;color:var(--mut);max-width:44ch}
.cont{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 14px;background:var(--brand);color:var(--brand-ink);border-radius:22px;padding:16px 20px;text-decoration:none}
.cont small{opacity:.8;grid-column:1}
.cont b{font-family:var(--disp);font-size:1.15rem;grid-column:1;line-height:1.5}
.cont .go{grid-column:2;grid-row:1/3;width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--brand-ink) 18%,transparent);display:grid;place-items:center}
.cont .go svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--sh);display:grid;gap:2px;text-decoration:none;color:inherit;border:none;text-align:start}
.stat b{font-family:var(--disp);font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.5}
.stat span{font-size:.82rem;color:var(--mut);line-height:1.5}
.part{display:grid;gap:10px;margin-top:14px}
.part-h{display:flex;align-items:center;gap:10px;margin:0;font-size:1.1rem;font-weight:700}
.part-h .n{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.9rem;flex:none}
.part-h small{font-family:var(--ui);font-weight:500;color:var(--mut);font-size:.82rem;margin-inline-start:auto}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.lesson{background:var(--surface);border-radius:20px;padding:14px 16px 12px;text-decoration:none;color:inherit;display:grid;gap:8px;box-shadow:var(--sh);position:relative;overflow:hidden}
.lesson::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--f)}
.lesson:hover{transform:translateY(-1px)}
.lesson .lt{display:flex;align-items:flex-start;gap:10px}
.lesson .lt b{flex:1;min-width:0;font-family:var(--disp);font-weight:600;font-size:1rem;line-height:1.6}
.lesson .tk{width:22px;height:22px;border-radius:50%;background:var(--f);color:var(--k);display:grid;place-items:center;flex:none;font-size:.75rem;margin-top:3px}
.lesson .tk.on{background:var(--brand);color:var(--brand-ink)}
.lesson .meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mut);font-variant-numeric:tabular-nums}
.pbar{height:5px;border-radius:3px;background:var(--gray);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--k,var(--brand));border-radius:3px}
.credit{font-size:.8rem;color:var(--mut);margin:22px 0 0;line-height:1.7}

/* ---------- lesson page ---------- */
.ch-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px}
.iconbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);box-shadow:var(--sh);border:none;border-radius:999px;padding:7px 14px;font-size:.88rem;text-decoration:none;color:inherit}
.iconbtn svg{width:16px;height:16px}
.ch-hero{background:var(--f);border-radius:26px;padding:22px 20px 18px;display:grid;gap:8px;margin-top:10px}
.ch-hero .crumb{font-size:.82rem;color:var(--k);font-weight:600}
.ch-hero h1{margin:0;font-size:clamp(1.55rem,6vw,2.1rem);line-height:1.4;font-weight:700}
.ch-hero .meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8rem;background:var(--surface);border-radius:999px;padding:2px 12px;color:var(--mut)}
.playall{justify-self:start;display:inline-flex;align-items:center;gap:8px;border:none;border-radius:999px;background:var(--ink);color:var(--bg);padding:8px 16px 8px 18px;font-weight:600;font-size:.92rem}
.playall svg{width:16px;height:16px}
.playall.on{background:var(--red);color:#fff}
.toc-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin-inline:-2px;scrollbar-width:none}
.toc-chips::-webkit-scrollbar{display:none}
.toc-chips button{flex:none;border:none;background:var(--surface);box-shadow:var(--sh);border-radius:999px;padding:5px 14px;font-size:.85rem;white-space:nowrap}
.body{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.para{margin:0;max-width:65ch}
.sec-h{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:1.15rem;font-weight:700;line-height:1.5}
.sec-h::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--k);flex:none}
.note{background:var(--gray);border-radius:18px;padding:12px 16px;font-size:.96rem}
.note b,.mnote b{display:block;font-family:var(--disp);font-size:.82rem;margin-bottom:2px}
.note b{color:var(--mut)}
.mnote{background:var(--red-soft);border-radius:18px;padding:12px 16px;font-size:.96rem}
.mnote b{color:var(--red)}
.dl{display:grid;background:var(--surface);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.dl .row{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:12px;padding:12px 16px;align-items:baseline}
.dl .row+.row{border-top:1px solid var(--hair)}
.dl .lb{font-family:var(--disp);font-weight:600;font-size:.92rem;color:var(--k)}
.lst{margin:0;padding:6px 0;list-style:none;display:grid;counter-reset:n;background:var(--surface);border-radius:20px;box-shadow:var(--sh)}
.lst li{counter-increment:n;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:8px 16px;align-items:start}
.lst li+li{border-top:1px solid var(--hair)}
.lst li::before{content:counter(n,arabic-indic);width:26px;height:26px;border-radius:50%;background:var(--f);color:var(--k);display:grid;place-items:center;font-size:.85rem;font-weight:700;margin-top:3px}
.steps{margin:0;padding:0;list-style:none;display:grid;counter-reset:s;position:relative}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding-bottom:14px;position:relative}
.steps li::before{content:counter(s,arabic-indic);width:34px;height:34px;border-radius:50%;background:var(--f);color:var(--k);display:grid;place-items:center;font-weight:700;z-index:1}
.steps li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:16px;top:34px;bottom:0;width:2px;background:var(--f)}
.steps b{display:block;font-family:var(--disp);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:4px 14px;border-radius:999px;background:var(--f);color:var(--ink);font-size:.95rem}
.quotes{display:grid;gap:10px}
.quotes blockquote{margin:0;background:var(--surface);box-shadow:var(--sh);border-radius:20px;padding:14px 18px;position:relative}
.quotes blockquote::before{content:"”";position:absolute;inset-inline-end:14px;top:-6px;font-size:3.2rem;color:var(--f);font-family:Georgia,serif;line-height:1}
.quotes cite{display:block;font-style:normal;font-size:.84rem;color:var(--mut);margin-top:6px}
.poem{background:var(--f);border-radius:22px;padding:14px 18px;text-align:center;display:grid}
.poem .q{font-size:1.45rem;color:var(--ink)}
.poem small{color:var(--k);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.col{background:var(--f);border-radius:20px;padding:14px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.col .hd{font-family:var(--disp);font-weight:700;color:var(--k);line-height:1.5}
.col .sb{font-family:var(--quran);font-size:1.25rem;color:var(--red)}
.col .big{font-family:var(--disp);font-size:2.4rem;font-weight:700;line-height:1.3}
.col ul{margin:0;padding-inline-start:18px}
.col p{margin:0}
.col .ws{display:grid;gap:0}
.col .ws .q{font-size:1.35rem}
.tw{overflow-x:auto;background:var(--surface);border-radius:20px;box-shadow:var(--sh)}
.tbl{border-collapse:collapse;width:100%}
.tbl th{background:var(--f);color:var(--k);font-family:var(--disp);font-weight:600;font-size:.88rem;padding:9px 14px;text-align:start}
.tbl td{padding:8px 14px;border-top:1px solid var(--hair);vertical-align:middle}
.tbl td.q{font-size:1.3rem;white-space:nowrap}
.tbl tr.hl td{color:var(--red);font-weight:700}
.chain{display:grid;gap:12px;background:var(--surface);border-radius:20px;box-shadow:var(--sh);padding:14px 16px}
.chain .cl{font-weight:600;font-size:.95rem}
.chain .cl em{font-style:normal;color:var(--red)}
.chain .cs{display:flex;align-items:center;gap:4px;margin-top:4px}
.chain .pt{flex:1;min-width:0;text-align:center;border-radius:12px;background:var(--gray);padding:5px 4px;font-size:.85rem;line-height:1.4}
.chain .lk{flex:none;font-size:.76rem;font-weight:700;padding:1px 9px;border-radius:999px}
.chain .lk.w{background:var(--green);color:var(--green-k)}
.chain .lk.c{background:var(--pink);color:var(--pink-k)}
.chain .bad .pt{opacity:.55;text-decoration:line-through;text-decoration-color:var(--red)}
.tree{background:var(--surface);border-radius:20px;box-shadow:var(--sh);padding:14px 16px}
.tree .branch{border-inline-start:2px solid var(--hair);margin-inline-start:8px;padding-inline-start:14px;display:grid;gap:6px;margin-block:8px}
.tree .nd{display:inline-block;padding:2px 12px;border-radius:999px;background:var(--f,var(--gray));color:var(--k,var(--ink));font-weight:700;font-size:.92rem}
.tree .lf{display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline}
.tree .lf .q{font-size:1.15rem;color:var(--mut)}

/* ---------- rule cards ---------- */
.rule{background:var(--surface);border-radius:24px;box-shadow:var(--sh);overflow:hidden;scroll-margin-top:16px}
.rule header{padding:16px 18px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rule h3{margin:0;font-size:1.15rem;font-weight:700;flex:1;min-width:6em;line-height:1.5;display:flex;align-items:center;gap:10px}
.rule h3::before{content:"";width:8px;height:22px;border-radius:4px;background:var(--k);flex:none}
.rule .hc{font-weight:700;background:var(--f);color:var(--k);border-radius:999px;padding:1px 12px;font-size:.85rem;white-space:nowrap}
.rule .alt{flex-basis:100%;font-size:.88rem;color:var(--mut);margin-top:-4px;padding-inline-start:18px}
.rule .rb{padding:10px 18px 16px;display:grid;gap:10px}
.rule .rb p{margin:0}
.rule .lt{font-family:var(--quran);font-size:1.6rem;color:var(--red);line-height:1.7;word-spacing:.2em;background:var(--f);border-radius:16px;padding:4px 14px;text-align:center}
.rule ul.cd{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.rule ul.cd li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px}
.rule ul.cd li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--k);margin-top:.75em}
.rule .tip{color:var(--k);font-size:.95rem;font-weight:600}
.mem{display:flex;gap:3px;flex:none}
.mem i{width:6px;height:6px;border-radius:50%;background:var(--gray)}
.mem i.f{background:var(--k,var(--brand))}
.exl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.exl li{background:var(--bg);border-radius:16px;padding:6px 14px 8px;transition:background .15s}
.exl li.playing{background:var(--red-soft)}
.exl .q{font-size:1.6rem;display:block}
.exbar{display:flex;align-items:center;gap:8px}
.exbar .ref{flex:1;font-size:.8rem;color:var(--mut)}
.pb{width:38px;height:38px;border-radius:50%;border:none;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.pb svg{width:16px;height:16px}
.pb .ic-stop{display:none}.pb.on .ic-stop{display:block}.pb.on .ic-play{display:none}
.pb.on{background:var(--red);color:#fff}
.ab{background:var(--surface);border:none;border-radius:999px;padding:4px 12px;font-size:.78rem;color:var(--mut)}
.ab.on{color:var(--red)}
.aerr{display:block;font-size:.82rem;color:var(--bad)}
.aerr:empty{display:none}

/* ---------- interactives ---------- */
.tool{background:var(--surface);border-radius:24px;box-shadow:var(--sh);padding:16px;display:grid;gap:12px}
.tool .lbl{font-family:var(--disp);font-weight:600;font-size:.95rem}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.lgrid button{font-family:var(--quran);font-size:1.4rem;line-height:1.5;border-radius:12px;border:none;background:var(--gray);padding:3px 0}
.lgrid button.g1{background:var(--f)}
.lgrid button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.out{border-radius:18px;background:var(--f,var(--gray));padding:12px 16px;display:grid;gap:4px;text-align:center}
.out .q{font-size:1.9rem}
.out b{font-family:var(--disp);font-size:1.1rem;color:var(--k,var(--ink))}
.lx{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:620px){.lx{grid-template-columns:minmax(0,1fr) 270px;align-items:start}}
.mouth{width:100%;max-width:330px;justify-self:center;height:auto;display:block;border-radius:18px}
.mouth text{font-family:var(--ui);font-size:11px;fill:var(--ink);font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.mouth .pt{fill:var(--red);stroke:var(--surface);stroke-width:2}
.mouth .jf{fill:var(--red);opacity:.28}
.sf{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.sf span{font-size:.84rem;padding:1px 11px;border-radius:999px;background:var(--gray)}
.sf span.s{background:var(--ink);color:var(--surface)}
.beats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.beats i{width:34px;height:34px;border-radius:50%;background:var(--gray);transition:background .12s,transform .12s}
.beats i.lit{background:var(--red);transform:scale(1.06)}
.beats i.off{display:none}
.cbtn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{border:none;background:var(--green);color:var(--green-k);border-radius:999px;padding:4px 16px;font-weight:700}

/* ---------- moving mouth ---------- */
.mk-groups{display:grid;gap:8px}
.mk-g{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:8px;align-items:center}
.mk-n{font-family:var(--disp);font-size:.82rem;font-weight:600;color:var(--k)}
.mouth{background:var(--bg);padding:6px}

/* ---------- rosette ---------- */
.ros-wrap{background:var(--surface);border-radius:26px;box-shadow:var(--sh);padding:16px 16px 14px;display:grid;gap:8px}
.ros-head{display:flex;align-items:baseline;justify-content:space-between}
.ros-head h2{margin:0;font-size:1.15rem}
.rosette{width:100%;max-width:340px;justify-self:center;height:auto;display:block;overflow:visible}
.tile{cursor:pointer;outline:none}
.tile .pt{stroke-width:.45;stroke-linejoin:round}
.tile.e .pt{fill:url(#rgu);stroke:var(--ros-line)}
.tile.e .hi{fill:none;stroke:var(--ros-line);stroke-width:.3}
.tile.e .st,.tile.e .fc2{display:none}
.tile.e .vn{fill:none;stroke:var(--ros-line);stroke-width:.28}
.tile.f .pt{stroke:#fff;stroke-opacity:.9}
.tile.f .hi{fill:#fff;fill-opacity:.3;stroke:none}
.tile.f .st{fill:none;stroke:#fff;stroke-opacity:.55;stroke-width:.4;stroke-linecap:round}
.tile.f .fc2{fill:#0B2A10;fill-opacity:.22;stroke:none}
.tile.f .vn{fill:none;stroke:#E6F8D6;stroke-opacity:.65;stroke-width:.32;stroke-linecap:round}
.tile.f.rg0 .pt{fill:url(#rg0)}.tile.f.rg1 .pt{fill:url(#rg1)}.tile.f.rg2 .pt{fill:url(#rg2)}.tile.f.rg3 .pt{fill:url(#rg3)}
.tile.f.rg4a .pt{fill:url(#rg4a)}.tile.f.rg4b .pt{fill:url(#rg4b)}.tile.f.rg5 .pt{fill:url(#rg5)}
.tile.sel .pt{stroke:var(--ink);stroke-width:1.3;stroke-opacity:1}
.tile:focus-visible .pt{stroke:var(--brand);stroke-width:1.5;stroke-opacity:1}
.ros-heart circle{fill:var(--ros-u0);stroke:var(--ros-line);stroke-width:.4}
.ros-heart .stm circle{fill:var(--ros-line);stroke:none}
.ros-heart.on>circle{fill:url(#rgc);stroke:#fff}
.ros-heart.on .stm circle{fill:#fff}
.ros-head{justify-content:center}
.ros-cap{display:grid;justify-items:center;gap:4px;text-align:center;font-size:.9rem;min-height:3.4em}
.ros-cap b{font-family:var(--disp)}

/* ---------- living ayah ---------- */
.live{background:var(--surface);border-radius:28px;box-shadow:var(--sh);padding:16px 18px 0;display:grid;gap:6px;overflow:hidden;margin-top:14px;position:relative}
.live::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--f)}
.live-top{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.live .kicker{font-family:var(--disp);font-weight:600;font-size:.85rem;color:var(--k)}
.live .ab{background:var(--bg)}
.live-ayah{position:relative;margin:4px 0 0;font-size:clamp(1.9rem,8.4vw,2.5rem);line-height:2.15;text-align:center;text-wrap:balance}
.hpill{position:absolute;top:0;left:0;width:0;height:0;border-radius:14px;background:var(--f);opacity:0;z-index:0;pointer-events:none}
.hw{position:relative;z-index:1;transition:color .2s}
.hw.on{color:var(--ink)}
.live-ayah:has(.hw.on) .hw:not(.on){color:color-mix(in srgb,var(--ink) 45%,transparent)}
.live-bar{display:flex;align-items:center;gap:12px;padding:4px 0 14px}
.pb.big{width:52px;height:52px}
.pb.big svg{width:22px;height:22px}
.live-meta{display:grid;gap:2px;min-width:0}
.live-meta .ref{font-size:.82rem;color:var(--mut)}
.hchip{justify-self:start;background:var(--f);color:var(--k);border-radius:999px;padding:1px 12px;font-weight:700;font-size:.88rem;display:inline-block}
.hprog{height:4px;background:var(--bg);margin:0 -18px}
.hprog i{display:block;height:100%;width:0;background:var(--red)}

/* ---------- lesson view toggle ---------- */
.lv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.lv-head h2{margin:0;font-size:1.3rem}
.wh-head .lv-head{margin-top:0}
.lv-toggle{display:inline-flex;background:var(--surface);box-shadow:var(--sh);border-radius:999px;padding:4px;gap:2px;flex:none}
.lv-toggle button{border:none;background:none;border-radius:999px;padding:6px 16px;font-size:.88rem;color:var(--mut);min-height:36px}
.lv-toggle button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}
.deck-hint{flex:1;text-align:center;font-size:.85rem}

/* ---------- explanation panel ---------- */
.live-bar{flex-wrap:wrap}
.hexp-btn{margin-inline-start:auto;border:none;border-radius:999px;background:var(--f);color:var(--k);font-weight:700;padding:8px 16px;font-size:.9rem}
.hexp-btn[aria-expanded="true"]{background:var(--ink);color:var(--surface)}
.hexp{overflow:hidden}
.hexp-in{background:var(--bg);border-radius:18px;padding:12px 16px;margin-bottom:14px;display:grid;gap:6px}
.hexp-in b{font-family:var(--disp);font-size:1.05rem;color:var(--k)}
.hexp-in p{margin:0}
.hexp-in ul{margin:0;padding-inline-start:18px;display:grid;gap:3px;font-size:.95rem}
.hexp-in .lt{font-family:var(--quran);color:var(--red);font-size:1.4rem}
.hexp-in .tip{color:var(--k);font-weight:600;font-size:.94rem}
.hexp-in .ab{justify-self:start;background:var(--surface);box-shadow:var(--sh)}

/* ---------- buttons, nav ---------- */
.btn{border:none;border-radius:16px;padding:13px 12px;font-weight:700;font-size:1rem;text-align:center;text-decoration:none;display:block}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.sec{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.btn.bad{background:var(--red-soft);color:var(--bad)}
.btn.good{background:var(--brand);color:var(--brand-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.endnav{display:grid;gap:10px;margin-top:22px}

/* ---------- flashcards ---------- */
.ph{margin:20px 0 8px;font-size:1.6rem;font-weight:700}
.scope{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.scope::-webkit-scrollbar{display:none}
.scope button{flex:none;border:none;border-radius:999px;padding:5px 14px;background:var(--surface);box-shadow:var(--sh);font-size:.86rem;white-space:nowrap}
.scope button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.deck-bar{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.deck-bar .count{font-family:var(--disp);font-weight:600;font-variant-numeric:tabular-nums;font-size:.92rem}
.deck-bar .ab{background:var(--surface);box-shadow:var(--sh)}
.deck-bar .ab.on{background:var(--ink);color:var(--surface)}
.deck{perspective:1400px;position:relative}
.deck::before,.deck::after{content:"";position:absolute;inset:10px 14px -8px;border-radius:28px;background:var(--surface);box-shadow:var(--sh);z-index:0;transform:rotate(-1.6deg)}
.deck::after{inset:6px 8px -4px;transform:rotate(1.2deg)}
.card{position:relative;z-index:1;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;perspective:1600px}
.flip{display:grid;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.45,.05,.25,1)}
.flip.on{transform:rotateY(180deg)}
.cf{grid-area:1/1;position:relative;min-height:360px;border-radius:28px;box-shadow:var(--sh);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;gap:10px;padding:24px 22px}
.cf.back{transform:rotateY(180deg)}
.flip.on .cf.front,.flip:not(.on) .cf.back{pointer-events:none}
@media (prefers-reduced-motion: reduce){.flip{transition:none}}
.cf.front{background:var(--f);align-items:center;justify-content:center;text-align:center}
.cf .kicker{font-family:var(--disp);font-size:.85rem;font-weight:600;color:var(--k)}
.cf .big{font-family:var(--disp);font-size:clamp(1.7rem,7vw,2.2rem);font-weight:700;line-height:1.45;text-wrap:balance}
.cf .hint{color:var(--mut);font-size:.9rem}
.cf .ask{margin-top:6px;background:var(--surface);border-radius:999px;padding:4px 16px;font-size:.92rem}
.cf .tap{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:.8rem;color:var(--k);opacity:.8}
.cf.back{background:var(--surface)}
.cf.back .kicker{font-size:1.05rem}
.cf.back p{margin:0}
.cf.back ul{margin:0;padding-inline-start:18px;display:grid;gap:4px;font-size:.94rem}
.cf .badge{align-self:flex-start;background:var(--f);color:var(--k);border-radius:999px;padding:1px 14px;font-weight:700;font-size:.88rem}
.cf .lt{font-family:var(--quran);color:var(--red);font-size:1.45rem;background:var(--f);border-radius:14px;padding:2px 12px;text-align:center}
.cf .tip{color:var(--k);font-weight:600;font-size:.94rem}
.cex{background:var(--bg);border-radius:16px;padding:4px 14px 8px}
.cex .q{font-size:1.45rem;display:block}
.deck-nav{display:flex;gap:10px;align-items:center;margin-top:18px}
.dbtn{width:52px;height:52px;border-radius:50%;border:none;background:var(--surface);box-shadow:var(--sh);display:grid;place-items:center;flex:none}
.dbtn svg{width:22px;height:22px}

/* ---------- topic wheel ---------- */
#v-wheel.on{position:fixed;inset:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wheel{height:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.wheel:active{cursor:grabbing}
.wh-head{padding:18px 4px 6px;display:grid;gap:0}
.wh-head .mut{font-size:.86rem}
.wh-stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);direction:ltr;gap:12px;align-items:center}
[dir="rtl"] .wh-stage>*{direction:rtl}
.drum{position:relative;height:100%;perspective:900px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent)}
.drum-in{position:absolute;inset:0;transform-style:preserve-3d}
.lens{position:absolute;left:0;right:0;top:50%;height:42px;transform:translateY(-50%);border-radius:14px;background:var(--surface);box-shadow:var(--sh)}
.wi{position:absolute;left:0;right:0;top:50%;height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border:none;background:none;text-align:start;font-size:.9rem;color:var(--mut);backface-visibility:hidden;-webkit-backface-visibility:hidden;white-space:nowrap;overflow:hidden;will-change:transform}
.wi span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.wi i{width:8px;height:8px;border-radius:50%;background:var(--f);flex:none;box-shadow:inset 0 0 0 1.5px var(--k)}
.wi.rd i{background:var(--k)}
.wi.on{color:var(--ink);font-weight:700;font-family:var(--disp);font-size:.95rem}
.wh-prev{background:var(--f);border-radius:26px;padding:18px 16px;display:grid;gap:10px;align-content:start;cursor:auto}
.wh-prev .crumb{font-size:.8rem;color:var(--k);font-weight:600}
.wh-prev h2{margin:0;font-size:clamp(1.15rem,4.6vw,1.6rem);line-height:1.45}
.wh-prev .meta{display:flex;flex-wrap:wrap;gap:5px}
.wh-prev .tag.rd{background:var(--k);color:var(--surface)}
.wh-prev .mini{display:flex;flex-wrap:wrap;gap:4px}
.wh-prev .mini span{font-size:.78rem;background:var(--surface);border-radius:999px;padding:1px 10px}
@media (max-width:480px){.wi{font-size:.82rem;padding:0 8px}.wi.on{font-size:.86rem}.wh-prev{padding:14px 12px}.wh-prev .mini{display:none}}

/* ---------- search ---------- */
.srch{width:100%;border:none;border-radius:18px;padding:14px 18px;background:var(--surface);box-shadow:var(--sh);font-size:1.02rem}
.res{display:grid;gap:8px;margin-top:12px}
.hit{display:block;width:100%;text-align:start;border:none;border-radius:18px;padding:11px 16px;background:var(--surface);box-shadow:var(--sh);position:relative;overflow:hidden}
.hit::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--f)}
.hit b{font-family:var(--disp);font-weight:600}
.hit small{display:block;color:var(--mut)}

nav.tabs{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:10;width:min(360px,calc(100% - 32px));background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;box-shadow:0 8px 30px rgba(10,20,16,.16),0 0 0 1px var(--hair);display:grid;grid-template-columns:repeat(3,1fr);padding:5px}
nav.tabs a{display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 0;white-space:nowrap;color:var(--mut);text-decoration:none;font-size:.86rem;border-radius:999px}
nav.tabs a svg{width:20px;height:20px}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--surface);font-weight:700}
@media (prefers-reduced-motion: reduce){.fc{transition:none}.beats i{transition:none}.lesson:hover{transform:none}}

/* ---------- English / Dansk: left-to-right UI, Qurʾān text stays Arabic and right-to-left ---------- */
.langbar{display:flex;justify-content:flex-end;margin:2px 0 -4px}
.langbar .lv-toggle button{min-width:42px;font-weight:700}
.langbar .lv-toggle button[lang="ar"]{font-family:"Noto Kufi Arabic",var(--ui)}
[dir="ltr"]{--disp:"Noto Sans","Segoe UI",system-ui,sans-serif;--ui:"Noto Sans","Segoe UI",system-ui,sans-serif}
[dir="ltr"] body,[dir="ltr"]{line-height:1.65}
[dir="ltr"] .q,[dir="ltr"] td.q,[dir="ltr"] .rule .lt,[dir="ltr"] .hexp-in .lt,[dir="ltr"] .cf .lt,[dir="ltr"] .live-ayah{direction:rtl;unicode-bidi:isolate}
[dir="ltr"] .exl .q{display:block;text-align:right}
.arn{font-family:var(--quran);font-weight:400;font-size:.92em;color:var(--k,var(--mut));opacity:.85;white-space:nowrap;unicode-bidi:isolate}
.cf .arn.big2{font-size:1.5rem;line-height:1.4;opacity:1;color:var(--red)}
[dir="ltr"] .iconbtn svg,[dir="ltr"] .cont .go svg,[dir="ltr"] .dbtn svg{transform:scaleX(-1)}
[dir="ltr"] h1,[dir="ltr"] h2,[dir="ltr"] h3{letter-spacing:-.01em}
[dir="ltr"] .tbl td,[dir="ltr"] .tbl th{text-align:start}
[dir="ltr"] .chain .pt{overflow-wrap:anywhere;hyphens:auto;font-size:.8rem;padding:5px 3px}
[dir="ltr"] .chain .lk{padding:1px 6px;font-size:.7rem}
.wh-prev{min-width:0}
.wh-prev h2,.wh-prev .crumb{overflow-wrap:anywhere;hyphens:auto}
.wh-prev .btn{max-width:100%;white-space:normal}
</style>

  {t:"بلّغهم منطوقًا (النقل الصوتي)",c:"peach",list:["نزل جبريل عليه السلام بالقرآن على قلب النبي ﷺ بألفاظه ومعانيه","تلقّى الصحابة القرآن من فم رسول الله ﷺ وأعادوه أمامه حتى أقرّهم","نقله الصحابة إلى من بعدهم بالطريقة نفسها، وهكذا حتى وصل إلينا"]}
 ]}
]});

CH.push({id:"fadl",part:"p1",t:"فضائل القرآن الكريم",pg:"٤–٥",c:"yellow",b:[
 {k:"h",t:"آيات في فضل القرآن"},

 {k:"quotes",c:"yellow",q:[

  ["من قرأ حرفًا من كتاب الله فله به حسنة، والحسنة بعشر أمثالها. لا أقول الم حرف، ولكن ألف حرف ولام حرف وميم حرف.","ابن مسعود رضي الله عنه. رواه الترمذي"],
  ["الماهر بالقرآن مع السفرة الكرام البررة، والذي يقرأ القرآن ويتتعتع فيه وهو عليه شاق له أجران.","عائشة رضي الله عنها. متفق عليه"],
  ["اقرؤوا القرآن فإنه يأتي يوم القيامة شفيعًا لأصحابه.","أبو أمامة رضي الله عنه. رواه مسلم"],
  ["يقال لصاحب القرآن: اقرأ وارتقِ ورتّل كما كنت ترتّل في الدنيا، فإن منزلتك عند آخر آية تقرؤها.","عبد الله بن عمرو رضي الله عنهما. رواه الترمذي"],
  ["إن الله يرفع بهذا الكتاب أقوامًا ويضع به آخرين.","عمر بن الخطاب رضي الله عنه. رواه مسلم"],
  ["ما اجتمع قوم في بيت من بيوت الله، يتلون كتاب الله ويتدارسونه بينهم، إلا نزلت عليهم السكينة، وغشيتهم الرحمة، وحفّتهم الملائكة، وذكرهم الله فيمن عنده.","أبو هريرة رضي الله عنه. رواه مسلم"]
 ]},
]});

CH.push({id:"basm",part:"p2",t:"البسملة",pg:"١١",c:"green",b:[
 {k:"p",t:"اتفق العلماء على أن البسملة جزء من آية في سورة النمل: «إِنَّهُ مِن سُلَيْمَانَ وَإِنَّهُ بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ». واختلفوا هل هي آية من الفاتحة: فالكوفيون يعدّونها أول آية منها. ورواية حفص عن عاصم الكوفي تتبع العدّ الكوفي، فالبسملة فيها آية من الفاتحة."},
 {k:"rule",id:"basmala",name:"حكم البسملة",alt:"بسم الله الرحمن الرحيم",def:"يجب الإتيان بها عند الابتداء بأول كل سورة إلا سورة التوبة. وأما البدء من وسط السورة فالقارئ مخيّر.",tip:"التوبة وحدها بلا بسملة في أولها."},
 {k:"rule",id:"anfal",c:"peach",name:"بين الأنفال والتوبة",def:"لا يبتدئ القارئ سورة التوبة بالبسملة. وإذا وصل آخر الأنفال بأول التوبة فله ثلاثة أوجه جائزة.",
  cond:["الوقف: بالتنفس","السكت: بدون تنفس","الوصل: فيكون الحكم بينهما الإقلاب، لالتقاء التنوين بالباء"],
