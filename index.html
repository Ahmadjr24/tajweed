d tanwīn «ـًـٌـٍ»","Tegn: sukūn på nūn og stablet tanwīn «ـًـٌـٍ»"],"الإدغام بغنة":["Idghām with ghunnah (merging with nasal sound)","Idghām med ghunnah (sammensmeltning med nasallyd)"],"إدخال النون الساكنة أو التنوين في حرف متحرك بعدها، فيصيران حرفًا واحدًا مشددًا بحركة الثاني، مع الغنة.":["Merging the still nūn or tanwīn into the voweled letter after it, so they become one doubled letter with the second letter’s vowel, with ghunnah.","At smelte den stille nūn eller tanwīn sammen med det vokaliserede bogstav efter, så de bliver ét fordoblet bogstav med det andets vokal, med ghunnah."],"حروف الإدغام كلها ستة: «يَرْمُلُون».":["All six idghām letters: «يَرْمُلُون».","Alle seks idghām-bogstaver: «يَرْمُلُون»."],"سببه: التماثل أو تقارب مخارج حروف الإدغام من مخرج النون":["Why: the letters are identical to or close to the makhraj of nūn","Hvorfor: bogstaverne er identiske med eller tæt på nūns makhraj"],"يكون في كلمتين فقط":["Occurs only across two words","Forekommer kun på tværs af to ord"],"مع النون والميم: إدغام كامل بغنة":["With nūn and mīm: full idghām with ghunnah","Med nūn og mīm: fuld idghām med ghunnah"],"مع الياء والواو: إدغام ناقص بغنة":["With yāʾ and wāw: partial idghām with ghunnah","Med yāʾ og wāw: delvis idghām med ghunnah"],"علامته: تعرية النون من السكون، والتنوين متتابع":["Sign: no sukūn on the nūn, and staggered tanwīn","Tegn: ingen sukūn på nūn og forskudt tanwīn"],"الإدغام بغير غنة":["Idghām without ghunnah","Idghām uden ghunnah"],"إدخال النون الساكنة أو التنوين في اللام أو الراء إدغامًا كاملًا بلا غنة.":["Fully merging the still nūn or tanwīn into lām or rāʾ, with no ghunnah.","Fuld sammensmeltning af den stille nūn eller tanwīn med lām eller rāʾ, uden ghunnah."],"ما يُظهر مع وجود حرف الإدغام":["Clear despite an idghām letter","Tydelig trods et idghām-bogstav"],"تُظهر النون في أربع كلمات لأن النون والحرف بعدها في كلمة واحدة: قِنْوَانٌ، بُنْيَانٌ، صِنْوَانٌ، الدُّنْيَا. وتُظهر كذلك في «يس ۚ وَالْقُرْآنِ الْحَكِيمِ» و«ن ۚ وَالْقَلَمِ».":["The nūn is pronounced clearly in four words, because the nūn and the next letter are in one word: قِنْوَانٌ، بُنْيَانٌ، صِنْوَانٌ، الدُّنْيَا. Likewise in «يس ۚ وَالْقُرْآنِ الْحَكِيمِ» and «ن ۚ وَالْقَلَمِ».","Nūn udtales tydeligt i fire ord, fordi nūn og det næste bogstav er i samme ord: قِنْوَانٌ، بُنْيَانٌ، صِنْوَانٌ، الدُّنْيَا. Ligeledes i «يس ۚ وَالْقُرْآنِ الْحَكِيمِ» og «ن ۚ وَالْقَلَمِ»."],"إظهار النون في «يس» و«ن»":["Clear nūn in «يس» and «ن»","Tydelig nūn i «يس» og «ن»"],"تُظهر نون «يَاسِينْ» ونون «نُونْ» عند الواو وصلًا لحفص.":["The nūn of «يَاسِينْ» and of «نُونْ» is pronounced clearly before the wāw when joining, for Ḥafṣ.","Nūn i «يَاسِينْ» og i «نُونْ» udtales tydeligt foran wāw ved sammenhæng, for Ḥafṣ."],"الإقلاب":["Iqlāb (conversion)","Iqlāb (omdannelse)"],"قلب النون الساكنة أو التنوين ميمًا مخفاة عند حرف الباء مع بقاء الغنة.":["Turning the still nūn or tanwīn into a hidden mīm before bāʾ, keeping the ghunnah.","At omdanne den stille nūn eller tanwīn til en skjult mīm foran bāʾ og beholde ghunnah."],"سببه: اشتراك النون والميم في الصفات، واشتراك الميم والباء في المخرج":["Why: nūn and mīm share qualities, and mīm and bāʾ share a makhraj","Hvorfor: nūn og mīm deler egenskaber, og mīm og bāʾ deler makhraj"],"علامته: ميم صغيرة فوق النون، وفي التنوين ميم مع الحركة":["Sign: a small mīm above the nūn; with tanwīn, a mīm with the vowel","Tegn: en lille mīm over nūn; ved tanwīn en mīm med vokalen"],"الإخفاء":["Ikhfāʾ (hiding)","Ikhfāʾ (skjulning)"],"الإخفاء الحقيقي":["True ikhfāʾ","Ægte ikhfāʾ"],"النطق بالحرف بصفة بين الإظهار والإدغام، مع بقاء غنة الحرف الساكن، بدون تشديد الحرف الثاني.":["Pronouncing the letter in a way between iẓhār and idghām, keeping the ghunnah of the still letter, without doubling the next letter.","At udtale bogstavet midt mellem iẓhār og idghām, beholde det stille bogstavs ghunnah, uden at fordoble det næste bogstav."],"«صِفْ ذَا ثَنَا كَمْ جَادَ شَخْصٌ قَدْ سَمَا ... دُمْ طَيِّبًا زِدْ فِي تُقًى ضَعْ ظَالِمَا».":["Mnemonic (first letters): «صِفْ ذَا ثَنَا كَمْ جَادَ شَخْصٌ قَدْ سَمَا ... دُمْ طَيِّبًا زِدْ فِي تُقًى ضَعْ ظَالِمَا».","Huskevers (første bogstaver): «صِفْ ذَا ثَنَا كَمْ جَادَ شَخْصٌ قَدْ سَمَا ... دُمْ طَيِّبًا زِدْ فِي تُقًى ضَعْ ظَالِمَا»."],"سببه: أن الحرف بعد النون لا هو قريب فيُدغم، ولا بعيد فيُظهر":["Why: the letter after the nūn is neither close enough to merge nor far enough to be clear","Hvorfor: bogstavet efter nūn er hverken tæt nok til at smelte sammen eller langt nok væk til at være tydeligt"],"علامته: عدم السكون على النون وعدم تشديد ما بعدها، والتنوين متتابع":["Sign: no sukūn on the nūn and no shaddah on the next letter; staggered tanwīn","Tegn: ingen sukūn på nūn og ingen shaddah på næste bogstav; forskudt tanwīn"],"أمثلة أخرى":["More examples","Flere eksempler"],"ء هـ ع ح غ خ":["ء هـ ع ح غ خ","ء هـ ع ح غ خ"],"الإدغام بلا غنة":["Idghām without ghunnah","Idghām uden ghunnah"],"بقية الحروف":["All other letters","Alle øvrige bogstaver"],"الفرق بين النون الساكنة والتنوين":["Nūn sākinah vs. tanwīn","Nūn sākinah og tanwīn"],"النون الساكنة":["Nūn sākinah","Nūn sākinah"],"التنوين":["Tanwīn","Tanwīn"],"تأتي في وسط الكلمة أو في نهايتها":["Comes in the middle or at the end of a word","Står midt i eller sidst i et ord"],"يأتي في نهاية الكلمة فقط":["Comes only at the end of a word","Står kun sidst i et ord"],"تكون في الأفعال والحروف والأسماء":["Found in verbs, particles and nouns","Findes i verber, partikler og navneord"],"يلحق الأسماء فقط":["Only on nouns","Kun på navneord"],"تثبت لفظًا وخطًّا، وصلًا ووقفًا":["Written and pronounced, when joining and stopping","Skrives og udtales, ved sammenhæng og stop"],"يثبت لفظًا ووصلًا، ويسقط وقفًا وخطًّا":["Pronounced when joining; dropped when stopping and not written as a letter","Udtales ved sammenhæng; falder bort ved stop og skrives ikke som bogstav"],"أحكام الميم الساكنة":["Rules of mīm sākinah","Regler for mīm sākinah"],"ماذا بعد الميم الساكنة؟ اختر الحرف":["What comes after the still mīm? Pick the letter","Hvad kommer efter den stille mīm? Vælg bogstavet"],"الإدغام الشفوي":["Lip idghām (idghām shafawī)","Læbe-idghām (idghām shafawī)"],"إدغام متماثلين":["Merging two identical letters","Sammensmeltning af to ens bogstaver"],"إدخال الميم الساكنة في الميم المتحركة، بحيث تُلفظان ميمًا واحدة مشددة بحركة الميم الثانية.":["Merging the still mīm into a voweled mīm, so they are said as one doubled mīm with the second one’s vowel.","At smelte den stille mīm sammen med en vokaliseret mīm, så de siges som én fordoblet mīm med den andens vokal."],"علامته: حذف السكون عن الميم، وتشديد الميم التي بعدها":["Sign: no sukūn on the mīm, and a shaddah on the mīm after it","Tegn: ingen sukūn på mīm og shaddah på mīm efter den"],"تكون الشفتان مطبقتين إطباقًا كاملًا":["The lips close fully","Læberne lukkes helt"],"الإخفاء الشفوي":["Lip ikhfāʾ (ikhfāʾ shafawī)","Læbe-ikhfāʾ (ikhfāʾ shafawī)"],"النطق بالميم الساكنة بصفة بين الإظهار والإدغام مع الغنة، إذا جاء بعدها حرف الباء.":["Pronouncing the still mīm between iẓhār and idghām, with ghunnah, when bāʾ comes after it.","At udtale den stille mīm mellem iẓhār og idghām med ghunnah, når bāʾ følger efter."],"علامته: حذف السكون عن الميم، والباء بعدها غير مشددة":["Sign: no sukūn on the mīm, and the bāʾ after it has no shaddah","Tegn: ingen sukūn på mīm, og bāʾ efter den har ingen shaddah"],"تكون الشفتان متلامستين فقط، دون ضغط ودون ترك فرجة بينهما":["The lips only touch, without pressing and without leaving a gap","Læberne rører kun hinanden, uden tryk og uden mellemrum"],"سُمّي شفويًا لخروج الميم من الشفتين":["Called “lip” because the mīm comes from the lips","Kaldes “læbe”, fordi mīm kommer fra læberne"],"الإظهار الشفوي":["Lip iẓhār (iẓhār shafawī)","Læbe-iẓhār (iẓhār shafawī)"],"إخراج الميم الساكنة من مخرجها من غير زيادة في الغنة، إذا جاء بعدها أي حرف غير الميم والباء.":["Pronouncing the still mīm from its makhraj, without extra ghunnah, before any letter except mīm and bāʾ.","At udtale den stille mīm fra dens makhraj uden ekstra ghunnah foran ethvert bogstav undtagen mīm og bāʾ."],"علامته: وجود السكون على الميم":["Sign: a sukūn on the mīm","Tegn: sukūn på mīm"],"احذر إخفاء الميم عند الواو والفاء، لاتحاد مخرجها مع الواو وقربه من الفاء: هُمْ وَأَزْوَاجُهُمْ، هُمْ فِيهَا":["Take care not to hide the mīm before wāw and fāʾ: mīm shares its makhraj with wāw and is close to fāʾ: هُمْ وَأَزْوَاجُهُمْ، هُمْ فِيهَا","Pas på ikke at skjule mīm foran wāw og fāʾ: mīm deler makhraj med wāw og ligger tæt på fāʾ: هُمْ وَأَزْوَاجُهُمْ، هُمْ فِيهَا"],"أحكام اللام الساكنة":["Rules of lām sākinah","Regler for lām sākinah"],"لام التعريف: اختر الحرف الذي بعد «ال»":["The lām of “al-”: pick the letter after «ال»","Lām i “al-”: vælg bogstavet efter «ال»"],"اللام الشمسية":["Sun lām (al-shamsiyyah)","Sol-lām (al-shamsiyyah)"],"إدغام لام التعريف":["Merging the lām of “al-”","Sammensmeltning af lām i “al-”"],"إدغام لام «ال» التعريف في الحروف الشمسية الأربعة عشر: للتماثل مع اللام، وللتقارب مع بقية الحروف.":["The lām of “al-” merges into the fourteen sun letters: because it is identical with lām, and close to the others.","Lām i “al-” smelter sammen med de fjorten solbogstaver: fordi den er identisk med lām og tæt på de øvrige."],"التَّوَّاب، الرَّحْمَٰن، النَّاس، الدَّاع.":["التَّوَّاب، الرَّحْمَٰن، النَّاس، الدَّاع.","التَّوَّاب، الرَّحْمَٰن، النَّاس، الدَّاع."],"علامته: تجريد اللام من العلامة مع تشديد الحرف الذي يليها":["Sign: the lām has no mark, and the letter after it has a shaddah","Tegn: lām har intet tegn, og bogstavet efter har shaddah"],"اللام القمرية":["Moon lām (al-qamariyyah)","Måne-lām (al-qamariyyah)"],"إظهار لام التعريف":["Pronouncing the lām of “al-” clearly","Tydelig udtale af lām i “al-”"],"إظهار لام «ال» التعريف إذا وقع بعدها أحد الحروف القمرية الأربعة عشر.":["The lām of “al-” is pronounced clearly before any of the fourteen moon letters.","Lām i “al-” udtales tydeligt foran de fjorten månebogstaver."],"«اِبْغِ حَجَّكَ وَخَفْ عَقِيمَهُ».":["Mnemonic: «اِبْغِ حَجَّكَ وَخَفْ عَقِيمَهُ».","Huskeord: «اِبْغِ حَجَّكَ وَخَفْ عَقِيمَهُ»."],"علامته: إثبات السكون على اللام، وعدم تشديد ما بعدها":["Sign: a sukūn on the lām, and no shaddah on the next letter","Tegn: sukūn på lām og ingen shaddah på næste bogstav"],"انتبه للجيم خاصة، فكثير من المبتدئين تسبق ألسنتهم إلى إدغامها: الْجِبَال، الْجَنَّة":["Watch jīm especially: many beginners slip into merging it: الْجِبَال، الْجَنَّة","Pas især på jīm: mange begyndere kommer til at smelte den sammen: الْجِبَال، الْجَنَّة"],"إدغام لام الفعل والحرف":["Merging the lām of verbs and particles","Sammensmeltning af lām i verber og partikler"],"تُدغم اللام الساكنة في لام بعدها بسبب التماثل، وفي راء بعدها بسبب التقارب.":["A still lām merges into a following lām because they are identical, and into a following rāʾ because they are close.","En stille lām smelter sammen med en efterfølgende lām, fordi de er ens, og med en efterfølgende rāʾ, fordi de er tæt på hinanden."],"قُل رَّبِّ، قُل لَّهُم، بَل رَّفَعَهُ، هَل لَّنَا، بَل لَّا تُكْرِمُونَ":["قُل رَّبِّ، قُل لَّهُم، بَل رَّفَعَهُ، هَل لَّنَا، بَل لَّا تُكْرِمُونَ","قُل رَّبِّ، قُل لَّهُم، بَل رَّفَعَهُ، هَل لَّنَا، بَل لَّا تُكْرِمُونَ"],"لا تُدغم اللام في الراء في «بَلْ ۜ رَانَ» لوجود السكت":["The lām does not merge into rāʾ in «بَلْ ۜ رَانَ» because of the sakt (pause)","Lām smelter ikke sammen med rāʾ i «بَلْ ۜ رَانَ» på grund af sakt (pausen)"],"إظهار لام الاسم والفعل والحرف":["Clear lām in nouns, verbs and particles","Tydelig lām i navneord, verber og partikler"],"إخراج لام الاسم أو الفعل أو الحرف من مخرجها إذا جاء بعدها حرف غير اللام والراء.":["Pronouncing the lām of a noun, verb or particle clearly when any letter except lām and rāʾ follows.","At udtale lām i et navneord, verbum eller partikel tydeligt, når et andet bogstav end lām og rāʾ følger."],"جَعَلْنَا، يَلْفِظُ، قُلْ هُوَ، قُلْ نَعَمْ، هَلْ أَتَاكَ، بَلْ طَبَعَ، بَلْ سَوَّلَتْ":["جَعَلْنَا، يَلْفِظُ، قُلْ هُوَ، قُلْ نَعَمْ، هَلْ أَتَاكَ، بَلْ طَبَعَ، بَلْ سَوَّلَتْ","جَعَلْنَا، يَلْفِظُ، قُلْ هُوَ، قُلْ نَعَمْ، هَلْ أَتَاكَ، بَلْ طَبَعَ، بَلْ سَوَّلَتْ"],"انتبه إلى إظهار لام الفعل قبل النون، فكثير من المبتدئين يدغمها لقرب المخرجين: جَعَلْنَا، قُلْنَا، أَنزَلْنَا":["Take care to pronounce the lām of a verb before nūn clearly; many beginners merge it because the makhārij are close: جَعَلْنَا، قُلْنَا، أَنزَلْنَا","Sørg for at udtale lām i et verbum foran nūn tydeligt; mange begyndere smelter den sammen, fordi makhārij ligger tæt: جَعَلْنَا، قُلْنَا، أَنزَلْنَا"],"أنواع الإدغام":["Types of idghām (merging)","Slags idghām (sammensmeltning)"],"إدغام المتماثلين":["Merging identical letters (mutamāthilān)","Sammensmeltning af ens bogstaver (mutamāthilān)"],"المتماثلان: الحرفان اللذان اتحدا في المخرج والصفة. فإذا سكن الأول أُدغم في الثاني.":["Identical letters share both makhraj and qualities. When the first is still, it merges into the second.","Ens bogstaver deler både makhraj og egenskaber. Når det første er stille, smelter det sammen med det andet."],"إدغام المتجانسين":["Merging related letters (mutajānisān)","Sammensmeltning af beslægtede bogstaver (mutajānisān)"],"المتجانسان: الحرفان اللذان اتحدا في المخرج واختلفا في الصفة.":["Related letters share a makhraj but differ in qualities.","Beslægtede bogstaver deler makhraj, men har forskellige egenskaber."],"التاء في الدال: أَثْقَلَت دَّعَوَا":["Tāʾ into dāl: أَثْقَلَت دَّعَوَا","Tāʾ ind i dāl: أَثْقَلَت دَّعَوَا"],"الدال في التاء: قَد تَّبَيَّنَ":["Dāl into tāʾ: قَد تَّبَيَّنَ","Dāl ind i tāʾ: قَد تَّبَيَّنَ"],"التاء في الطاء: فَآمَنَت طَّائِفَةٌ":["Tāʾ into ṭāʾ: فَآمَنَت طَّائِفَةٌ","Tāʾ ind i ṭāʾ: فَآمَنَت طَّائِفَةٌ"],"الطاء في التاء: أَحَطتُ (ناقص)":["Ṭāʾ into tāʾ: أَحَطتُ (partial)","Ṭāʾ ind i tāʾ: أَحَطتُ (delvis)"],"الذال في الظاء: إِذ ظَّلَمُوا":["Dhāl into ẓāʾ: إِذ ظَّلَمُوا","Dhāl ind i ẓāʾ: إِذ ظَّلَمُوا"],"الثاء في الذال: يَلْهَث ذَّٰلِكَ":["Thāʾ into dhāl: يَلْهَث ذَّٰلِكَ","Thāʾ ind i dhāl: يَلْهَث ذَّٰلِكَ"],"الباء في الميم: ارْكَب مَّعَنَا":["Bāʾ into mīm: ارْكَب مَّعَنَا","Bāʾ ind i mīm: ارْكَب مَّعَنَا"],"إدغام المتقاربين":["Merging close letters (mutaqāribān)","Sammensmeltning af nærtliggende bogstaver (mutaqāribān)"],"المتقاربان: الحرفان اللذان تقاربا في المخرج والصفة.":["Close letters are near each other in makhraj and qualities.","Nærtliggende bogstaver ligger tæt på hinanden i makhraj og egenskaber."],"اللام في الراء: وَقُل رَّبِّ":["Lām into rāʾ: وَقُل رَّبِّ","Lām ind i rāʾ: وَقُل رَّبِّ"],"القاف في الكاف: نَخْلُقكُّم":["Qāf into kāf: نَخْلُقكُّم","Qāf ind i kāf: نَخْلُقكُّم"],"النون مع حروف «يرملو»":["Nūn with the letters «يرملو»","Nūn med bogstaverne «يرملو»"],"لام التعريف مع ثلاثة عشر حرفًا شمسيًا":["The lām of “al-” with thirteen sun letters","Lām i “al-” med tretten solbogstaver"],"الكامل والناقص":["Full and partial","Fuld og delvis"],"الإدغام الكامل":["Full idghām","Fuld idghām"],"إدغام الحرف الساكن في المتحرك بعده ذاتًا وصفة، فلا يبقى للأول أثر، مع تشديد الثاني. وكل الإدغامات في القرآن كاملة إلا ما ذُكر في الناقص.":["The still letter merges completely into the next, in sound and quality, leaving no trace, and the second is doubled. Every idghām in the Qurʾān is full, except the partial cases.","Det stille bogstav smelter helt sammen med det næste i lyd og egenskab uden at efterlade spor, og det andet fordobles. Al idghām i Koranen er fuld, undtagen de delvise tilfælde."],"الإدغام الناقص":["Partial idghām","Delvis idghām"],"إدغام الحرف فيما بعده ذاتًا مع بقاء صفته، ولا يُشدد الثاني. وهو في ثلاث حالات فقط: النون مع الياء، والنون مع الواو، والطاء مع التاء.":["The letter merges into the next but keeps its quality, and the second is not doubled. Only three cases: nūn with yāʾ, nūn with wāw, and ṭāʾ with tāʾ.","Bogstavet smelter sammen med det næste, men beholder sin egenskab, og det andet fordobles ikke. Kun tre tilfælde: nūn med yāʾ, nūn med wāw og ṭāʾ med tāʾ."],"موانع الإدغام":["What prevents idghām","Hvad der forhindrer idghām"],"إذا كان الحرف الأول حرف مد، مثل: فِي يُوسُفَ، قَالُوا وَهُمْ.":["When the first letter is a madd letter, as in فِي يُوسُفَ، قَالُوا وَهُمْ.","Når det første bogstav er et madd-bogstav, som i فِي يُوسُفَ، قَالُوا وَهُمْ."],"إذا كان هناك سكت، مثل: مَنْ ۜ رَاقٍ، بَلْ ۜ رَانَ.":["When there is a sakt (pause), as in مَنْ ۜ رَاقٍ، بَلْ ۜ رَانَ.","Når der er en sakt (pause), som i مَنْ ۜ رَاقٍ، بَلْ ۜ رَانَ."],"في «مَالِيَهْ ۜ هَلَكَ» (الحاقة: ٢٨–٢٩) يجوز السكت كما ورد في الرواية، ويجوز الإدغام لكونه متماثلًا، ويجوز الوقف لكونه رأس آية.":["In «مَالِيَهْ ۜ هَلَكَ» (al-Ḥāqqah 28–29) sakt is allowed as narrated, idghām is allowed as the letters are identical, and stopping is allowed as it is the end of a verse.","I «مَالِيَهْ ۜ هَلَكَ» (al-Ḥāqqah 28–29) er sakt tilladt som overleveret, idghām er tilladt, da bogstaverne er ens, og stop er tilladt, da det er versets slutning."],"همزة الوصل وهمزة القطع":["Hamzat al-waṣl and hamzat al-qaṭʿ","Hamzat al-waṣl og hamzat al-qaṭʿ"],"همزة القطع":["Hamzat al-qaṭʿ (fixed hamzah)","Hamzat al-qaṭʿ (fast hamzah)"],"الهمزة التي تثبت لفظًا ورسمًا، ابتداءً ووصلًا ووقفًا. تكون في الأفعال والأسماء والحروف، وتأتي في أول الكلمة ووسطها وآخرها. وعلامتها «ء».":["The hamzah that is always written and pronounced: when starting, joining and stopping. It occurs in verbs, nouns and particles, at the start, middle or end of a word. Its sign is «ء».","Den hamzah, der altid skrives og udtales: ved start, sammenhæng og stop. Den findes i verber, navneord og partikler, først, midt i eller sidst i ordet. Dens tegn er «ء»."],"أَتَىٰ، يُؤْمِنُونَ، أَهْلِ، إِيمَانِكُمْ، يَأْتِي، إِسْرَائِيلَ، يَشَاءُ.":["أَتَىٰ، يُؤْمِنُونَ، أَهْلِ، إِيمَانِكُمْ، يَأْتِي، إِسْرَائِيلَ، يَشَاءُ.","أَتَىٰ، يُؤْمِنُونَ، أَهْلِ، إِيمَانِكُمْ، يَأْتِي، إِسْرَائِيلَ، يَشَاءُ."],"همزة الوصل":["Hamzat al-waṣl (connecting hamzah)","Hamzat al-waṣl (forbindende hamzah)"],"الهمزة الزائدة التي تثبت لفظًا عند الابتداء بالساكن فقط، وتسقط في الدرج (الوصل). تدخل على الأسماء والحروف والأفعال، ولا تأتي إلا في أول الكلمة. وعلامتها صاد صغيرة فوق الألف «ٱ».":["An extra hamzah, pronounced only when you start on a still letter, and dropped when joining. It occurs in nouns, particles and verbs, only at the start of a word. Its sign is a small ṣād above the alif «ٱ».","En ekstra hamzah, der kun udtales, når man begynder på et stille bogstav, og som falder bort ved sammenhæng. Den findes i navneord, partikler og verber, kun først i ordet. Dens tegn er en lille ṣād over alif «ٱ»."],"الْحَمْدُ، السَّمَاوَاتِ، اسْتَسْقَىٰ، اضْرِب، اثْنَتَا، اشْرَبُوا.":["الْحَمْدُ، السَّمَاوَاتِ، اسْتَسْقَىٰ، اضْرِب، اثْنَتَا، اشْرَبُوا.","الْحَمْدُ، السَّمَاوَاتِ، اسْتَسْقَىٰ، اضْرِب، اثْنَتَا، اشْرَبُوا."],"حركة البدء بهمزة الوصل":["Which vowel to start hamzat al-waṣl with","Hvilken vokal hamzat al-waṣl begyndes med"],"همزة الوصل في لام التعريف":["Hamzat al-waṣl in “al-”","Hamzat al-waṣl i “al-”"],"بالفتح":["With fatḥah","Med fatḥah"],"يُبدأ بهمزة الوصل مفتوحة في «ال» التعريف.":["Hamzat al-waṣl is started with fatḥah in “al-”.","Hamzat al-waṣl begyndes med fatḥah i “al-”."],"اَلْأَرْض، اَلْحَمْد، اَلْحَجَر.":["اَلْأَرْض، اَلْحَمْد، اَلْحَجَر.","اَلْأَرْض، اَلْحَمْد، اَلْحَجَر."],"همزة الوصل في الأسماء السماعية":["Hamzat al-waṣl in the listed nouns","Hamzat al-waṣl i de overleverede navneord"],"بالكسر":["With kasrah","Med kasrah"],"يُبدأ بهمزة الوصل مكسورة في الأسماء السبعة: اِبْن، اِبْنَت، اِمْرَأَة، اِمْرُؤ، اِثْنَا، اِثْنَتَا، اِسْم.":["Hamzat al-waṣl is started with kasrah in seven nouns: اِبْن، اِبْنَت، اِمْرَأَة، اِمْرُؤ، اِثْنَا، اِثْنَتَا، اِسْم.","Hamzat al-waṣl begyndes med kasrah i syv navneord: اِبْن، اِبْنَت، اِمْرَأَة، اِمْرُؤ، اِثْنَا، اِثْنَتَا، اِسْم."],"«بِئْسَ الِاسْمُ» (الحجرات: ١١) فيها وجهان عند الابتداء بـ«الاسم»: بفتح همزة الوصل «أَلِسْمُ»، أو باللام المكسورة «لِسْمُ»":["«بِئْسَ الِاسْمُ» (al-Ḥujurāt 11) has two ways when starting on «الاسم»: with an opening hamzah «أَلِسْمُ», or with lām and kasrah «لِسْمُ»","«بِئْسَ الِاسْمُ» (al-Ḥujurāt 11) har to måder, når man begynder på «الاسم»: med hamzah og fatḥah «أَلِسْمُ» eller med lām og kasrah «لِسْمُ»"],"همزة الوصل في الأفعال":["Hamzat al-waṣl in verbs","Hamzat al-waṣl i verber"],"قاعدة الحرف الثالث":["The third-letter rule","Reglen om tredje bogstav"],"يُنظر إلى الحرف الثالث من الفعل: إذا كان مفتوحًا أو مكسورًا بُدئ بالكسر، وإذا كان مضمومًا بُدئ بالضم.":["Look at the verb’s third letter: if it has fatḥah or kasrah, start with kasrah; if it has ḍammah, start with ḍammah.","Se på verbets tredje bogstav: har det fatḥah eller kasrah, begyndes med kasrah; har det ḍammah, begyndes med ḍammah."],"بالكسر: اِعْمَلُوا، اِغْفِرْ، اِخْتَلَفُوا، اِضْرِب":["With kasrah: اِعْمَلُوا، اِغْفِرْ، اِخْتَلَفُوا، اِضْرِب","Med kasrah: اِعْمَلُوا، اِغْفِرْ، اِخْتَلَفُوا، اِضْرِب"],"بالضم: اُدْخُلُوا، اُدْعُ، اُسْكُنْ، اُعْبُدُوا":["With ḍammah: اُدْخُلُوا، اُدْعُ، اُسْكُنْ، اُعْبُدُوا","Med ḍammah: اُدْخُلُوا، اُدْعُ، اُسْكُنْ، اُعْبُدُوا"],"يُبدأ بالكسر في: اِمْشُوا، اِقْضُوا، اِبْنُوا، اِيتُوا، لأن ضمة الحرف الثالث فيها عارضة وليست أصلية":["Start with kasrah in اِمْشُوا، اِقْضُوا، اِبْنُوا، اِيتُوا, because the third letter’s ḍammah there is temporary, not original","Begynd med kasrah i اِمْشُوا، اِقْضُوا، اِبْنُوا، اِيتُوا, fordi tredje bogstavs ḍammah her er midlertidig, ikke oprindelig"],"اجتماع همزتي قطع":["Two fixed hamzahs together","To faste hamzah sammen"],"اجتماع همزتي قطع متحركتين":["Two voweled fixed hamzahs together","To vokaliserede faste hamzah sammen"],"إذا اجتمعت همزتا قطع متحركتان، فحفص يحقّق الهمزتين: أَئِنَّكُمْ، أَأُلْقِيَ، أَأَنتُمْ، أَأَلِدُ. إلا في «ءَأَعْجَمِيٌّ» (فصلت: ٤٤) فتُسهّل الثانية وجهًا واحدًا.":["When two voweled fixed hamzahs meet, Ḥafṣ pronounces both fully: أَئِنَّكُمْ، أَأُلْقِيَ، أَأَنتُمْ، أَأَلِدُ. Except in «ءَأَعْجَمِيٌّ» (Fuṣṣilat 44), where the second is softened, with only one way.","Når to vokaliserede faste hamzah mødes, udtaler Ḥafṣ begge fuldt: أَئِنَّكُمْ، أَأُلْقِيَ، أَأَنتُمْ، أَأَلِدُ. Undtagen i «ءَأَعْجَمِيٌّ» (Fuṣṣilat 44), hvor den anden blødgøres, med kun én måde."],"إذا كانت الهمزة الثانية ساكنة أُبدلت حرف مد مجانسًا لحركة الأولى، وهذا مد البدل: آدَمَ، إِيمَان، أُوتُوا":["If the second hamzah is still, it becomes a madd letter matching the first one’s vowel; this is madd al-badal: آدَمَ، إِيمَان، أُوتُوا","Er den anden hamzah stille, bliver den et madd-bogstav, der passer til den førstes vokal; det er madd al-badal: آدَمَ، إِيمَان، أُوتُوا"],"دخول همزة الوصل على همزة القطع":["Hamzat al-waṣl before a fixed hamzah","Hamzat al-waṣl foran en fast hamzah"],"إذا دخلت همزة الوصل على همزة القطع الساكنة، فعند البدء بالكلمة تُبدل همزة القطع حرفَ مد مجانسًا لحركة همزة الوصل. وجاء ذلك في سبع كلمات، وقد يتكرر بعضها في أكثر من موضع.":["When hamzat al-waṣl comes before a still fixed hamzah, then when starting the word, the fixed hamzah becomes a madd letter matching the vowel of hamzat al-waṣl. This occurs in seven words, some of them in more than one place.","Når hamzat al-waṣl står foran en stille fast hamzah, bliver den faste hamzah ved ordets begyndelse et madd-bogstav, der passer til vokalen i hamzat al-waṣl. Det forekommer i syv ord, nogle af dem flere steder."],"عند الوصل":["When joining","Ved sammenhæng"],"عند الابتداء بها":["When starting on it","Når man begynder på det"],"التوبة: ٤٩":["Al-Tawbah 49","Al-Tawbah 49"],"البقرة: ٢٨٣":["Al-Baqarah 283","Al-Baqarah 283"],"يونس: ١٥":["Yūnus 15","Yūnus 15"],"الأعراف: ٧٧":["Al-Aʿrāf 77","Al-Aʿrāf 77"],"فصلت: ١١":["Fuṣṣilat 11","Fuṣṣilat 11"],"طه: ٦٤":["Ṭā Hā 64","Ṭā Hā 64"],"يونس: ٧٩":["Yūnus 79","Yūnus 79"],"دخول همزة القطع على همزة الوصل":["A fixed hamzah before hamzat al-waṣl","En fast hamzah foran hamzat al-waṣl"],"همزة الاستفهام مع همزة الوصل في الأفعال":["The question hamzah before hamzat al-waṣl in verbs","Spørge-hamzah foran hamzat al-waṣl i verber"],"إذا دخلت همزة القطع (الاستفهام) على همزة الوصل في الأفعال سقطت همزة الوصل خطًّا ولفظًا. ووقع هذا في سبع كلمات.":["When a fixed (question) hamzah comes before hamzat al-waṣl in a verb, hamzat al-waṣl disappears in writing and speech. This occurs in seven words.","Når en fast (spørgende) hamzah står foran hamzat al-waṣl i et verbum, forsvinder hamzat al-waṣl i skrift og tale. Det forekommer i syv ord."],"أَفْتَرَىٰ، أَطَّلَعَ، أَصْطَفَى، أَسْتَكْبَرْتَ، أَتَّخَذْنَاهُمْ، أَتَّخَذْتُمْ، أَسْتَغْفَرْتَ.":["أَفْتَرَىٰ، أَطَّلَعَ، أَصْطَفَى، أَسْتَكْبَرْتَ، أَتَّخَذْنَاهُمْ، أَتَّخَذْتُمْ، أَسْتَغْفَرْتَ.","أَفْتَرَىٰ، أَطَّلَعَ، أَصْطَفَى، أَسْتَكْبَرْتَ، أَتَّخَذْنَاهُمْ، أَتَّخَذْتُمْ، أَسْتَغْفَرْتَ."],"مد الفرق":["Madd al-farq (madd of distinction)","Madd al-farq (madd til adskillelse)"],"همزة الاستفهام مع «ال» التعريف":["The question hamzah before “al-”","Spørge-hamzah foran “al-”"],"إذا دخلت همزة القطع على همزة الوصل في «ال» التعريف لم تسقط همزة الوصل، ولها وجهان: الإبدال حرفَ مد مشبعًا ست حركات كالمد اللازم الكلمي، ويسمى مد الفرق، أو التسهيل بين الهمزة والألف. ولا يجوز تحقيق الهمزتين معًا.":["When a fixed hamzah comes before hamzat al-waṣl in “al-”, hamzat al-waṣl does not disappear. There are two ways: turning it into a madd lengthened 6 counts like the lāzim kalimī, called madd al-farq; or softening it between hamzah and alif. Pronouncing both hamzahs fully is not allowed.","Når en fast hamzah står foran hamzat al-waṣl i “al-”, forsvinder hamzat al-waṣl ikke. Der er to måder: at gøre den til en madd forlænget 6 slag som lāzim kalimī, kaldet madd al-farq; eller at blødgøre den mellem hamzah og alif. At udtale begge hamzah fuldt er ikke tilladt."],"سُمّي مد الفرق لأنه يفرّق بين الاستفهام والخبر.":["It is called madd al-farq because it distinguishes a question from a statement.","Den kaldes madd al-farq, fordi den skelner et spørgsmål fra en udsagnssætning."],"مواضعها":["Places","Steder"],"الأنعام: ١٤٣ و١٤٤":["Al-Anʿām 143 and 144","Al-Anʿām 143 og 144"],"يونس: ٥١ و٩١":["Yūnus 51 and 91","Yūnus 51 og 91"],"يونس: ٥٩، النمل: ٥٩":["Yūnus 59, al-Naml 59","Yūnus 59, al-Naml 59"],"دخول همزة القطع على همزة الوصل في الأسماء يحذفها كما في الأفعال، ولكنه لم يرد في القرآن.":["A fixed hamzah before hamzat al-waṣl in a noun would remove it, as in verbs, but this does not occur in the Qurʾān.","En fast hamzah foran hamzat al-waṣl i et navneord ville fjerne den som i verber, men det forekommer ikke i Koranen."],"التقاء الساكنين":["Two sukūns meeting","To sukūn, der mødes"],"في كلمة واحدة":["Within one word","I ét ord"],"التقاء الساكنين في كلمة":["Two still letters in one word","To stille bogstaver i ét ord"],"إذا التقى الساكنان في كلمة واحدة يُغتفر، أي يصح الجمع بينهما وصلًا ووقفًا، بشرط أن يكون الأول حرف مد أو لين، أو يكون سكون الثاني عارضًا.":["Two still letters meeting in one word are tolerated, when joining and stopping, if the first is a madd or līn letter, or if the second is still only because of a stop.","To stille bogstaver, der mødes i ét ord, tåles ved sammenhæng og stop, hvis det første er et madd- eller līn-bogstav, eller hvis det andet kun er stille på grund af stop."],"وصلًا ووقفًا: الضَّالِّينَ، دَابَّةٍ، عَيْنْ، يَاسِينْ":["Joining and stopping: الضَّالِّينَ، دَابَّةٍ، عَيْنْ، يَاسِينْ","Sammenhæng og stop: الضَّالِّينَ، دَابَّةٍ، عَيْنْ، يَاسِينْ"],"وقفًا: وَالْعَصْرْ، الْحِسَابْ، الْعَالَمِينْ، السُّحْتْ":["Stopping: وَالْعَصْرْ، الْحِسَابْ، الْعَالَمِينْ، السُّحْتْ","Stop: وَالْعَصْرْ، الْحِسَابْ، الْعَالَمِينْ، السُّحْتْ"],"في كلمتين":["Across two words","På tværs af to ord"],"لا تجمع العرب بين ساكنين في كلمتين. فإن وُجد ذلك تخلّصوا منه بإحدى طريقتين.":["Arabic does not allow two still letters to meet across two words. When it happens, one of two solutions is used.","Arabisk tillader ikke to stille bogstaver at mødes på tværs af to ord. Når det sker, bruges en af to løsninger."],"حذف حرف المد":["Dropping the madd letter","Madd-bogstavet falder bort"],"إذا كان الساكن الأول حرف مد حُذف لفظًا: ذَاقَا الشَّجَرَةَ تُقرأ «ذَاقَ الشَّجَرَةَ»، فِي الْأَرْضِ «فِ الْأَرْضِ»، قَالُوا اللَّهُمَّ «قَالُ اللَّهُمَّ».":["If the first still letter is a madd letter, it is dropped in speech: ذَاقَا الشَّجَرَةَ is read «ذَاقَ الشَّجَرَةَ», فِي الْأَرْضِ «فِ الْأَرْضِ», قَالُوا اللَّهُمَّ «قَالُ اللَّهُمَّ».","Er det første stille bogstav et madd-bogstav, falder det bort i udtalen: ذَاقَا الشَّجَرَةَ læses «ذَاقَ الشَّجَرَةَ», فِي الْأَرْضِ «فِ الْأَرْضِ», قَالُوا اللَّهُمَّ «قَالُ اللَّهُمَّ»."],"التحريك بالكسر":["Adding a kasrah","Tilføjelse af kasrah"],"وهو الأصل":["The default","Hovedreglen"],"إذا كان الساكن الأول حرفًا صحيحًا حُرّك بالكسر: قُلِ اللَّهُمَّ، وَلَقَدِ اسْتُهْزِئَ، قُمِ اللَّيْلَ. ومنه كسر نون التنوين: نُوحٌ ابْنَهُ تُقرأ «نُوحُنِ ابْنَهُ».":["If the first still letter is a regular letter, it gets a kasrah: قُلِ اللَّهُمَّ، وَلَقَدِ اسْتُهْزِئَ، قُمِ اللَّيْلَ. The nūn of tanwīn too: نُوحٌ ابْنَهُ is read «نُوحُنِ ابْنَهُ».","Er det første stille bogstav et almindeligt bogstav, får det kasrah: قُلِ اللَّهُمَّ، وَلَقَدِ اسْتُهْزِئَ، قُمِ اللَّيْلَ. Det gælder også tanwīns nūn: نُوحٌ ابْنَهُ læses «نُوحُنِ ابْنَهُ»."],"التحريك بالفتح":["Adding a fatḥah","Tilføjelse af fatḥah"],"في حالتين":["In two cases","I to tilfælde"],"يُحرَّك الساكن الأول بالفتح في «مِنْ» الجارة: مِنَ الشَّاهِدِينَ، وفي ميم «الم» أول آل عمران وصلًا: الٓمَ اللَّهُ.":["The first still letter gets a fatḥah in the preposition «مِنْ»: مِنَ الشَّاهِدِينَ, and in the mīm of «الم» at the start of Āl ʿImrān when joining: الٓمَ اللَّهُ.","Det første stille bogstav får fatḥah i præpositionen «مِنْ»: مِنَ الشَّاهِدِينَ, og i mīm i «الم» i begyndelsen af Āl ʿImrān ved sammenhæng: الٓمَ اللَّهُ."],"التحريك بالضم":["Adding a ḍammah","Tilføjelse af ḍammah"],"يُحرَّك الساكن الأول بالضم في ميم الجمع: عَلَيْكُمُ الصِّيَامُ، وفي واو اللين للجماعة: وَعَصَوُا الرَّسُولَ.":["The first still letter gets a ḍammah in the plural mīm: عَلَيْكُمُ الصِّيَامُ, and in the plural līn wāw: وَعَصَوُا الرَّسُولَ.","Det første stille bogstav får ḍammah i flertals-mīm: عَلَيْكُمُ الصِّيَامُ, og i flertals-līn-wāw: وَعَصَوُا الرَّسُولَ."],"النبر":["Nabr (emphasis)","Nabr (betoning)"],"الضغط على مقطع أو حرف معيّن، بحيث يكون صوته أعلى بقليل مما يجاوره من الحروف.":["Pressing on a syllable or letter so it sounds slightly louder than the letters around it.","At lægge tryk på en stavelse eller et bogstav, så det lyder en smule kraftigere end bogstaverne omkring."],"مواضع النبر في القرآن":["Where nabr occurs in the Qurʾān","Hvor nabr forekommer i Koranen"],"عند الوقف على الهمزة المتطرفة: السَّمَاءِ، السُّوءَ.":["When stopping on a final hamzah: السَّمَاءِ، السُّوءَ.","Ved stop på en afsluttende hamzah: السَّمَاءِ، السُّوءَ."],"عند النطق بالواو والياء المشددتين: الْقُوَّةِ، قَوَّامِينَ، سَيَّارَةٌ، إِيَّاكَ.":["On a doubled wāw or yāʾ: الْقُوَّةِ، قَوَّامِينَ، سَيَّارَةٌ، إِيَّاكَ.","På en fordoblet wāw eller yāʾ: الْقُوَّةِ، قَوَّامِينَ، سَيَّارَةٌ، إِيَّاكَ."],"عند الانتقال من حرف المد إلى الحرف الأول من المشدد: الْحَاقَّةُ، دَابَّةٍ، أَتُحَاجُّونِّي.":["When moving from a madd letter onto a doubled letter: الْحَاقَّةُ، دَابَّةٍ، أَتُحَاجُّونِّي.","Ved overgangen fra et madd-bogstav til et fordoblet bogstav: الْحَاقَّةُ، دَابَّةٍ، أَتُحَاجُّونِّي."],"رابعًا":["Fourth","Fjerde"],"عند سقوط ألف التثنية أو واو الجماعة للتخلص من التقاء الساكنين، إذا التبس نطقه بالمفرد: ذَاقَا الشَّجَرَةَ، وَاسْتَبَقَا الْبَابَ.":["When the dual alif or plural wāw drops to avoid two sukūns, and the word could be mistaken for a singular: ذَاقَا الشَّجَرَةَ، وَاسْتَبَقَا الْبَابَ.","Når totals-alif eller flertals-wāw falder bort for at undgå to sukūn, og ordet kunne forveksles med ental: ذَاقَا الشَّجَرَةَ، وَاسْتَبَقَا الْبَابَ."],"خامسًا":["Fifth","Femte"],"عند الوقف على الحرف المشدد: مُسْتَقِرٌّ، الْحَيُّ.":["When stopping on a doubled letter: مُسْتَقِرٌّ، الْحَيُّ.","Ved stop på et fordoblet bogstav: مُسْتَقِرٌّ، الْحَيُّ."],"يُستثنى من الوقف على المشدد حروف القلقلة، فيوقف عليها بالقلقلة: الْحَقُّ، وَتَبَّ. ويُستثنى حرفا النون والميم، فيوقف عليهما بالغنة حركتين: جَانٌّ، الْيَمِّ.":["Exceptions when stopping on a doubled letter: the qalqalah letters are stopped on with qalqalah: الْحَقُّ، وَتَبَّ. And nūn and mīm are stopped on with a ghunnah of 2 counts: جَانٌّ، الْيَمِّ.","Undtagelser ved stop på et fordoblet bogstav: qalqalah-bogstaverne stoppes med qalqalah: الْحَقُّ، وَتَبَّ. Og nūn og mīm stoppes med en ghunnah på 2 slag: جَانٌّ، الْيَمِّ."],"الوقف والقطع والسكت":["Waqf, qaṭʿ and sakt","Waqf, qaṭʿ og sakt"],"الوقف والابتداء من أهم أحكام الترتيل. سُئل علي بن أبي طالب رضي الله عنه عن قوله تعالى «وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا» فقال: هو تجويد الحروف ومعرفة الوقوف. ولذلك قيل: الوقف والابتداء شطر علم التجويد.":["Stopping and starting are among the most important parts of tartīl. ʿAlī ibn Abī Ṭālib was asked about the verse «وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا» and said: it is perfecting the letters and knowing the stops. So it has been said that stopping and starting are half of tajweed.","At stoppe og begynde hører til det vigtigste i tartīl. ʿAlī ibn Abī Ṭālib blev spurgt om verset «وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا» og sagde: det er at fuldende bogstaverne og kende stoppene. Derfor siges det, at stop og start er halvdelen af tajwīd."],"الوقف":["Waqf (stopping)","Waqf (stop)"],"قطع الصوت على نهاية الكلمة زمنًا يتنفس في أثنائه، بنية استئناف القراءة.":["Cutting the sound at the end of a word long enough to take a breath, intending to continue reciting.","At afbryde lyden ved slutningen af et ord længe nok til at trække vejret, med hensigt om at fortsætte recitationen."],"القطع":["Qaṭʿ (ending)","Qaṭʿ (afslutning)"],"قطع الصوت على الكلمة القرآنية بنية الإعراض عن القراءة. ومحله نهاية الآيات والسور.":["Cutting the sound on a word of the Qurʾān intending to end the recitation. It happens at the end of verses and sūrahs.","At afbryde lyden på et ord i Koranen med hensigt om at afslutte recitationen. Det sker ved slutningen af vers og sūrahs."],"السكت":["Sakt (brief pause)","Sakt (kort pause)"],"قطع الصوت على حرف قرآني بزمن لا يتنفس فيه عادة، بنية استئناف القراءة.":["Cutting the sound on a letter for a moment without taking a breath, intending to continue reciting.","At afbryde lyden et øjeblik på et bogstav uden at trække vejret, med hensigt om at fortsætte recitationen."],"أنواع الوقف":["Kinds of stopping","Slags stop"],"الاضطراري":["Forced (iḍṭirārī)","Tvunget (iḍṭirārī)"],"الوقف على كلمة للضرورة، بسبب ضيق النفَس أو عطاس أو نسيان.":["Stopping on a word out of necessity: running out of breath, sneezing or forgetting.","At stoppe på et ord af nødvendighed: mangel på luft, nys eller glemsel."],"الانتظاري":["Waiting (intiẓārī)","Ventende (intiẓārī)"],"لطالب القراءات: يقف بين الرواية والرواية.":["For students of the readings: stopping between one narration and the next.","For studerende af læsemåderne: at stoppe mellem én overlevering og den næste."],"الاختباري":["Testing (ikhtibārī)","Prøvende (ikhtibārī)"],"الوقف لاختبار الطالب في كيفية الوقوف على الحروف أو الحركات في نهاية الكلمة.":["Stopping to test how the student stops on the letters or vowels at the end of a word.","Stop for at prøve, hvordan eleven stopper på bogstaverne eller vokalerne sidst i et ord."],"الاختياري":["By choice (ikhtiyārī)","Frivilligt (ikhtiyārī)"],"أن يقف القارئ باختياره دون أن تلجئه الضرورة إلى ذلك.":["The reciter stops by choice, not out of necessity.","Recitatoren stopper frivilligt, ikke af nødvendighed."],"قاعدتان في الوقف":["Two principles of stopping","To principper for stop"],"الوقف على رؤوس الآيات سنّة مطلقًا.":["Stopping at the end of verses is always sunnah.","At stoppe ved versenes slutning er altid sunnah."],"ليس في القرآن وقف واجب شرعًا ولا حرام، إلا ما يُفسد المعنى.":["No stop in the Qurʾān is religiously obligatory or forbidden, except where it would corrupt the meaning.","Intet stop i Koranen er religiøst påbudt eller forbudt, undtagen hvor det ville ødelægge betydningen."],"الوقف الاختياري":["Stopping by choice","Frivillige stop"],"الوقف التام":["Complete stop (tāmm)","Fuldstændigt stop (tāmm)"],"الوقف على كلمة ليس بينها وبين ما بعدها تعلّق لفظي (إعرابي) ولا معنوي. ويكون في رؤوس الآيات ونهاية القصص. ويُلحق به الوقف اللازم، ويسمى وقف البيان.":["Stopping on a word that has no grammatical or meaning link to what follows. It is found at the ends of verses and stories. The necessary stop, also called the stop of clarification, belongs to it.","At stoppe på et ord, der hverken har grammatisk eller betydningsmæssig forbindelse til det følgende. Det findes ved slutningen af vers og fortællinger. Det nødvendige stop, også kaldet tydeliggørelsens stop, hører hertil."],"الوقف الكافي":["Sufficient stop (kāfī)","Tilstrækkeligt stop (kāfī)"],"الوقف على كلمة ليس بينها وبين ما بعدها تعلّق لفظي (إعرابي)، ولكن يوجد تعلّق معنوي.":["Stopping on a word that has no grammatical link to what follows, but is still linked in meaning.","At stoppe på et ord, der ikke har grammatisk forbindelse til det følgende, men stadig hænger sammen i betydning."],"الوقف الحسن":["Good stop (ḥasan)","Godt stop (ḥasan)"],"الوقف على كلمة بينها وبين ما بعدها تعلّق لفظي ومعنوي، إلا أن الوقف عليها لا يبدّل المعنى ولا يُخلّ به. ولا يُبدأ بما بعدها.":["Stopping on a word linked to what follows in grammar and meaning, where stopping does not change or harm the meaning. You do not start from the next word.","At stoppe på et ord, der hænger sammen med det følgende grammatisk og i betydning, hvor stoppet ikke ændrer eller skader betydningen. Man begynder ikke fra det næste ord."],"الوقف القبيح":["Bad stop (qabīḥ)","Dårligt stop (qabīḥ)"],"الوقف على كلمة بينها وبين ما بعدها تعلّق لفظي ومعنوي، والوقف عليها يبدّل المعنى أو يعطي معنى ناقصًا.":["Stopping on a word linked to what follows in grammar and meaning, where stopping changes the meaning or leaves it incomplete.","At stoppe på et ord, der hænger sammen med det følgende grammatisk og i betydning, hvor stoppet ændrer betydningen eller efterlader den ufuldstændig."],"الوقف الاختباري والاضطراري":["Testing and forced stops","Prøvende og tvungne stop"],"هو الوقف على كلمات قرآنية اضطرارًا، أو بطلب من الشيخ أو المعلم للاختبار. يوقف على الكلمة كما رُسمت.":["Stopping on Qurʾānic words out of necessity, or because the teacher asks, to test. You stop on the word as it is written.","At stoppe på ord i Koranen af nødvendighed eller fordi læreren beder om det, som prøve. Man stopper på ordet, sådan som det er skrevet."],"السبب":["Reason","Årsag"],"في الوصل":["When joining","Ved sammenhæng"],"عند الوقف":["When stopping","Ved stop"],"حُذفت الألف رسمًا":["Alif left out in writing","Alif udeladt i skrift"],"حُذفت الواو رسمًا":["Wāw left out in writing","Wāw udeladt i skrift"],"حُذفت الياء رسمًا":["Yāʾ left out in writing","Yāʾ udeladt i skrift"],"همزة كُتبت على الياء أو الواو":["Hamzah written on a yāʾ or wāw","Hamzah skrevet på yāʾ eller wāw"],"حُذفت إحدى الياءين رسمًا":["One of two yāʾs left out in writing","Én af to yāʾ udeladt i skrift"],"عند الوقف على الياء أو الواو المتحركة وما قبلها ساكن، مثل «مِنَ الْهَدْيِ» و«مِنَ الْبَدْوِ»، يضعف لفظ الحرف ولا يُمد حركتين، لأنه ليس حرف مد.":["When stopping on a voweled yāʾ or wāw that follows a still letter, as in «مِنَ الْهَدْيِ» and «مِنَ الْبَدْوِ», the letter is said lightly and not lengthened 2 counts, because it is not a madd letter.","Når man stopper på en vokaliseret yāʾ eller wāw efter et stille bogstav, som i «مِنَ الْهَدْيِ» og «مِنَ الْبَدْوِ», siges bogstavet let og forlænges ikke 2 slag, da det ikke er et madd-bogstav."],"علامات الوقف في المصحف الشريف":["Stop signs in the muṣḥaf","Stoptegn i muṣḥaf"],"علامات الوقف في المصحف":["Stop signs in the muṣḥaf","Stoptegn i muṣḥaf"],"رموز صغيرة فوق الكلمات ترشد القارئ إلى مواضع الوقف والوصل. وتختلف مواضعها في بعض المصاحف حسب اجتهاد العلماء.":["Small symbols above the words that guide the reciter where to stop and where to join. Their places differ slightly between muṣḥafs, according to the scholars’ judgement.","Små symboler over ordene, der viser recitatoren, hvor man stopper, og hvor man forbinder. Deres placering varierer lidt mellem muṣḥaf efter de lærdes vurdering."],"«قلى» الوقف أولى، و«صلى» الوصل أولى.":["«قلى»: stopping is better. «صلى»: joining is better.","«قلى»: stop er bedst. «صلى»: sammenhæng er bedst."],"العلامة":["Sign","Tegn"],"معناها":["Meaning","Betydning"],"الوقف اللازم":["Necessary stop","Nødvendigt stop"],"يجوز الوقف والوصل، والوقف أولى":["Stopping and joining both allowed; stopping is better","Både stop og sammenhæng tilladt; stop er bedst"],"يجوز الوقف والوصل، والوصل أولى":["Stopping and joining both allowed; joining is better","Både stop og sammenhæng tilladt; sammenhæng er bedst"],"يجوز الوقف والوصل":["Stopping and joining both allowed","Både stop og sammenhæng tilladt"],"الوقف ممنوع":["Do not stop","Stop ikke"],"التعانق: يوقف على أحد الموضعين فقط دون الآخر":["Paired stops: stop at one of the two places only, not both","Parrede stop: stop kun ét af de to steder, ikke begge"],"الابتداء":["Starting (ibtidāʾ)","At begynde (ibtidāʾ)"],"الحقيقي":["Real start","Egentlig start"],"الابتداء بالتلاوة، في الصلاة أو في غيرها. ويكون عادة في بداية السور، أو بآية مستقلة بالمعنى عما سبقها، كبداية قصص أو آيات أحكام. ولا يُبدأ من وسط الموضوع فلا يفهم السامع أول الكلام.":["Starting the recitation, in prayer or outside it. It is usually at the start of a sūrah, or at a verse that stands on its own in meaning, such as the start of a story or a set of rulings. You do not start in the middle of a topic, where the listener cannot follow.","At begynde recitationen, i bøn eller udenfor. Det er som regel i begyndelsen af en sūrah eller ved et vers, der står for sig selv i betydning, som starten på en fortælling eller nogle regler. Man begynder ikke midt i et emne, hvor lytteren ikke kan følge med."],"الإضافي":["Continuing start","Fortsat start"],"ما تقدّمه تلاوة ووقف في المجلس نفسه. وهو ثلاثة أنواع جائزة ونوع غير جائز.":["A start that follows recitation and a stop in the same sitting. There are three permitted kinds and one that is not.","En start, der følger efter recitation og et stop i samme session. Der er tre tilladte slags og én, der ikke er tilladt."],"الابتداء التام":["Complete start (tāmm)","Fuldstændig start (tāmm)"],"الابتداء من كلمة ليس بينها وبين ما قبلها تعلّق لفظي (إعرابي) ولا معنوي. ويكون عادة من رؤوس الآيات وبداية القصص.":["Starting from a word that has no grammatical or meaning link to what came before. Usually at the start of verses and stories.","At begynde fra et ord, der hverken har grammatisk eller betydningsmæssig forbindelse til det foregående. Som regel ved starten af vers og fortællinger."],"الابتداء الكافي":["Sufficient start (kāfī)","Tilstrækkelig start (kāfī)"],"الابتداء من كلمة ليس بينها وبين ما قبلها تعلّق لفظي (إعرابي)، ولكن يوجد تعلّق معنوي.":["Starting from a word with no grammatical link to what came before, though it is linked in meaning.","At begynde fra et ord uden grammatisk forbindelse til det foregående, selvom det hænger sammen i betydning."],"الابتداء الحسن":["Good start (ḥasan)","God start (ḥasan)"],"الابتداء من كلمة بينها وبين ما قبلها تعلّق لفظي ومعنوي، إلا أن الابتداء منها لا يكون حقيقيًا بل إضافيًا.":["Starting from a word linked to what came before in grammar and meaning; this works only as a continuing start, not a real one.","At begynde fra et ord, der hænger sammen med det foregående grammatisk og i betydning; det fungerer kun som fortsat start, ikke som egentlig start."],"الابتداء القبيح":["Bad start (qabīḥ)","Dårlig start (qabīḥ)"],"الابتداء من كلمة بينها وبين ما قبلها تعلّق لفظي ومعنوي، والابتداء منها يبدّل المعنى أو يعطي معنى ناقصًا.":["Starting from a word linked to what came before in grammar and meaning, where starting there changes the meaning or leaves it incomplete.","At begynde fra et ord, der hænger sammen med det foregående grammatisk og i betydning, hvor starten ændrer betydningen eller efterlader den ufuldstændig."],"لا يُبدأ بـ«إِنَّ اللَّهَ فَقِيرٌ» في: لَقَدْ سَمِعَ اللَّهُ قَوْلَ الَّذِينَ قَالُوا إِنَّ اللَّهَ فَقِيرٌ وَنَحْنُ أَغْنِيَاءُ (آل عمران: ١٨١)":["Do not start at «إِنَّ اللَّهَ فَقِيرٌ» in: لَقَدْ سَمِعَ اللَّهُ قَوْلَ الَّذِينَ قَالُوا إِنَّ اللَّهَ فَقِيرٌ وَنَحْنُ أَغْنِيَاءُ (Āl ʿImrān 181)","Begynd ikke ved «إِنَّ اللَّهَ فَقِيرٌ» i: لَقَدْ سَمِعَ اللَّهُ قَوْلَ الَّذِينَ قَالُوا إِنَّ اللَّهَ فَقِيرٌ وَنَحْنُ أَغْنِيَاءُ (Āl ʿImrān 181)"],"لا يُبدأ بـ«يَدُ اللَّهِ مَغْلُولَةٌ» في: وَقَالَتِ الْيَهُودُ يَدُ اللَّهِ مَغْلُولَةٌ (المائدة: ٦٤)":["Do not start at «يَدُ اللَّهِ مَغْلُولَةٌ» in: وَقَالَتِ الْيَهُودُ يَدُ اللَّهِ مَغْلُولَةٌ (al-Māʾidah 64)","Begynd ikke ved «يَدُ اللَّهِ مَغْلُولَةٌ» i: وَقَالَتِ الْيَهُودُ يَدُ اللَّهِ مَغْلُولَةٌ (al-Māʾidah 64)"],"الابتداء الاختباري":["Starting for a test","Start som prøve"],"هو البدء بكلمات قرآنية بطلب من الشيخ أو المعلم للاختبار. وقد لا يصح الابتداء منها عادة أثناء التلاوة.":["Starting on Qurʾānic words because the teacher asks, to test. Starting there might not normally be right during recitation.","At begynde på ord i Koranen, fordi læreren beder om det, som prøve. Det er måske ikke normalt rigtigt at begynde der under recitation."],"كيف يُبدأ بها":["How to start on it","Sådan begynder man"],"الحج: ١٥":["@","@"],"بكسر اللام: لِيَقْطَعْ":["With kasrah on the lām: لِيَقْطَعْ","Med kasrah på lām: لِيَقْطَعْ"],"ص: ١٣، الشعراء: ١٧٦":["@","@"],"بهمزة وصل مفتوحة: اَلْأَيْكَةِ":["With hamzat al-waṣl and fatḥah: اَلْأَيْكَةِ","Med hamzat al-waṣl og fatḥah: اَلْأَيْكَةِ"],"الحجرات: ١١":["@","@"],"وجهان: أَلِسْمُ، أو لِسْمُ":["Two ways: أَلِسْمُ or لِسْمُ","To måder: أَلِسْمُ eller لِسْمُ"],"آل عمران: ٢٦":["@","@"],"بالفتح مع تفخيم لام الجلالة: اَللَّهُمَّ":["With fatḥah, and a heavy lām in Allah: اَللَّهُمَّ","Med fatḥah og tung lām i Allah: اَللَّهُمَّ"],"بالضم وإبدال الهمزة واوًا: اُوتُمِنَ":["With ḍammah, the hamzah becoming wāw: اُوتُمِنَ","Med ḍammah, hamzah bliver til wāw: اُوتُمِنَ"],"النساء: ١٧٦":["@","@"],"بالكسر: اِمْرُؤٌ":["With kasrah: اِمْرُؤٌ","Med kasrah: اِمْرُؤٌ"],"آل عمران: ٤٥":["@","@"],"بالكسر: اِبْنُ":["With kasrah: اِبْنُ","Med kasrah: اِبْنُ"],"النساء: ١٢٨":["@","@"],"بالكسر: اِمْرَأَةٌ":["With kasrah: اِمْرَأَةٌ","Med kasrah: اِمْرَأَةٌ"],"ص: ٦":["@","@"],"بالكسر لأن الضم عارض: اِمْشُوا":["With kasrah, because the ḍammah is temporary: اِمْشُوا","Med kasrah, fordi ḍammah er midlertidig: اِمْشُوا"],"يونس: ٧١":["@","@"],"بالكسر لأن الضم عارض: اِقْضُوا":["With kasrah, because the ḍammah is temporary: اِقْضُوا","Med kasrah, fordi ḍammah er midlertidig: اِقْضُوا"],"الكهف: ٢١":["@","@"],"بالكسر لأن الضم عارض: اِبْنُوا":["With kasrah, because the ḍammah is temporary: اِبْنُوا","Med kasrah, fordi ḍammah er midlertidig: اِبْنُوا"],"الأحقاف: ٤":["@","@"],"بالكسر لأن الضم عارض، وإبدال الهمزة الساكنة ياءً: اِيتُونِي":["With kasrah, because the ḍammah is temporary, and the still hamzah becomes yāʾ: اِيتُونِي","Med kasrah, fordi ḍammah er midlertidig, og den stille hamzah bliver til yāʾ: اِيتُونِي"],"السكت: قطع الصوت على حرف قرآني بزمن لا يتنفس فيه عادة، بنية استئناف القراءة. وحكمه كالوقف، إلا أنه لا تنفّس فيه. وعلامته سين صغيرة «س» فوق الحرف الأخير.":["Sakt: cutting the sound on a letter for a moment without taking a breath, intending to continue. It is like a stop, but without breathing. Its sign is a small sīn «س» above the last letter.","Sakt: at afbryde lyden et øjeblik på et bogstav uden at trække vejret, med hensigt om at fortsætte. Det er som et stop, men uden indånding. Dets tegn er en lille sīn «س» over det sidste bogstav."],"السكتات الواجبة في رواية حفص":["Required sakt in Ḥafṣ’s narration","Påkrævet sakt i Ḥafṣ’ overlevering"],"أربعة مواضع":["Four places","Fire steder"],"يسمى السكت واجبًا لأن له عند الوصل وجهًا واحدًا فقط، وهو السكت. وورد في أربعة مواضع.":["Called required because, when joining, there is only one way: the sakt. It occurs in four places.","Kaldes påkrævet, fordi der ved sammenhæng kun er én måde: sakt. Det forekommer fire steder."],"الكهف، يس، القيامة، المطففين.":["Al-Kahf, Yā Sīn, al-Qiyāmah, al-Muṭaffifīn.","Al-Kahf, Yā Sīn, al-Qiyāmah, al-Muṭaffifīn."],"السكتات الجائزة في رواية حفص":["Optional sakt in Ḥafṣ’s narration","Valgfri sakt i Ḥafṣ’ overlevering"],"موضعان":["Two places","To steder"],"يسمى السكت جائزًا لأن له عند الوصل أكثر من وجه. وجاء في موضعين.":["Called optional because there is more than one way when joining. It occurs in two places.","Kaldes valgfri, fordi der er mere end én måde ved sammenhæng. Det forekommer to steder."],"«مَالِيَهْ ۜ هَلَكَ» (الحاقة: ٢٨–٢٩): الوقف لكونها رأس آية، أو السكت، أو الوصل بإدغام المتماثلين":["«مَالِيَهْ ۜ هَلَكَ» (al-Ḥāqqah 28–29): stop, as it ends a verse; or sakt; or join with idghām of the identical letters","«مَالِيَهْ ۜ هَلَكَ» (al-Ḥāqqah 28–29): stop, da det afslutter et vers; eller sakt; eller forbind med idghām af de ens bogstaver"],"بين الأنفال والتوبة: الوقف لكونها رأس آية، أو السكت، أو الوصل مع الإقلاب":["Between al-Anfāl and al-Tawbah: stop, as it ends a verse; or sakt; or join with iqlāb","Mellem al-Anfāl og al-Tawbah: stop, da det afslutter et vers; eller sakt; eller forbind med iqlāb"],"الروم والإشمام وأوجه الوقف":["Rawm, ishmām and ways of stopping","Rawm, ishmām og måder at stoppe på"],"الأصل في الوقف السكون، وهو أخف من الحركة. ويجوز الوقف كذلك بالروم والإشمام، ويُقصد بهما بيان حركة الحرف الموقوف عليه.":["The basic way to stop is with a sukūn, which is lighter than a vowel. You may also stop with rawm or ishmām, which show the vowel of the letter you stop on.","Den grundlæggende måde at stoppe på er med sukūn, som er lettere end en vokal. Man kan også stoppe med rawm eller ishmām, som viser vokalen på det bogstav, man stopper på."],"الروم":["Rawm (a hint of the vowel)","Rawm (et strejf af vokalen)"],"أن تأتي ببعض الحركة عند الوقف، ويُقدَّر بثلث الحركة، فيسمعه القريب دون البعيد. ويكون في الضم والكسر، والتنوين بالضم والكسر.":["Saying part of the vowel when stopping, about a third of it, so only someone close can hear it. Used with ḍammah, kasrah and their tanwīn.","At sige en del af vokalen ved stop, omkring en tredjedel, så kun en, der er tæt på, kan høre den. Bruges ved ḍammah, kasrah og deres tanwīn."],"حكم المد في الروم كحكمه في الوصل.":["A madd with rawm follows the rule for joining.","En madd med rawm følger reglen for sammenhæng."],"الإشمام":["Ishmām (rounding the lips)","Ishmām (at runde læberne)"],"الإشارة بالشفتين على هيئة النطق بالضم دون صوت، بُعيد إسكان الحرف، لبيان حركة الحرف الموقوف عليه. ويكون في الضم والتنوين بالضم فقط.":["Rounding the lips as if saying a ḍammah, without sound, right after making the letter still, to show its vowel. Used only with ḍammah and its tanwīn.","At runde læberne som ved en ḍammah, uden lyd, lige efter at bogstavet er gjort stille, for at vise dets vokal. Bruges kun ved ḍammah og dens tanwīn."],"حكم المد في الإشمام كحكمه في الوقف. والروم يُسمع، والإشمام يُرى ولا يُسمع.":["A madd with ishmām follows the rule for stopping. Rawm is heard; ishmām is seen but not heard.","En madd med ishmām følger reglen for stop. Rawm høres; ishmām ses, men høres ikke."],"موانع الروم والإشمام":["Where rawm and ishmām are not used","Hvor rawm og ishmām ikke bruges"],"لا يدخلان في المتحرك بالفتح ولا في التنوين بالفتح: الْعَالَمِينَ، عَلِيمًا.":["Not on a fatḥah or tanwīn with fatḥah: الْعَالَمِينَ، عَلِيمًا.","Ikke på fatḥah eller tanwīn med fatḥah: الْعَالَمِينَ، عَلِيمًا."],"لا يدخلان في السكون الأصلي: وَلَمْ يُولَدْ، وَانْحَرْ.":["Not on a permanent sukūn: وَلَمْ يُولَدْ، وَانْحَرْ.","Ikke på en permanent sukūn: وَلَمْ يُولَدْ، وَانْحَرْ."],"لا يدخلان في هاء التأنيث (التاء المربوطة): جَنَّةٌ، نِعْمَةٍ.":["Not on the feminine hāʾ (tāʾ marbūṭah): جَنَّةٌ، نِعْمَةٍ.","Ikke på den feminine hāʾ (tāʾ marbūṭah): جَنَّةٌ، نِعْمَةٍ."],"لا يدخلان في الحركة العارضة لالتقاء الساكنين: قُمِ اللَّيْلَ، عَلَيْكُمُ الصِّيَامُ.":["Not on a vowel added only to avoid two sukūns: قُمِ اللَّيْلَ، عَلَيْكُمُ الصِّيَامُ.","Ikke på en vokal, der kun er tilføjet for at undgå to sukūn: قُمِ اللَّيْلَ، عَلَيْكُمُ الصِّيَامُ."],"أوجه الوقف على الكلمات":["Ways to stop on words","Måder at stoppe på ord"],"آخر الكلمة":["End of the word","Ordets slutning"],"أوجه الوقف":["Ways to stop","Måder at stoppe på"],"سكون أصلي":["Permanent sukūn","Permanent sukūn"],"بالسكون فقط":["With sukūn only","Kun med sukūn"],"عارض للسكون، مفتوح":["ʿĀriḍ, with fatḥah","ʿĀriḍ, med fatḥah"],"بالسكون: ٢، ٤، ٦":["With sukūn: 2, 4, 6","Med sukūn: 2, 4, 6"],"عارض للسكون، مضموم":["ʿĀriḍ, with ḍammah","ʿĀriḍ, med ḍammah"],"بالسكون: ٢، ٤، ٦. وبالإشمام: ٢، ٤، ٦. وبالروم مع القصر":["With sukūn: 2, 4, 6. With ishmām: 2, 4, 6. With rawm: short","Med sukūn: 2, 4, 6. Med ishmām: 2, 4, 6. Med rawm: kort"],"عارض للسكون، مكسور":["ʿĀriḍ, with kasrah","ʿĀriḍ, med kasrah"],"بالسكون: ٢، ٤، ٦. وبالروم مع القصر":["With sukūn: 2, 4, 6. With rawm: short","Med sukūn: 2, 4, 6. Med rawm: kort"],"لين، مفتوح":["Līn, with fatḥah","Līn, med fatḥah"],"لين، مكسور":["Līn, with kasrah","Līn, med kasrah"],"بالسكون: ٢، ٤، ٦. وبالروم":["With sukūn: 2, 4, 6. Or with rawm","Med sukūn: 2, 4, 6. Eller med rawm"],"لين، مضموم":["Līn, with ḍammah","Līn, med ḍammah"],"بالسكون: ٢، ٤، ٦. وبالإشمام: ٢، ٤، ٦. وبالروم":["With sukūn: 2, 4, 6. With ishmām: 2, 4, 6. Or with rawm","Med sukūn: 2, 4, 6. Med ishmām: 2, 4, 6. Eller med rawm"],"تنوين بالفتح":["Tanwīn with fatḥah","Tanwīn med fatḥah"],"بمد العوض":["With madd al-ʿiwaḍ","Med madd al-ʿiwaḍ"],"تنوين بالضم":["Tanwīn with ḍammah","Tanwīn med ḍammah"],"يُعامل معاملة المضموم":["Treated like a ḍammah","Behandles som ḍammah"],"تنوين بالكسر":["Tanwīn with kasrah","Tanwīn med kasrah"],"يُعامل معاملة المكسور":["Treated like a kasrah","Behandles som kasrah"],"متصل، همزته مفتوحة":["Muttaṣil, hamzah with fatḥah","Muttaṣil, hamzah med fatḥah"],"بالسكون: ٤، ٥، ٦":["With sukūn: 4, 5, 6","Med sukūn: 4, 5, 6"],"متصل، همزته مكسورة":["Muttaṣil, hamzah with kasrah","Muttaṣil, hamzah med kasrah"],"بالسكون: ٤، ٥، ٦. وبالروم: ٤، ٥":["With sukūn: 4, 5, 6. With rawm: 4, 5","Med sukūn: 4, 5, 6. Med rawm: 4, 5"],"متصل، همزته مضمومة":["Muttaṣil, hamzah with ḍammah","Muttaṣil, hamzah med ḍammah"],"بالسكون: ٤، ٥، ٦. وبالإشمام: ٤، ٥، ٦. وبالروم: ٤، ٥":["With sukūn: 4, 5, 6. With ishmām: 4, 5, 6. With rawm: 4, 5","Med sukūn: 4, 5, 6. Med ishmām: 4, 5, 6. Med rawm: 4, 5"],"لازم، المشدد مفتوح":["Lāzim, doubled letter with fatḥah","Lāzim, fordoblet bogstav med fatḥah"],"بالسكون: ٦":["With sukūn: 6","Med sukūn: 6"],"لازم، المشدد مكسور":["Lāzim, doubled letter with kasrah","Lāzim, fordoblet bogstav med kasrah"],"بالسكون: ٦. وبالروم: ٦":["With sukūn: 6. With rawm: 6","Med sukūn: 6. Med rawm: 6"],"لازم، المشدد مضموم":["Lāzim, doubled letter with ḍammah","Lāzim, fordoblet bogstav med ḍammah"],"بالسكون: ٦. وبالإشمام: ٦. وبالروم: ٦":["With sukūn: 6. With ishmām: 6. With rawm: 6","Med sukūn: 6. Med ishmām: 6. Med rawm: 6"],"الروم والإشمام في هاء الكناية":["Rawm and ishmām on the pronoun hāʾ","Rawm og ishmām på pronomenet hāʾ"],"للعلماء فيها ثلاثة مذاهب: المنع المطلق، والجواز المطلق، والتفصيل. والتفصيل مذهب أكثر العلماء ومنهم ابن الجزري رحمه الله.":["Scholars hold three views: never, always, or depending on the case. The last is the view of most scholars, including Ibn al-Jazarī (may Allah have mercy on him).","De lærde har tre opfattelser: aldrig, altid eller afhængigt af tilfældet. Den sidste er de fleste lærdes opfattelse, deriblandt Ibn al-Jazarī (må Allah være ham nådig)."],"يدخلان":["Allowed","Tilladt"],"إذا كان قبل الهاء ألف أو ساكن صحيح أو حرف مفتوح: عَلَّمْنَاهُ، مِنْهُ، عَلِمْتَهُ.":["When the hāʾ follows an alif, a still regular letter, or a fatḥah: عَلَّمْنَاهُ، مِنْهُ، عَلِمْتَهُ.","Når hāʾ følger efter alif, et stille almindeligt bogstav eller fatḥah: عَلَّمْنَاهُ، مِنْهُ، عَلِمْتَهُ."],"لا يدخلان":["Not allowed","Ikke tilladt"],"إذا كان قبل الهاء ياء أو واو أو حرف مكسور أو حرف مضموم: قُلْتُهُ، بِهِ، فَأَلْقِيهِ، رَأَوْهُ.":["When the hāʾ follows a yāʾ, a wāw, a kasrah or a ḍammah: قُلْتُهُ، بِهِ، فَأَلْقِيهِ، رَأَوْهُ.","Når hāʾ følger efter yāʾ, wāw, kasrah eller ḍammah: قُلْتُهُ، بِهِ، فَأَلْقِيهِ، رَأَوْهُ."],"المقطوع والموصول":["Separated and joined words","Adskilte og sammenskrevne ord"],"على القارئ معرفة ما رُسم من الكلمات القرآنية مقطوعًا أو موصولًا، حتى يقف على الكلمة حسب رسمها. فما كُتب مقطوعًا جاز الوقف على الكلمة الأولى منه اضطرارًا أو اختبارًا. وما كُتب موصولًا لا يجوز الوقف على جزئه الأول لأي عارض، إلا ما جاء بالرواية.":["The reciter should know which Qurʾānic words are written separately and which are joined, in order to stop according to the writing. Where they are written separately, you may stop on the first word out of necessity or for a test. Where they are joined, you may not stop on the first part for any reason, except as narrated.","Recitatoren bør vide, hvilke ord i Koranen der skrives adskilt, og hvilke der skrives sammen, for at stoppe efter skriften. Hvor de skrives adskilt, må man stoppe på det første ord af nødvendighed eller som prøve. Hvor de skrives sammen, må man ikke stoppe på første del af nogen grund, undtagen som overleveret."],"المقطوع: كلمتان رُسمتا منفصلتين، فيجوز الوقف على الأولى اضطرارًا أو اختبارًا. والموصول: كلمتان رُسمتا كلمة واحدة، فلا يوقف إلا على آخرها.":["Separated (maqṭūʿ): two words written apart, so you may stop on the first out of necessity or for a test. Joined (mawṣūl): two words written as one, so you only stop at the end.","Adskilt (maqṭūʿ): to ord skrevet hver for sig, så man må stoppe på det første af nødvendighed eller som prøve. Sammenskrevet (mawṣūl): to ord skrevet som ét, så man kun stopper til sidst."],"قِف على الكلمة كما رُسمت في المصحف.":["Stop on the word as it is written in the muṣḥaf.","Stop på ordet, som det er skrevet i muṣḥaf."],"المقطوع":["Separated","Adskilt"],"الموصول":["Joined","Sammenskrevet"],"كلمات لها وضع خاص":["Words with a special case","Ord med et særligt tilfælde"],"حكم الوقف":["How to stop","Sådan stopper man"],"يوقف عليها كلمة واحدة وجهًا واحدًا: إِلْ يَاسِينْ":["Stopped on as one word, one way only: إِلْ يَاسِينْ","Stoppes som ét ord, kun én måde: إِلْ يَاسِينْ"],"يجوز الوقف على «أَيًّا» وعلى «مَا»":["You may stop on «أَيًّا» or on «مَا»","Man må stoppe på «أَيًّا» eller på «مَا»"],"يجوز الوقف على «مَا» وعلى اللام «مَالِ»":["You may stop on «مَا» or on the lām «مَالِ»","Man må stoppe på «مَا» eller på lām «مَالِ»"],"«يا» النداء و«ها» التنبيه كُتبتا موصولتين بما بعدهما، فلا يجوز الوقف عليهما، بل تُقرآن كلمة واحدة مع ما بعدهما: يَٰمَرْيَمُ، يَٰٓأَيُّهَا، هَٰٓؤُلَآءِ، هَٰٓأَنتُمْ، هَٰذَا.":["The vocative «يا» and the attention particle «ها» are written joined to the next word, so you may not stop on them; they are read as one word with what follows: يَٰمَرْيَمُ، يَٰٓأَيُّهَا، هَٰٓؤُلَآءِ، هَٰٓأَنتُمْ، هَٰذَا.","Tiltaleordet «يا» og opmærksomhedspartiklen «ها» skrives sammen med det næste ord, så man må ikke stoppe på dem; de læses som ét ord med det følgende: يَٰمَرْيَمُ، يَٰٓأَيُّهَا، هَٰٓؤُلَآءِ، هَٰٓأَنتُمْ، هَٰذَا."],"تاء التأنيث وهاء السكت":["The feminine tāʾ and hāʾ al-sakt","Den feminine tāʾ og hāʾ al-sakt"],"تاء التأنيث":["The feminine tāʾ","Den feminine tāʾ"],"كُتبت تاء التأنيث في القرآن على صورتين: مربوطة ومفتوحة. تُقرأ في الوصل تاءً في الحالتين. وأما في الوقف: فما رُسم بالتاء المربوطة يوقف عليه بالهاء، وما رُسم بالتاء المفتوحة يوقف عليه بالتاء.":["The feminine tāʾ is written two ways in the Qurʾān: round (marbūṭah) and open. When joining, both are read as tāʾ. When stopping, the round one becomes hāʾ and the open one stays tāʾ.","Den feminine tāʾ skrives på to måder i Koranen: rund (marbūṭah) og åben. Ved sammenhæng læses begge som tāʾ. Ved stop bliver den runde til hāʾ, og den åbne forbliver tāʾ."],"رَحْمَة ← رَحْمَهْ، رَحْمَت ← رَحْمَتْ.":["رَحْمَة ← رَحْمَهْ، رَحْمَت ← رَحْمَتْ.","رَحْمَة ← رَحْمَهْ، رَحْمَت ← رَحْمَتْ."],"بالتاء المفتوحة: يوقف بالتاء":["Open tāʾ: stop with tāʾ","Åben tāʾ: stop med tāʾ"],"بالتاء المربوطة: يوقف بالهاء":["Round tāʾ: stop with hāʾ","Rund tāʾ: stop med hāʾ"],"هاء السكت":["Hāʾ al-sakt (the pause hāʾ)","Hāʾ al-sakt (pause-hāʾ)"],"هاء تأتي في نهاية بعض الكلمات، وتُلفظ ساكنة وصلًا ووقفًا.":["A hāʾ at the end of some words, pronounced still when joining and stopping.","En hāʾ i slutningen af nogle ord, der udtales stille ved sammenhæng og stop."],"الحاقة: ١٩":["@","@"],"الحاقة: ٢٠":["@","@"],"الحاقة: ٢٨":["@","@"],"الحاقة: ٢٩":["@","@"],"القارعة: ١٠":["@","@"],"الأنعام: ٩٠":["@","@"],"البقرة: ٢٥٩":["@","@"],"ما يُراعى لحفص":["Special cases for Ḥafṣ","Særtilfælde for Ḥafṣ"],"كلمات لها حكم خاص في رواية حفص عن عاصم من طريق الشاطبية.":["Words with a special rule in the narration of Ḥafṣ from ʿĀṣim, by way of the Shāṭibiyyah.","Ord med en særlig regel i Ḥafṣ’ overlevering fra ʿĀṣim via Shāṭibiyyah."],"السين والصاد":["Sīn and ṣād","Sīn og ṣād"],"كلمات رُسمت بالصاد، ولكل منها حكم.":["Words written with ṣād, each with its own rule.","Ord skrevet med ṣād, hver med sin egen regel."],"«وَيَبْصُطُ» (البقرة: ٢٤٥) و«بَصْطَةً» (الأعراف: ٦٩): تُقرآن بالسين وجهًا واحدًا":["«وَيَبْصُطُ» (al-Baqarah 245) and «بَصْطَةً» (al-Aʿrāf 69): read with sīn only","«وَيَبْصُطُ» (al-Baqarah 245) og «بَصْطَةً» (al-Aʿrāf 69): læses kun med sīn"],"«الْمُصَيْطِرُونَ» (الطور: ٣٧): بالصاد والسين، والصاد مقدّم":["«الْمُصَيْطِرُونَ» (al-Ṭūr 37): with ṣād or sīn; ṣād is preferred","«الْمُصَيْطِرُونَ» (al-Ṭūr 37): med ṣād eller sīn; ṣād foretrækkes"],"«بِمُصَيْطِرٍ» (الغاشية: ٢٢): بالصاد فقط":["«بِمُصَيْطِرٍ» (al-Ghāshiyah 22): with ṣād only","«بِمُصَيْطِرٍ» (al-Ghāshiyah 22): kun med ṣād"],"«الم ۝ الله» أول آل عمران":["«الم ۝ الله» at the start of Āl ʿImrān","«الم ۝ الله» i begyndelsen af Āl ʿImrān"],"عند الوصل تُقرأ بفتح الميم، وتُمد ياء «ميم» حركتين أو ست حركات.":["When joining, the mīm takes a fatḥah, and the yāʾ of «mīm» is lengthened 2 or 6 counts.","Ved sammenhæng får mīm fatḥah, og yāʾ i «mīm» forlænges 2 eller 6 slag."],"«تَأْمَنَّا» في سورة يوسف":["«تَأْمَنَّا» in Sūrat Yūsuf","«تَأْمَنَّا» i Sūrat Yūsuf"],"تُقرأ بوجهين: الاختلاس (الروم) وهو المقدّم، أو الإشمام. وأصلها «تَأْمَنُنَا» بنونين.":["Read two ways: ikhtilās (rawm), which is preferred, or ishmām. It comes from «تَأْمَنُنَا», with two nūns.","Læses på to måder: ikhtilās (rawm), som foretrækkes, eller ishmām. Det kommer af «تَأْمَنُنَا» med to nūn."],"«ضَعْف» في سورة الروم":["«ضَعْف» in Sūrat al-Rūm","«ضَعْف» i Sūrat al-Rūm"],"في مواضعها الثلاثة (الروم: ٥٤) وجهان: فتح الضاد وهو المقدّم، أو ضمها.":["In its three places (al-Rūm 54) there are two ways: fatḥah on the ḍād, which is preferred, or ḍammah.","På dens tre steder (al-Rūm 54) er der to måder: fatḥah på ḍād, som foretrækkes, eller ḍammah."],"«آتَانِيَ» في سورة النمل":["«آتَانِيَ» in Sūrat al-Naml","«آتَانِيَ» i Sūrat al-Naml"],"فيها وجهان وقفًا: «آتَانْ» بحذف الياء، أو «آتَانِي» بإثباتها ساكنة.":["Two ways when stopping: «آتَانْ», dropping the yāʾ, or «آتَانِي», keeping it still.","To måder ved stop: «آتَانْ», hvor yāʾ udelades, eller «آتَانِي», hvor den beholdes stille."],"«ءَأَعْجَمِيٌّ» في سورة فصلت":["«ءَأَعْجَمِيٌّ» in Sūrat Fuṣṣilat","«ءَأَعْجَمِيٌّ» i Sūrat Fuṣṣilat"],"التسهيل":["Tashīl (softening)","Tashīl (blødgøring)"],"تُقرأ الهمزة الثانية بالتسهيل وجهًا واحدًا، أي بين الهمزة والألف.":["The second hamzah is softened, one way only: between hamzah and alif.","Den anden hamzah blødgøres, kun én måde: mellem hamzah og alif."],"«مَجْرَاهَا» في سورة هود":["«مَجْرَاهَا» in Sūrat Hūd","«مَجْرَاهَا» i Sūrat Hūd"],"الإمالة":["Imālah (leaning)","Imālah (hældning)"],"تُقرأ بإمالة الألف، وتُرقّق الراء بسببها. وهي الإمالة الوحيدة في رواية حفص.":["The alif is read with imālah (leaning toward “ē”), and the rāʾ becomes light because of it. This is the only imālah in Ḥafṣ’s narration.","Alif læses med imālah (hælder mod “ē”), og rāʾ bliver let på grund af det. Det er den eneste imālah i Ḥafṣ’ overlevering."],"الجدول الكامل":["The full table","Hele tabellen"],"ما يُراعى":["What to observe","Hvad man skal være opmærksom på"],"البقرة: ٢٤٥":["@","@"],"بالسين وجهًا واحدًا":["With sīn only","Kun med sīn"],"الأعراف: ٦٩":["@","@"],"الطور: ٣٧":["@","@"],"بالصاد والسين، والصاد مقدّم":["With ṣād or sīn; ṣād is preferred","Med ṣād eller sīn; ṣād foretrækkes"],"الغاشية: ٢٢":["@","@"],"بالصاد فقط":["With ṣād only","Kun med ṣād"],"آل عمران: ١":["@","@"],"وصلًا بفتح الميم، وتُمد ٢ أو ٦":["When joining: mīm with fatḥah, lengthened 2 or 6","Ved sammenhæng: mīm med fatḥah, forlænget 2 eller 6"],"يوسف: ١١":["@","@"],"الاختلاس وهو المقدّم، أو الإشمام":["Ikhtilās (preferred) or ishmām","Ikhtilās (foretrukket) eller ishmām"],"الروم: ٥٤":["@","@"],"فتح الضاد وهو المقدّم، أو ضمها":["Fatḥah on the ḍād (preferred) or ḍammah","Fatḥah på ḍād (foretrukket) eller ḍammah"],"وصلًا: السكت وهو المقدّم، أو الإدغام":["When joining: sakt (preferred) or idghām","Ved sammenhæng: sakt (foretrukket) eller idghām"],"الأنفال – التوبة":["Al-Anfāl – al-Tawbah","Al-Anfāl – al-Tawbah"],"الوقف أو السكت أو الوصل":["Stop, sakt or join","Stop, sakt eller sammenhæng"],"النمل: ٣٦":["@","@"],"وقفًا: آتَانْ، أو آتَانِي":["When stopping: آتَانْ or آتَانِي","Ved stop: آتَانْ eller آتَانِي"],"ابتداءً: أَلِسْمُ وهو المقدّم، أو لِسْمُ":["When starting: أَلِسْمُ (preferred) or لِسْمُ","Ved start: أَلِسْمُ (foretrukket) eller لِسْمُ"],"وقفًا: سَلَاسِلْ وهو المقدّم، أو سَلَاسِلَا":["When stopping: سَلَاسِلْ (preferred) or سَلَاسِلَا","Ved stop: سَلَاسِلْ (foretrukket) eller سَلَاسِلَا"],"الشعراء: ١٧٦":["@","@"],"يُبدأ بهمزة وصل مفتوحة":["Start with hamzat al-waṣl and fatḥah","Begynd med hamzat al-waṣl og fatḥah"],"المرسلات: ٢٠":["@","@"],"إدغام القاف في الكاف إدغامًا كاملًا":["Full idghām of qāf into kāf","Fuld idghām af qāf ind i kāf"],"مريم، الشورى":["Maryam, al-Shūrā","Maryam, al-Shūrā"],"مد العين ٤ أو ٦ حركات":["The ʿayn is lengthened 4 or 6 counts","ʿAyn forlænges 4 eller 6 slag"],"يوسف: ٩٩، سبأ: ١٢":["@","@"],"وقفًا: التفخيم أو الترقيق":["When stopping: heavy or light","Ved stop: tung eller let"],"الشعراء: ٦٣":["@","@"],"وصلًا: التفخيم أو الترقيق":["When joining: heavy or light","Ved sammenhæng: tung eller let"],"الأنعام، يونس، النمل":["Al-Anʿām, Yūnus, al-Naml","Al-Anʿām, Yūnus, al-Naml"],"الإبدال مع المد ٦، أو التسهيل":["Change to a madd of 6, or tashīl","Omdan til madd på 6, eller tashīl"],"القلم: ١":["@","@"],"إظهار النون عند الواو":["Clear nūn before wāw","Tydelig nūn foran wāw"],"يس: ١–٢":["@","@"],"الفرقان: ٦٩":["@","@"],"فيها صلة مع أنها خارج القاعدة":["Extended even though it breaks the rule","Forlænges, selvom den bryder reglen"],"الزمر: ٧":["@","@"],"لا صلة فيها مع توفر الشروط":["Not extended even though the conditions are met","Forlænges ikke, selvom betingelserne er opfyldt"],"فصلت: ٤٤":["@","@"],"تسهيل الهمزة الثانية وجهًا واحدًا":["Softening the second hamzah, one way only","Blødgøring af den anden hamzah, kun én måde"],"هود: ٤١":["@","@"],"إمالة الألف وترقيق الراء":["Imālah on the alif and a light rāʾ","Imālah på alif og let rāʾ"],"السجدات":["Prostrations of recitation","Recitationens nedkastelser"],"سجود التلاوة":["Sujūd al-tilāwah","Sujūd al-tilāwah"],"في القرآن آيات تسمى آيات السجدة. إذا قرأها الإنسان أو سمعها سجد لله تعالى على سبعة أعضاء. وهي في خمسة عشر موضعًا.":["Some verses of the Qurʾān are called verses of prostration. Whoever recites or hears them prostrates to Allah on seven body parts. There are fifteen of them.","Nogle vers i Koranen kaldes nedkastelsesvers. Den, der reciterer eller hører dem, kaster sig ned for Allah på syv legemsdele. Der er femten af dem."],"السجدة سنّة مؤكدة عند جمهور العلماء.":["According to most scholars it is a confirmed sunnah.","Ifølge de fleste lærde er det en bekræftet sunnah."],"الأعراف: ٢٠٦":["@","@"],"الرعد: ١٥":["@","@"],"النحل: ٥٠":["@","@"],"الإسراء: ١٠٩":["@","@"],"مريم: ٥٨":["@","@"],"الحج: ١٨":["@","@"],"الحج: ٧٧":["@","@"],"الفرقان: ٦٠":["@","@"],"النمل: ٢٦":["@","@"],"السجدة: ١٥":["@","@"],"ص: ٢٤":["@","@"],"فصلت: ٣٨":["@","@"],"النجم: ٦٢":["@","@"],"الانشقاق: ٢١":["@","@"],"العلق: ١٩":["@","@"],"إذا وقعت في الصلاة كبّر للسجدة فسجد سجدة واحدة ثم كبّر للرفع. وأما خارج الصلاة فالتكبير والتسليم موضع خلاف بين العلماء.":["In prayer, one says takbīr, prostrates once, then says takbīr when rising. Outside prayer, whether takbīr and taslīm are said is a matter of scholarly difference.","I bønnen siger man takbīr, kaster sig ned én gang og siger takbīr, når man rejser sig. Uden for bønnen er der uenighed blandt de lærde om takbīr og taslīm."],"الدعاء المستحب في السجدة":["Recommended supplications in the prostration","Anbefalede bønner under nedkastelsen"],"سبحان ربي الأعلى.":["سبحان ربي الأعلى — Glory be to my Lord, the Most High.","سبحان ربي الأعلى — Ære være min Herre, den Højeste."],"سبحانك اللهم ربنا وبحمدك، اللهم اغفر لي.":["سبحانك اللهم ربنا وبحمدك، اللهم اغفر لي — Glory be to You, O Allah, our Lord, and praise; O Allah, forgive me.","سبحانك اللهم ربنا وبحمدك، اللهم اغفر لي — Ære være Dig, o Allah, vor Herre, og lovprisning; o Allah, tilgiv mig."],"اللهم لك سجدت، وبك آمنت، ولك أسلمت. سجد وجهي للذي خلقه وصوّره وشقّ سمعه وبصره بحوله وقوته.":["O Allah, to You I have prostrated, in You I believe, and to You I submit. My face prostrates to the One who created it, shaped it, and gave it hearing and sight by His might and power.","O Allah, for Dig har jeg kastet mig ned, på Dig tror jeg, og Dig underkaster jeg mig. Mit ansigt kaster sig ned for Ham, der skabte det, formede det og gav det hørelse og syn ved Sin magt og kraft."],"اللهم اكتب لي بها أجرًا، وضع عني بها وزرًا، واجعلها لي عندك ذخرًا، وتقبّلها مني كما تقبّلتها من عبدك داود.":["O Allah, record a reward for me through it, remove a sin from me through it, keep it as a treasure for me with You, and accept it from me as You accepted it from Your servant Dāwūd.","O Allah, skriv en belønning for mig ved den, fjern en synd fra mig ved den, gem den som en skat for mig hos Dig, og tag imod den fra mig, som Du tog imod den fra Din tjener Dāwūd."],"وآخر دعوانا أن الحمد لله رب العالمين، وصلى الله على نبينا محمد وعلى آله وصحبه وسلم.":["And our final prayer is: praise be to Allah, Lord of the worlds, and may Allah send blessings and peace upon our Prophet Muḥammad, his family and his Companions.","Og vores sidste bøn er: lovet være Allah, verdenernes Herre, og må Allah sende velsignelse og fred over vor Profet Muḥammad, hans familie og hans Ledsagere."]};

/* "البقرة: ٢٤٥، الأعراف: ٦٩" -> "Al-Baqarah 245, Al-Aʿrāf 69" */
function refT(s){
  if(LANG==="ar") return s;
  return String(s).split("،").map(p=>{ p = p.trim(); const m = p.match(/^(.+?):\s*([٠-٩0-9–\-]+)$/); if(!m) return LAT(p); const n = SURA[m[1].trim()]; return n ? n+" "+LAT(m[2]) : LAT(p); }).join(", ");
}
/* content string -> current language */
function trC(s){
  if(LANG==="ar" || typeof s!=="string") return s;
  const t = TRD[s.trim()];
  if(t){ const x = t[LI()]; return x==="@" ? refT(s) : x; }
  return HAS_AR(s) ? s : LAT(s);
}

/* every translatable slot in the content, remembered with its Arabic original */
const SL = [];
function slot(o, k, kind){ if(o && typeof o[k]==="string" && o[k].trim()) SL.push([o, k, o[k], kind||"c"]); }
function collectSlots(){
  PARTS.forEach(p=>slot(p,1));
  CH.forEach(c=>{ slot(c,"t"); c.b.forEach(b=>{
    switch(b.k){
      case "p": case "note": case "mnote": case "h": slot(b,"t"); break;
      case "rows": b.r.forEach(r=>{ slot(r,0); slot(r,1); }); break;
      case "list": b.items.forEach((_,i)=>slot(b.items,i)); break;
      case "steps": b.items.forEach(r=>{ slot(r,0); slot(r,1); }); break;
      case "chips": b.w.forEach((_,i)=>slot(b.w,i)); break;
      case "quotes": b.q.forEach(r=>{ slot(r,0); slot(r,1); }); break;
      case "poem": slot(b,"by"); break;
      case "ex": b.x.forEach(e=>slot(e,1,"ref")); break;
      case "rule": b.arName = b.name; ["name","alt","def","tip","h","ml","hs"].forEach(k=>slot(b,k)); (b.cond||[]).forEach((_,i)=>slot(b.cond,i)); (b.ex||[]).forEach(e=>slot(e,1,"ref")); break;
      case "cols": b.cols.forEach(o=>{ ["t","p","sub","big"].forEach(k=>slot(o,k)); (o.list||[]).forEach((_,i)=>slot(o.list,i)); }); break;
      case "tbl": b.h.forEach((_,i)=>slot(b.h,i)); b.r.forEach(r=>r.forEach((_,i)=>{ if(!(b.q||[]).includes(i)) slot(r,i); })); break;
      case "chain": b.parts.forEach((_,i)=>slot(b.parts,i)); b.rows.forEach(r=>{ slot(r,0); slot(r,2); }); break;
      case "tree": slot(b,"root"); { const w = n=>{ slot(n,"t"); (n.kids||[]).forEach(w); }; b.kids.forEach(w); } break;
    }
  }); });
}

const ITBAQ = new Set(["ص","ض","ط","ظ"]);
function catmull(pts){
  const n = pts.length; let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n], p1=pts[i], p2=pts[(i+1)%n], p3=pts[(i+2)%n];
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d+"Z";
}
const MS = {}; /* live mouth state, tweened */
function mouthTarget(L){
  const m = LMK[L], cfg = MP[m] || {};
  const T = REST.map((p,i)=> (cfg.t && cfg.t[i]) ? cfg.t[i].slice() : p.slice());
  if(ITBAQ.has(L)){ T[3]=[156,117]; T[4]=[190,121]; if(m===12||m===13||m===11){ T[2]=[124,124]; } }
  const nasal = (L==="م"||L==="ن");
  const st = {};
  T.forEach((p,i)=>{ st["x"+i]=p[0]; st["y"+i]=p[1]; });
  let ux=0, uy=0, lx=0, ly=cfg.open||0;
  if(cfg.lip==="f"){ lx=7; ly=-9; }
  if(cfg.lip==="b" && L!=="و"){ uy=4; ly=-6; }
  if(L==="و"){ ux=-5; uy=2; lx=-5; ly=-3; }
  Object.assign(st,{ux,uy,lx,ly, vx: nasal||m===16 ? 221 : (cfg.vel?cfg.vel[0]:243), vy: nasal||m===16 ? 147 : (cfg.vel?cfg.vel[1]:121)});
  return {st, cfg, m, nasal, itbaq:ITBAQ.has(L)};
}
function drawMouth(root){
  const s = MS[root.id]; if(!s) return;
  const pts = []; for(let i=0;i<7;i++) pts.push([s["x"+i], s["y"+i]]);
  root.querySelector(".tg").setAttribute("d", catmull([...pts, ...TBOT]));
  root.querySelector(".vel").setAttribute("d", `M184,108 C204,106 ${s.vx-8},${s.vy-14} ${s.vx},${s.vy} C${s.vx-3},${s.vy+5} ${s.vx-10},${s.vy+2} ${s.vx-16},${s.vy-6} C${(s.vx+184)/2},${(s.vy+118)/2+2} 200,118 184,118Z`);
  root.querySelector(".ulip").setAttribute("transform", `translate(${s.ux},${s.uy})`);
  root.querySelector(".llip").setAttribute("transform", `translate(${s.lx},${s.ly})`);
}

const mouthTL = {};
function mouthTo(root, L, instant){
  const {st, cfg, m, nasal, itbaq} = mouthTarget(L);
  if(!MS[root.id]){ MS[root.id] = Object.assign({}, st); instant = true; }
  const g = instant ? null : G();
  if(mouthTL[root.id]) mouthTL[root.id].kill();
  const pulse = root.querySelector(".pulse"), ring = pulse.querySelector("circle");
  const set = (sel, v) => { const el = root.querySelector(sel); if(g) g.to(el,{opacity:v,duration:.3}); else el.setAttribute("opacity", v); };
  root.querySelector(".cap").textContent = (nasal ? tx("مع غنة من الخيشوم") : "") + (itbaq ? (nasal?" · ":"")+tx("مع إطباق اللسان") : "");
  if(!g){
    Object.assign(MS[root.id], st); drawMouth(root);
    if(cfg.p){ pulse.setAttribute("transform",`translate(${cfg.p[0]},${cfg.p[1]})`); pulse.setAttribute("opacity",1); } else pulse.setAttribute("opacity",0);
    ["jf","air-n","air-o","edge","lar"].forEach(c=>root.querySelector("."+c).setAttribute("opacity",0));
    if(cfg.jawf) root.querySelector(".jf").setAttribute("opacity",.22);
    if(nasal||m===16) root.querySelector(".air-n").setAttribute("opacity",.9);
    if(cfg.edge) root.querySelector(".edge").setAttribute("opacity",1);
    if(cfg.larynx) root.querySelector(".lar").setAttribute("opacity",1);
    return;
  }
  const tl = g.timeline(); mouthTL[root.id] = tl;
  tl.to(pulse,{opacity:0,duration:.15},0);
  ["jf","air-n","air-o","edge","lar"].forEach(c=>tl.to(root.querySelector("."+c),{opacity:0,duration:.2},0));
  tl.to(MS[root.id], Object.assign({}, st, {duration:.65, ease:"power3.inOut", onUpdate:()=>drawMouth(root)}), 0.05);
  if(cfg.trill) tl.to(MS[root.id], {y0:st.y0+2.5, duration:.07, repeat:5, yoyo:true, ease:"sine.inOut", onUpdate:()=>drawMouth(root)});
  if(cfg.p){
    tl.set(pulse,{attr:{transform:`translate(${cfg.p[0]},${cfg.p[1]})`}}, .55);
    tl.fromTo(pulse,{opacity:0},{opacity:1,duration:.2}, .6);
    tl.fromTo(ring,{attr:{r:5}},{attr:{r:18},opacity:0,duration:.9,repeat:2,ease:"power1.out"}, .6);
  }
  if(cfg.jawf) tl.to(root.querySelector(".jf"),{opacity:.22,duration:.5,yoyo:true,repeat:4}, .5);
  if(cfg.edge) tl.fromTo(root.querySelector(".edge"),{opacity:0,attr:{"stroke-dasharray":"0 80"}},{opacity:1,attr:{"stroke-dasharray":"80 0"},duration:.9,ease:"power2.out"}, .6);
  if(cfg.larynx) tl.to(root.querySelector(".lar"),{opacity:1,duration:.12,repeat:6,yoyo:true}, .5);
  const airs = [];
  if(nasal||m===16) airs.push(root.querySelector(".air-n"));
  if(cfg.jawf||cfg.hiss) airs.push(root.querySelector(".air-o"));
  airs.forEach(a=>{ tl.to(a,{opacity:.9,duration:.25}, .55); tl.fromTo(a,{attr:{"stroke-dashoffset":0}},{attr:{"stroke-dashoffset":-140},duration:2.2,ease:"none"}, .55); });
}

function tour(mid){

function animateRosette(){
  const g = G(), tiles = document.querySelectorAll(".rosette .tile");

  const tl = g.timeline();
  tl.from(".rosette .ros-all", {rotation:-18, svgOrigin:"0 0", duration:1.6, ease:"power3.out"}, 0);
  tl.from(".rosette .ros-heart", {scale:0, transformOrigin:"50% 50%", duration:.6, ease:"back.out(2)"}, 0);
  tl.from(tiles, {scale:0, opacity:0, transformOrigin:"50% 100%", duration:.6, ease:"back.out(1.6)", stagger:{each:.0045, from:"end"}}, .05);
  const fr = document.querySelectorAll(".rosette .tile[data-fresh]");
  if(fr.length){
    const names = [...new Set((S.fresh||[]).map(id=>CMAP[id]&&CMAP[id].t).filter(Boolean))];
    tl.add(()=>{ fr.forEach(t=>{ t.classList.remove("e"); t.classList.add("f"); });

  }
}

  const g = G(); if(g && el) g.fromTo(el,{scale:1.25,transformOrigin:"50% 100%"},{scale:1,duration:.6,ease:"elastic.out(1,.5)"});
}

const HKEYS = Object.keys(HERO).filter(k=>AY[k] && heroRule(k));
function heroRule(id){ return BYID[id.replace(/_\d+$/,"")] || null; }
const HBYCH = {}; HKEYS.forEach(k=>{ const c = heroRule(k).ch; (HBYCH[c] = HBYCH[c] || []).push(k); });
let heroId = HKEYS[Math.floor(Date.now()/86400000) % Math.max(1,HKEYS.length)], heroFirst = true, heroQ = [], heroRAF = null;
function heroPickNext(){
  const curCh = heroRule(heroId).ch;
  if(!heroQ.length) heroQ = shuffle(Object.keys(HBYCH));
  let c = heroQ.shift(); if(c===curCh){ heroQ.push(c); c = heroQ.shift(); }
  return pick(HBYCH[c]);
}

      </div>
